name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=prisma-tenant/schema.prisma
      - run: npx prisma generate --schema=prisma-admin/schema.prisma
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=prisma-tenant/schema.prisma
      - run: npx prisma generate --schema=prisma-admin/schema.prisma
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: greatlibrary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TENANT_DATABASE_URL: postgresql://test:test@localhost:5432/greatlibrary_test
      ADMIN_DATABASE_URL: postgresql://test:test@localhost:5432/greatlibrary_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema=prisma-tenant/schema.prisma
      - run: npx prisma generate --schema=prisma-admin/schema.prisma
      - run: npm run test
