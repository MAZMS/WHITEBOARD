<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whiteboard</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #fafafa; --fg: #1a1a1a; --dim: #888; --border: #e2e2e2;
      --surface: #fff; --surface-hover: #f5f5f5; --accent: #2d2d2d;
      --shadow: rgba(0,0,0,.06); --shadow-lg: rgba(0,0,0,.1);
      --toolbar-bg: rgba(255,255,255,.92); --overlay-bg: rgba(0,0,0,.3);
      --radius: 12px; --radius-sm: 8px; --radius-xs: 6px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      --ease: cubic-bezier(.16,1,.3,1); --ease-bounce: cubic-bezier(.34,1.56,.64,1);
    }
    [data-theme="dark"] {
      --bg: #0a0a0a; --fg: #e8e8e8; --dim: #666; --border: #222;
      --surface: #141414; --surface-hover: #1a1a1a; --accent: #e0e0e0;
      --shadow: rgba(0,0,0,.3); --shadow-lg: rgba(0,0,0,.5);
      --toolbar-bg: rgba(20,20,20,.92); --overlay-bg: rgba(0,0,0,.6);
    }
    body {
      font-family: var(--font); background: var(--bg); color: var(--fg);
      overflow: hidden; height: 100vh; width: 100vw; cursor: default;
      transition: background .3s var(--ease), color .3s var(--ease);
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }
    button { font-family: var(--font); cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }

    /* ── Canvas ── */
    #whiteboard {
      position: absolute; inset: 0; z-index: 1;
      background-image: radial-gradient(circle, var(--border) .5px, transparent .5px);
      background-size: 24px 24px;
      transition: background .3s var(--ease);
    }
    #draw-canvas {
      position: absolute; inset: 0; z-index: 2;
      pointer-events: none;
    }
    #draw-canvas.active { pointer-events: auto; cursor: crosshair; }

    /* ── Toolbar ── */
    #toolbar {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 100; display: flex; align-items: center; gap: 2px;
      background: var(--toolbar-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 16px; padding: 6px;
      box-shadow: 0 4px 24px var(--shadow-lg), 0 0 0 1px var(--shadow);
      transition: all .3s var(--ease);
    }
    .tool-btn {
      display: flex; align-items: center; justify-content: center;
      width: 42px; height: 42px; border-radius: var(--radius-sm);
      border: none; background: none; color: var(--dim); font-size: 18px;
      transition: all .2s var(--ease); position: relative;
    }
    .tool-btn:hover { background: var(--surface-hover); color: var(--fg); }
    .tool-btn.active { background: var(--fg); color: var(--bg); }
    .tool-btn svg { width: 20px; height: 20px; }
    .tool-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
    .tool-btn .tooltip {
      position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
      background: var(--fg); color: var(--bg); font-size: 11px; font-weight: 500;
      padding: 4px 10px; border-radius: var(--radius-xs); white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity .15s var(--ease);
    }
    .tool-btn:hover .tooltip { opacity: 1; }

    /* ── Top bar ── */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 90;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; background: var(--toolbar-bg);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      transition: all .3s var(--ease);
    }
    #topbar-left { display: flex; align-items: center; gap: 12px; }
    #topbar-right { display: flex; align-items: center; gap: 8px; }
    #board-name {
      font-size: 14px; font-weight: 600; background: none; border: none;
      color: var(--fg); padding: 6px 10px; border-radius: var(--radius-xs);
      transition: background .2s var(--ease); min-width: 120px;
    }
    #board-name:hover { background: var(--surface-hover); }
    #board-name:focus { background: var(--surface); outline: 2px solid var(--accent); }
    .topbar-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      height: 34px; padding: 0 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--surface); color: var(--dim);
      font-size: 12px; font-weight: 500; transition: all .2s var(--ease);
    }
    .topbar-btn:hover { border-color: var(--dim); color: var(--fg); }
    .topbar-btn svg { width: 16px; height: 16px; }
    .topbar-icon-btn {
      display: flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--surface); color: var(--dim);
      transition: all .2s var(--ease);
    }
    .topbar-icon-btn:hover { border-color: var(--dim); color: var(--fg); }
    .topbar-icon-btn svg { width: 16px; height: 16px; }
    .save-indicator {
      font-size: 11px; color: var(--dim); padding: 0 8px;
      transition: opacity .3s var(--ease);
    }

    /* ── Board elements ── */
    .board-element {
      position: absolute; z-index: 10; cursor: grab; user-select: none;
      transition: box-shadow .2s var(--ease);
    }
    .board-element:active { cursor: grabbing; }
    .board-element.selected {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }

    /* ── Sticky Note ── */
    .sticky-note {
      min-width: 200px; min-height: 120px; padding: 16px;
      border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--surface); box-shadow: 0 2px 8px var(--shadow);
      font-size: 14px; line-height: 1.6;
    }
    .sticky-note:hover { box-shadow: 0 4px 16px var(--shadow-lg); }
    .sticky-note textarea {
      width: 100%; height: 100%; min-height: 80px; border: none; background: none;
      color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.6;
      resize: none; outline: none;
    }
    .sticky-note .note-actions {
      position: absolute; top: -10px; right: -10px;
      display: flex; gap: 4px; opacity: 0; transition: opacity .15s var(--ease);
    }
    .sticky-note:hover .note-actions { opacity: 1; }
    .note-action-btn {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--fg); color: var(--bg); border: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; transition: transform .15s var(--ease);
    }
    .note-action-btn:hover { transform: scale(1.15); }

    /* ── Image element ── */
    .image-element {
      border-radius: var(--radius); overflow: hidden;
      border: 1px solid var(--border); background: var(--surface);
      box-shadow: 0 2px 8px var(--shadow);
    }
    .image-element:hover { box-shadow: 0 4px 16px var(--shadow-lg); }
    .image-element img {
      display: block; max-width: 400px; max-height: 400px;
      object-fit: contain; pointer-events: none;
    }
    .image-element .img-actions {
      position: absolute; top: -10px; right: -10px;
      display: flex; gap: 4px; opacity: 0; transition: opacity .15s var(--ease);
    }
    .image-element:hover .img-actions { opacity: 1; }

    /* ── Text element ── */
    .text-element {
      min-width: 100px; padding: 8px 12px;
      font-size: 18px; font-weight: 400; line-height: 1.5;
    }
    .text-element [contenteditable] {
      outline: none; min-width: 60px; min-height: 1em;
    }
    .text-element .text-actions {
      position: absolute; top: -10px; right: -10px;
      display: flex; gap: 4px; opacity: 0; transition: opacity .15s var(--ease);
    }
    .text-element:hover .text-actions { opacity: 1; }

    /* ── Shape element ── */
    .shape-element {
      border: 2px solid var(--fg); background: none;
    }
    .shape-element.circle { border-radius: 50%; }
    .shape-element .shape-actions {
      position: absolute; top: -10px; right: -10px;
      display: flex; gap: 4px; opacity: 0; transition: opacity .15s var(--ease);
    }
    .shape-element:hover .shape-actions { opacity: 1; }

    /* ── Modal / Overlay ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 500; background: var(--overlay-bg);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center;
      animation: fadeIn .2s var(--ease);
    }
    .modal-overlay.visible { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px; width: 90%; max-width: 520px;
      box-shadow: 0 24px 48px var(--shadow-lg);
      animation: modalIn .3s var(--ease-bounce);
    }
    .modal h2 {
      font-size: 18px; font-weight: 600; margin-bottom: 4px;
    }
    .modal p { font-size: 13px; color: var(--dim); margin-bottom: 20px; }
    .modal-input {
      width: 100%; padding: 12px 16px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); background: var(--bg); color: var(--fg);
      font-family: var(--font); font-size: 14px; transition: border-color .2s var(--ease);
    }
    .modal-input:focus { border-color: var(--accent); outline: none; }
    .modal-input::placeholder { color: var(--dim); }
    .modal-actions {
      display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end;
    }
    .modal-btn {
      padding: 10px 20px; border-radius: var(--radius-sm); font-size: 13px;
      font-weight: 500; transition: all .2s var(--ease); border: 1px solid var(--border);
      background: var(--surface); color: var(--fg);
    }
    .modal-btn:hover { background: var(--surface-hover); }
    .modal-btn.primary {
      background: var(--fg); color: var(--bg); border-color: var(--fg);
    }
    .modal-btn.primary:hover { opacity: .85; }

    /* ── Image grid in modal ── */
    .image-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      margin-top: 16px; max-height: 300px; overflow-y: auto;
    }
    .image-grid-item {
      aspect-ratio: 4/3; border-radius: var(--radius-sm); overflow: hidden;
      border: 2px solid transparent; cursor: pointer;
      transition: all .2s var(--ease);
    }
    .image-grid-item:hover { border-color: var(--accent); transform: scale(1.03); }
    .image-grid-item.selected { border-color: var(--accent); }
    .image-grid-item img {
      width: 100%; height: 100%; object-fit: cover;
    }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
      z-index: 999; background: var(--fg); color: var(--bg);
      font-size: 13px; font-weight: 500; padding: 10px 20px;
      border-radius: var(--radius-sm); opacity: 0; pointer-events: none;
      transition: all .3s var(--ease); box-shadow: 0 4px 16px var(--shadow-lg);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Loading spinner ── */
    .spinner {
      width: 20px; height: 20px; border: 2px solid var(--border);
      border-top-color: var(--fg); border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    .spinner-sm { width: 14px; height: 14px; }

    /* ── Boards panel ── */
    #boards-panel {
      position: fixed; left: 0; top: 0; bottom: 0; width: 280px; z-index: 200;
      background: var(--surface); border-right: 1px solid var(--border);
      transform: translateX(-100%); transition: transform .3s var(--ease);
      display: flex; flex-direction: column;
    }
    #boards-panel.visible { transform: translateX(0); }
    #boards-panel-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    #boards-panel-header h3 {
      font-size: 14px; font-weight: 600;
    }
    #boards-list {
      flex: 1; overflow-y: auto; padding: 8px;
    }
    .board-item {
      padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer;
      font-size: 13px; color: var(--dim); transition: all .15s var(--ease);
      display: flex; align-items: center; justify-content: space-between;
    }
    .board-item:hover { background: var(--surface-hover); color: var(--fg); }
    .board-item.active { background: var(--fg); color: var(--bg); }
    .board-item .board-date { font-size: 10px; opacity: .6; }
    #new-board-btn {
      margin: 8px; padding: 10px; border-radius: var(--radius-sm);
      border: 1px dashed var(--border); background: none; color: var(--dim);
      font-size: 13px; transition: all .2s var(--ease);
    }
    #new-board-btn:hover { border-color: var(--dim); color: var(--fg); }

    /* ── Color picker (pen) ── */
    #pen-options {
      position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%);
      z-index: 99; background: var(--toolbar-bg); backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 10px 14px; display: none; gap: 8px; align-items: center;
      box-shadow: 0 4px 16px var(--shadow-lg);
    }
    #pen-options.visible { display: flex; }
    .color-dot {
      width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; transition: all .15s var(--ease);
    }
    .color-dot:hover { transform: scale(1.2); }
    .color-dot.active { border-color: var(--fg); transform: scale(1.15); }
    .pen-size-btn {
      width: 32px; height: 32px; border-radius: var(--radius-xs);
      border: 1px solid var(--border); background: none; color: var(--dim);
      font-size: 11px; font-weight: 600; transition: all .15s var(--ease);
    }
    .pen-size-btn:hover { border-color: var(--dim); color: var(--fg); }
    .pen-size-btn.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }

    /* ── Animations ── */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modalIn { 0% { opacity: 0; transform: scale(.95) translateY(8px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes elementIn { 0% { opacity: 0; transform: scale(.9); } 100% { opacity: 1; transform: scale(1); } }

    .element-enter { animation: elementIn .3s var(--ease-bounce); }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      #toolbar { bottom: 12px; padding: 4px; gap: 1px; }
      .tool-btn { width: 36px; height: 36px; font-size: 15px; }
      #topbar { padding: 8px 12px; }
      #boards-panel { width: 240px; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Top bar -->
  <div id="topbar">
    <div id="topbar-left">
      <button class="topbar-icon-btn" onclick="toggleBoardsPanel()" title="Boards">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </button>
      <input id="board-name" value="Untitled Board" spellcheck="false" />
      <span class="save-indicator" id="save-indicator"></span>
    </div>
    <div id="topbar-right">
      <button class="topbar-btn" onclick="saveBoard()" id="save-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>
        Save
      </button>
      <button class="topbar-btn" onclick="clearBoard()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3,6 5,6 21,6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        Clear
      </button>
      <button class="topbar-icon-btn" onclick="toggleTheme()" title="Toggle theme">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </div>

  <!-- Boards side panel -->
  <div id="boards-panel">
    <div id="boards-panel-header">
      <h3>Boards</h3>
      <button class="topbar-icon-btn" onclick="toggleBoardsPanel()" style="border:none;background:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="boards-list"></div>
    <button id="new-board-btn" onclick="createNewBoard()">+ New Board</button>
  </div>

  <!-- Whiteboard -->
  <div id="whiteboard" onmousedown="onCanvasMouseDown(event)"></div>
  <canvas id="draw-canvas"></canvas>

  <!-- Toolbar -->
  <div id="toolbar">
    <button class="tool-btn active" data-tool="select" onclick="setTool('select')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
      <span class="tooltip">Select (V)</span>
    </button>
    <button class="tool-btn" data-tool="pen" onclick="setTool('pen')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
      <span class="tooltip">Draw (P)</span>
    </button>
    <button class="tool-btn" data-tool="text" onclick="setTool('text')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,7 4,4 20,4 20,7"/><line x1="9.5" y1="20" x2="14.5" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
      <span class="tooltip">Text (T)</span>
    </button>
    <button class="tool-btn" data-tool="note" onclick="setTool('note')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14.5 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V7.5L14.5 2z"/><polyline points="14,2 14,8 20,8"/></svg>
      <span class="tooltip">Sticky Note (N)</span>
    </button>
    <button class="tool-btn" data-tool="shape" onclick="setTool('shape')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      <span class="tooltip">Shape (S)</span>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" onclick="openImageGenModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg>
      <span class="tooltip">AI Image (I)</span>
    </button>
    <button class="tool-btn" onclick="openWebCaptureModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
      <span class="tooltip">Web Image (W)</span>
    </button>
    <div class="tool-sep"></div>
    <button class="tool-btn" data-tool="eraser" onclick="setTool('eraser')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 20H7L3 16c-.8-.8-.8-2 0-2.8L14.8 1.4c.8-.8 2-.8 2.8 0L21 4.8c.8.8.8 2 0 2.8L12 16"/><line x1="6" y1="20" x2="20" y2="20"/></svg>
      <span class="tooltip">Eraser (E)</span>
    </button>
  </div>

  <!-- Pen options bar -->
  <div id="pen-options">
    <div class="color-dot active" style="background:#1a1a1a" data-color="#1a1a1a" onclick="setPenColor(this)"></div>
    <div class="color-dot" style="background:#e74c3c" data-color="#e74c3c" onclick="setPenColor(this)"></div>
    <div class="color-dot" style="background:#3498db" data-color="#3498db" onclick="setPenColor(this)"></div>
    <div class="color-dot" style="background:#2ecc71" data-color="#2ecc71" onclick="setPenColor(this)"></div>
    <div class="color-dot" style="background:#f39c12" data-color="#f39c12" onclick="setPenColor(this)"></div>
    <div class="color-dot" style="background:#9b59b6" data-color="#9b59b6" onclick="setPenColor(this)"></div>
    <div class="tool-sep"></div>
    <button class="pen-size-btn active" data-size="2" onclick="setPenSize(this)">S</button>
    <button class="pen-size-btn" data-size="4" onclick="setPenSize(this)">M</button>
    <button class="pen-size-btn" data-size="8" onclick="setPenSize(this)">L</button>
  </div>

  <!-- AI Image Generation Modal -->
  <div class="modal-overlay" id="image-gen-modal" onclick="if(event.target===this)closeModals()">
    <div class="modal">
      <h2>Generate Image with AI</h2>
      <p>Describe the image you want to create</p>
      <input class="modal-input" id="image-gen-prompt" placeholder="A serene mountain landscape at sunset..." />
      <div style="margin-top:12px">
        <select class="modal-input" id="image-gen-size" style="cursor:pointer;">
          <option value="1024x1024">Square (1024x1024)</option>
          <option value="1792x1024">Landscape (1792x1024)</option>
          <option value="1024x1792">Portrait (1024x1792)</option>
        </select>
      </div>
      <div id="image-gen-preview" style="margin-top:16px;text-align:center;display:none;">
        <img id="image-gen-result" style="max-width:100%;border-radius:8px;border:1px solid var(--border);" />
      </div>
      <div class="modal-actions">
        <button class="modal-btn" onclick="closeModals()">Cancel</button>
        <button class="modal-btn primary" id="image-gen-btn" onclick="generateImage()">Generate</button>
      </div>
    </div>
  </div>

  <!-- Web Image Capture Modal -->
  <div class="modal-overlay" id="web-capture-modal" onclick="if(event.target===this)closeModals()">
    <div class="modal">
      <h2>Capture Image from Web</h2>
      <p>Paste an image URL to add it to your board</p>
      <input class="modal-input" id="web-capture-url" placeholder="https://example.com/image.jpg" />
      <div id="web-capture-preview" style="margin-top:16px;text-align:center;display:none;">
        <img id="web-capture-result" style="max-width:100%;border-radius:8px;border:1px solid var(--border);" />
      </div>
      <div style="margin-top:16px">
        <p style="margin-bottom:8px;font-size:12px;color:var(--dim)">Or search for images:</p>
        <div style="display:flex;gap:8px;">
          <input class="modal-input" id="web-search-query" placeholder="Search for images..." style="flex:1" />
          <button class="modal-btn" onclick="searchImages()">Search</button>
        </div>
        <div class="image-grid" id="web-search-grid"></div>
      </div>
      <div class="modal-actions">
        <button class="modal-btn" onclick="closeModals()">Cancel</button>
        <button class="modal-btn primary" id="web-capture-btn" onclick="captureImage()">Add to Board</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script>
    // ══════════════════════════════════════════
    //  STATE
    // ══════════════════════════════════════════
    let currentTool = 'select';
    let currentBoardId = null;
    let elements = [];
    let selectedElement = null;
    let dragState = null;
    let drawingPath = [];
    let penColor = '#1a1a1a';
    let penSize = 2;
    let zCounter = 10;
    let saveTimeout = null;
    let boardsPanelOpen = false;

    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');
    const whiteboard = document.getElementById('whiteboard');

    // ── Theme ──
    (function() {
      const saved = localStorage.getItem('wb-theme');
      if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('wb-theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('wb-theme', 'dark');
      }
      // Update pen color for dark mode
      if (!isDark) {
        const darkDot = document.querySelector('.color-dot[data-color="#1a1a1a"]');
        if (darkDot && penColor === '#1a1a1a') {
          penColor = '#e8e8e8';
        }
      } else {
        if (penColor === '#e8e8e8') penColor = '#1a1a1a';
      }
    }

    // ── Canvas sizing ──
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      redrawCanvas();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ══════════════════════════════════════════
    //  TOOLS
    // ══════════════════════════════════════════
    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-btn[data-tool]').forEach(b => {
        b.classList.toggle('active', b.dataset.tool === tool);
      });
      canvas.classList.toggle('active', tool === 'pen' || tool === 'eraser');
      document.getElementById('pen-options').classList.toggle('visible', tool === 'pen');
      if (selectedElement) deselectElement();
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
      const key = e.key.toLowerCase();
      if (key === 'v') setTool('select');
      else if (key === 'p') setTool('pen');
      else if (key === 't') setTool('text');
      else if (key === 'n') setTool('note');
      else if (key === 's' && !e.ctrlKey) setTool('shape');
      else if (key === 'e') setTool('eraser');
      else if (key === 'i') openImageGenModal();
      else if (key === 'w') openWebCaptureModal();
      else if (key === 'escape') { closeModals(); deselectElement(); }
      else if (key === 'delete' || key === 'backspace') {
        if (selectedElement) deleteElement(selectedElement);
      }
      if (e.ctrlKey && key === 's') { e.preventDefault(); saveBoard(); }
    });

    // ══════════════════════════════════════════
    //  PEN / DRAWING
    // ══════════════════════════════════════════
    function setPenColor(el) {
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
      penColor = el.dataset.color;
    }

    function setPenSize(el) {
      document.querySelectorAll('.pen-size-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      penSize = parseInt(el.dataset.size);
    }

    let isDrawing = false;

    canvas.addEventListener('mousedown', (e) => {
      if (currentTool === 'pen') {
        isDrawing = true;
        drawingPath = [{ x: e.clientX, y: e.clientY }];
        ctx.beginPath();
        ctx.moveTo(e.clientX, e.clientY);
        ctx.strokeStyle = penColor;
        ctx.lineWidth = penSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
      } else if (currentTool === 'eraser') {
        isDrawing = true;
        eraseAt(e.clientX, e.clientY);
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      if (currentTool === 'pen') {
        drawingPath.push({ x: e.clientX, y: e.clientY });
        ctx.lineTo(e.clientX, e.clientY);
        ctx.stroke();
      } else if (currentTool === 'eraser') {
        eraseAt(e.clientX, e.clientY);
      }
    });

    canvas.addEventListener('mouseup', () => {
      if (isDrawing && currentTool === 'pen' && drawingPath.length > 1) {
        elements.push({
          id: genId(), type: 'drawing', x: 0, y: 0,
          data: { path: drawingPath, color: penColor, size: penSize },
          z_index: zCounter++,
        });
        scheduleSave();
      }
      isDrawing = false;
      drawingPath = [];
    });

    function eraseAt(x, y) {
      const radius = 20;
      ctx.clearRect(x - radius, y - radius, radius * 2, radius * 2);
      // Remove drawing elements near the eraser
      elements = elements.filter(el => {
        if (el.type !== 'drawing') return true;
        return !el.data.path.some(p => Math.hypot(p.x - x, p.y - y) < radius);
      });
    }

    function redrawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      elements.filter(el => el.type === 'drawing').forEach(el => {
        const path = el.data.path;
        if (path.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(path[0].x, path[0].y);
        for (let i = 1; i < path.length; i++) {
          ctx.lineTo(path[i].x, path[i].y);
        }
        ctx.strokeStyle = el.data.color || '#1a1a1a';
        ctx.lineWidth = el.data.size || 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      });
    }

    // ══════════════════════════════════════════
    //  ELEMENT CREATION
    // ══════════════════════════════════════════
    function genId() { return 'el-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6); }

    function onCanvasMouseDown(e) {
      if (currentTool === 'pen' || currentTool === 'eraser') return;
      if (e.target !== whiteboard) return;

      const x = e.clientX;
      const y = e.clientY - 50; // offset for topbar

      if (currentTool === 'text') {
        addTextElement(x, y);
        setTool('select');
      } else if (currentTool === 'note') {
        addStickyNote(x, y);
        setTool('select');
      } else if (currentTool === 'shape') {
        addShape(x, y);
        setTool('select');
      } else if (currentTool === 'select') {
        deselectElement();
      }
    }

    function addTextElement(x, y) {
      const el = { id: genId(), type: 'text', x, y, data: { text: '' }, z_index: zCounter++ };
      elements.push(el);
      renderElement(el);
      scheduleSave();
      // Focus the text
      setTimeout(() => {
        const dom = document.getElementById(el.id);
        if (dom) {
          const editable = dom.querySelector('[contenteditable]');
          if (editable) editable.focus();
        }
      }, 50);
    }

    function addStickyNote(x, y) {
      const el = { id: genId(), type: 'note', x, y, width: 240, height: 160, data: { text: '' }, z_index: zCounter++ };
      elements.push(el);
      renderElement(el);
      scheduleSave();
    }

    function addShape(x, y) {
      const el = { id: genId(), type: 'shape', x, y, width: 120, height: 120, data: { shape: 'rect' }, z_index: zCounter++ };
      elements.push(el);
      renderElement(el);
      scheduleSave();
    }

    function addImageElement(src, x, y) {
      const el = { id: genId(), type: 'image', x: x || 200, y: y || 200, data: { src }, z_index: zCounter++ };
      elements.push(el);
      renderElement(el);
      scheduleSave();
    }

    // ══════════════════════════════════════════
    //  ELEMENT RENDERING
    // ══════════════════════════════════════════
    function renderElement(el) {
      const existing = document.getElementById(el.id);
      if (existing) existing.remove();

      const div = document.createElement('div');
      div.id = el.id;
      div.className = 'board-element element-enter';
      div.style.left = el.x + 'px';
      div.style.top = el.y + 'px';
      div.style.zIndex = el.z_index || 10;

      if (el.type === 'text') {
        div.classList.add('text-element');
        div.innerHTML = `
          <div class="text-actions">
            <button class="note-action-btn" onclick="deleteElement('${el.id}')">&times;</button>
          </div>
          <div contenteditable="true" data-placeholder="Type here...">${el.data.text || ''}</div>
        `;
        const editable = div.querySelector('[contenteditable]');
        editable.addEventListener('input', () => {
          const found = elements.find(e => e.id === el.id);
          if (found) found.data.text = editable.innerHTML;
          scheduleSave();
        });
        editable.addEventListener('mousedown', (e) => e.stopPropagation());
      }

      else if (el.type === 'note') {
        div.classList.add('sticky-note');
        if (el.width) div.style.width = el.width + 'px';
        if (el.height) div.style.height = el.height + 'px';
        div.innerHTML = `
          <div class="note-actions">
            <button class="note-action-btn" onclick="deleteElement('${el.id}')">&times;</button>
          </div>
          <textarea placeholder="Write something...">${el.data.text || ''}</textarea>
        `;
        const ta = div.querySelector('textarea');
        ta.addEventListener('input', () => {
          const found = elements.find(e => e.id === el.id);
          if (found) found.data.text = ta.value;
          scheduleSave();
        });
        ta.addEventListener('mousedown', (e) => e.stopPropagation());
      }

      else if (el.type === 'image') {
        div.classList.add('image-element');
        div.innerHTML = `
          <div class="img-actions">
            <button class="note-action-btn" onclick="deleteElement('${el.id}')">&times;</button>
          </div>
          <img src="${el.data.src}" alt="Board image" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22150%22><rect fill=%22%23eee%22 width=%22200%22 height=%22150%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22 font-family=%22sans-serif%22>Image failed</text></svg>'" />
        `;
      }

      else if (el.type === 'shape') {
        div.classList.add('shape-element');
        if (el.data.shape === 'circle') div.classList.add('circle');
        div.style.width = (el.width || 120) + 'px';
        div.style.height = (el.height || 120) + 'px';
        div.innerHTML = `
          <div class="shape-actions">
            <button class="note-action-btn" onclick="toggleShapeType('${el.id}')">&cir;</button>
            <button class="note-action-btn" onclick="deleteElement('${el.id}')">&times;</button>
          </div>
        `;
      }

      // Dragging
      div.addEventListener('mousedown', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.isContentEditable) return;
        if (currentTool !== 'select') return;
        selectElement(el.id);
        dragState = {
          id: el.id,
          startX: e.clientX,
          startY: e.clientY,
          origX: el.x,
          origY: el.y,
        };
        div.style.zIndex = ++zCounter;
        e.preventDefault();
      });

      whiteboard.appendChild(div);
    }

    function renderAllElements() {
      // Remove all existing DOM elements
      whiteboard.querySelectorAll('.board-element').forEach(el => el.remove());
      elements.filter(el => el.type !== 'drawing').forEach(renderElement);
      redrawCanvas();
    }

    // ── Drag handling ──
    document.addEventListener('mousemove', (e) => {
      if (!dragState) return;
      const dx = e.clientX - dragState.startX;
      const dy = e.clientY - dragState.startY;
      const el = elements.find(el => el.id === dragState.id);
      if (!el) return;
      el.x = dragState.origX + dx;
      el.y = dragState.origY + dy;
      const dom = document.getElementById(el.id);
      if (dom) {
        dom.style.left = el.x + 'px';
        dom.style.top = el.y + 'px';
      }
    });

    document.addEventListener('mouseup', () => {
      if (dragState) {
        scheduleSave();
        dragState = null;
      }
    });

    // ── Selection ──
    function selectElement(id) {
      deselectElement();
      selectedElement = id;
      const dom = document.getElementById(id);
      if (dom) dom.classList.add('selected');
    }

    function deselectElement() {
      if (selectedElement) {
        const dom = document.getElementById(selectedElement);
        if (dom) dom.classList.remove('selected');
      }
      selectedElement = null;
    }

    function deleteElement(id) {
      elements = elements.filter(el => el.id !== id);
      const dom = document.getElementById(id);
      if (dom) {
        dom.style.transition = 'opacity .2s, transform .2s';
        dom.style.opacity = '0';
        dom.style.transform = 'scale(.9)';
        setTimeout(() => dom.remove(), 200);
      }
      if (selectedElement === id) selectedElement = null;
      scheduleSave();
      redrawCanvas();
    }

    function toggleShapeType(id) {
      const el = elements.find(e => e.id === id);
      if (!el) return;
      el.data.shape = el.data.shape === 'rect' ? 'circle' : 'rect';
      renderElement(el);
      scheduleSave();
    }

    // ══════════════════════════════════════════
    //  BOARD PERSISTENCE
    // ══════════════════════════════════════════
    function scheduleSave() {
      clearTimeout(saveTimeout);
      document.getElementById('save-indicator').textContent = 'Unsaved changes';
      saveTimeout = setTimeout(() => autoSave(), 3000);
    }

    async function autoSave() {
      if (!currentBoardId) {
        // Create board first
        try {
          const res = await fetch('/api/boards', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: document.getElementById('board-name').value }),
          });
          const board = await res.json();
          currentBoardId = board.id;
        } catch (e) {
          console.error('Failed to create board:', e);
          return;
        }
      }
      await saveBoard();
    }

    async function saveBoard() {
      if (!currentBoardId) {
        try {
          const res = await fetch('/api/boards', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: document.getElementById('board-name').value }),
          });
          const board = await res.json();
          currentBoardId = board.id;
        } catch (e) {
          toast('Failed to create board');
          return;
        }
      }

      try {
        // Save board name
        await fetch(`/api/boards/${currentBoardId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: document.getElementById('board-name').value }),
        });

        // Bulk save elements
        await fetch(`/api/boards/${currentBoardId}/elements`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ elements }),
        });

        document.getElementById('save-indicator').textContent = 'Saved';
        setTimeout(() => {
          const si = document.getElementById('save-indicator');
          if (si.textContent === 'Saved') si.textContent = '';
        }, 2000);
      } catch (e) {
        console.error('Save failed:', e);
        toast('Save failed');
      }
    }

    async function loadBoard(boardId) {
      try {
        const res = await fetch(`/api/boards/${boardId}`);
        const board = await res.json();
        currentBoardId = board.id;
        document.getElementById('board-name').value = board.name;
        elements = (board.elements || []).map(el => ({
          ...el,
          data: typeof el.data === 'string' ? JSON.parse(el.data) : el.data,
        }));
        zCounter = Math.max(10, ...elements.map(el => el.z_index || 0)) + 1;
        renderAllElements();
        toast('Board loaded');
      } catch (e) {
        console.error('Load failed:', e);
        toast('Failed to load board');
      }
    }

    async function loadBoardsList() {
      try {
        const res = await fetch('/api/boards');
        const boards = await res.json();
        const list = document.getElementById('boards-list');
        if (boards.length === 0) {
          list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--dim);font-size:13px;">No boards yet</div>';
          return;
        }
        list.innerHTML = boards.map(b => `
          <div class="board-item ${b.id === currentBoardId ? 'active' : ''}" onclick="loadBoard('${b.id}');toggleBoardsPanel();">
            <span>${b.name}</span>
            <span class="board-date">${new Date(b.updated_at).toLocaleDateString()}</span>
          </div>
        `).join('');
      } catch (e) {
        console.error('Failed to load boards:', e);
      }
    }

    async function createNewBoard() {
      currentBoardId = null;
      elements = [];
      document.getElementById('board-name').value = 'Untitled Board';
      renderAllElements();
      toggleBoardsPanel();
      toast('New board created');
    }

    function clearBoard() {
      elements = [];
      selectedElement = null;
      renderAllElements();
      scheduleSave();
      toast('Board cleared');
    }

    // ══════════════════════════════════════════
    //  BOARDS PANEL
    // ══════════════════════════════════════════
    function toggleBoardsPanel() {
      boardsPanelOpen = !boardsPanelOpen;
      document.getElementById('boards-panel').classList.toggle('visible', boardsPanelOpen);
      if (boardsPanelOpen) loadBoardsList();
    }

    // ══════════════════════════════════════════
    //  AI IMAGE GENERATION
    // ══════════════════════════════════════════
    function openImageGenModal() {
      document.getElementById('image-gen-modal').classList.add('visible');
      document.getElementById('image-gen-prompt').focus();
      document.getElementById('image-gen-preview').style.display = 'none';
    }

    async function generateImage() {
      const prompt = document.getElementById('image-gen-prompt').value.trim();
      if (!prompt) return;
      const size = document.getElementById('image-gen-size').value;
      const btn = document.getElementById('image-gen-btn');
      btn.innerHTML = '<div class="spinner spinner-sm" style="display:inline-block;vertical-align:middle;margin-right:6px;border-top-color:var(--bg)"></div> Generating...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/ai/generate-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, size, boardId: currentBoardId }),
        });
        const data = await res.json();
        if (data.error) { toast(data.error); return; }

        // Show preview
        document.getElementById('image-gen-preview').style.display = 'block';
        document.getElementById('image-gen-result').src = data.url;

        // Add to board
        addImageElement(data.url, window.innerWidth / 2 - 200, window.innerHeight / 2 - 200);
        toast('Image generated and added to board');
        setTimeout(() => closeModals(), 1500);
      } catch (e) {
        toast('Generation failed: ' + e.message);
      } finally {
        btn.innerHTML = 'Generate';
        btn.disabled = false;
      }
    }

    // Enter key in prompt
    document.getElementById('image-gen-prompt').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') generateImage();
    });

    // ══════════════════════════════════════════
    //  WEB IMAGE CAPTURE
    // ══════════════════════════════════════════
    let selectedWebImage = null;

    function openWebCaptureModal() {
      document.getElementById('web-capture-modal').classList.add('visible');
      document.getElementById('web-capture-url').focus();
      document.getElementById('web-capture-preview').style.display = 'none';
      document.getElementById('web-search-grid').innerHTML = '';
      selectedWebImage = null;
    }

    async function captureImage() {
      const url = document.getElementById('web-capture-url').value.trim() || selectedWebImage;
      if (!url) { toast('Enter an image URL'); return; }

      const btn = document.getElementById('web-capture-btn');
      btn.innerHTML = '<div class="spinner spinner-sm" style="display:inline-block;vertical-align:middle;margin-right:6px;border-top-color:var(--bg)"></div> Capturing...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/ai/capture-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, boardId: currentBoardId }),
        });
        const data = await res.json();
        if (data.error) { toast(data.error); return; }

        addImageElement(data.dataUrl, window.innerWidth / 2 - 200, window.innerHeight / 2 - 200);
        toast('Image captured and added to board');
        setTimeout(() => closeModals(), 1000);
      } catch (e) {
        toast('Capture failed: ' + e.message);
      } finally {
        btn.innerHTML = 'Add to Board';
        btn.disabled = false;
      }
    }

    async function searchImages() {
      const query = document.getElementById('web-search-query').value.trim();
      if (!query) return;

      const grid = document.getElementById('web-search-grid');
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;"><div class="spinner" style="margin:0 auto;"></div></div>';

      try {
        const res = await fetch('/api/ai/search-images', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query }),
        });
        const data = await res.json();

        grid.innerHTML = data.images.map(img => `
          <div class="image-grid-item" onclick="selectSearchImage(this, '${img.url}')">
            <img src="${img.thumb}" alt="${img.alt}" loading="lazy" />
          </div>
        `).join('');
      } catch (e) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--dim);">Search failed</div>';
      }
    }

    function selectSearchImage(el, url) {
      document.querySelectorAll('.image-grid-item').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
      selectedWebImage = url;
      document.getElementById('web-capture-url').value = url;
    }

    document.getElementById('web-capture-url').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') captureImage();
    });
    document.getElementById('web-search-query').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchImages();
    });

    // ══════════════════════════════════════════
    //  MODALS & TOAST
    // ══════════════════════════════════════════
    function closeModals() {
      document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('visible'));
    }

    let toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      clearTimeout(toastTimer);
      t.classList.remove('show');
      void t.offsetWidth;
      t.textContent = msg;
      t.classList.add('show');
      toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ══════════════════════════════════════════
    //  INIT
    // ══════════════════════════════════════════
    (async function init() {
      // Try to load last board
      try {
        const res = await fetch('/api/boards');
        const boards = await res.json();
        if (boards.length > 0) {
          await loadBoard(boards[0].id);
        }
      } catch (e) {
        console.log('No saved boards, starting fresh');
      }
    })();
  </script>
</body>
</html>
