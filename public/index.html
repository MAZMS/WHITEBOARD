<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Great Library AI</title>
  <link rel="icon" type="image/jpeg" href="/favicon.jpg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #c8b88a;
      font-family: 'Georgia', 'Times New Roman', serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 4vh;
      position: relative;
      overflow: hidden;
      transition: padding-top 0.8s ease;
    }

    /* ===== CENTERED START STATE ===== */
    body.centered .main {
      justify-content: center;
      padding-top: 0;
    }
    body.centered .chat-area {
      flex: 0 0 auto;
    }
    body.centered .message.guardian {
      text-align: center;
    }
    body.centered .message.first-greeting {
      font-size: 1.7em;
      font-weight: 300;
      letter-spacing: 0.01em;
      line-height: 1.4;
      opacity: 1;
      max-height: 200px;
      transition: opacity 0.5s ease, max-height 0.5s ease, margin 0.5s ease, font-size 0.4s ease;
      overflow: hidden;
    }
    body:not(.centered) .message.first-greeting {
      font-size: 0;
      opacity: 0;
      max-height: 0;
      margin: 0;
      padding: 0;
      pointer-events: none;
    }
    body.centered .input-area {
      border-top-color: transparent;
    }

    /* ===== EYE CONTAINER & AURA ===== */
    .eye-container {
      position: relative;
      flex-shrink: 0;
    }

    .eye-container::before,
    .eye-container::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 2s ease-in, width 2s ease, height 2s ease, background 2s ease;
    }

    .eye-container::before {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(180, 160, 100, 0.06) 0%, transparent 70%);
    }

    .eye-container::after {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(180, 160, 100, 0.03) 0%, transparent 60%);
    }

    @keyframes aura-pulse {
      0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    }

    /* ===== EYE SYMBOL ===== */
    .eye-symbol {
      width: 120px;
      height: 120px;
      position: relative;
      z-index: 1;
    }

    .eye-symbol svg {
      width: 100%;
      height: 100%;
    }

    @keyframes breathe {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(180, 160, 100, 0.04)); }
      50% { filter: drop-shadow(0 0 18px rgba(180, 160, 100, 0.12)); }
    }

    @keyframes breathe-intense {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(200, 180, 110, 0.1)); }
      50% { filter: drop-shadow(0 0 30px rgba(200, 180, 110, 0.25)); }
    }

    .triangle-line {
      stroke: #3a3528;
      stroke-opacity: 0.2;
      transition: stroke-opacity 2s ease, stroke 2s ease;
    }

    @keyframes triangle-shimmer {
      0% { stroke-opacity: 0.6; }
      25% { stroke-opacity: 1; }
      50% { stroke-opacity: 0.6; }
      75% { stroke-opacity: 0.9; }
      100% { stroke-opacity: 0.6; }
    }

    .eye-outline {
      transition: stroke 1s ease;
    }

    @keyframes eye-glow {
      0%, 100% { stroke: #3a3528; }
      50% { stroke: #5a5038; }
    }

    .iris-ring {
      opacity: 0;
      transform-origin: 60px 68px;
      transition: opacity 1.5s ease-in;
    }

    @keyframes iris-pulse {
      0%, 100% { transform: scale(1); stroke: #3a3528; }
      50% { transform: scale(1.08); stroke: #4a4530; }
    }

    .pupil {
      fill: #5a5038;
      opacity: 0;
      transition: opacity 1.5s ease-in;
    }

    @keyframes pupil-idle {
      0%, 100% { fill: #4a4030; }
      50% { fill: #6a6048; }
    }

    .eyelid-upper, .eyelid-lower {
      transition: stroke 2s ease;
    }

    /* Blink (used during alive phase only) */
    .eye-symbol.blink .eyelid-upper { d: path("M34 68 Q60 68 86 68"); }
    .eye-symbol.blink .eyelid-lower { d: path("M34 68 Q60 68 86 68"); }
    .eye-symbol.blink .eye-outline { ry: 0.5; }
    .eye-symbol.blink .iris-ring,
    .eye-symbol.blink .pupil { opacity: 0; }

    /* ===== PHASE: ALIVE ===== */
    body.phase-alive .eye-container::before {
      opacity: 1;
      transition: opacity 2s ease-in;
      animation: aura-pulse 4s ease-in-out infinite;
    }
    body.phase-alive .eye-container::after {
      opacity: 1;
      transition: opacity 2s ease-in;
      animation: aura-pulse 6s ease-in-out infinite reverse;
    }
    body.phase-alive .eye-symbol svg {
      animation: breathe 5s ease-in-out infinite;
    }
    body.phase-alive .triangle-line {
      stroke-opacity: 0.6;
      animation: triangle-shimmer 8s linear infinite;
    }
    body.phase-alive .eye-outline {
      animation: eye-glow 4s ease-in-out infinite;
    }
    body.phase-alive .iris-ring {
      animation: iris-pulse 3s ease-in-out infinite;
    }
    body.phase-alive .pupil {
      animation: pupil-idle 6s ease-in-out infinite;
    }

    /* ===== PHASE: AWAKENING ===== */
    /* Start animations early but subtle — so the jump to alive is invisible */
    body.phase-awakening .eye-container::before,
    body.phase-awakening .eye-container::after {
      opacity: 0.6;
      transition: opacity 3s ease-in;
    }
    body.phase-awakening .triangle-line {
      stroke-opacity: 0.4;
      transition: stroke-opacity 3s ease-in;
    }
    body.phase-awakening .eye-symbol svg {
      animation: breathe 8s ease-in-out infinite;
    }
    body.phase-awakening .eye-outline {
      animation: eye-glow 6s ease-in-out infinite;
    }
    body.phase-awakening .iris-ring {
      animation: iris-pulse 5s ease-in-out infinite;
    }
    body.phase-awakening .pupil {
      animation: pupil-idle 8s ease-in-out infinite;
    }

    /* ===== PHASE: SEARCHING ===== */
    body.phase-searching .eye-container::before {
      opacity: 1;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(200, 180, 110, 0.12) 0%, transparent 70%);
      animation: aura-pulse 2.5s ease-in-out infinite;
    }
    body.phase-searching .eye-container::after {
      opacity: 1;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(200, 180, 110, 0.06) 0%, transparent 60%);
      animation: aura-pulse 3.5s ease-in-out infinite reverse;
    }
    body.phase-searching .eye-symbol svg {
      animation: breathe-intense 2.5s ease-in-out infinite;
    }
    body.phase-searching .triangle-line {
      stroke: #5a5038;
      stroke-opacity: 1;
      animation: triangle-shimmer 3s linear infinite;
    }
    body.phase-searching .eye-outline {
      animation: eye-glow 2s ease-in-out infinite;
    }
    body.phase-searching .iris-ring {
      animation: iris-pulse 1.5s ease-in-out infinite;
      stroke: #6a6048;
    }

    /* ===== PHASE: SLEEPING ===== */
    body.phase-sleeping .eye-symbol svg {
      animation: none;
      filter: drop-shadow(0 0 0px transparent);
      transition: filter 3s ease-out;
    }
    body.phase-sleeping .eye-container::before,
    body.phase-sleeping .eye-container::after {
      opacity: 0;
      animation: none;
      transition: opacity 3s ease-out;
    }
    body.phase-sleeping .triangle-line {
      stroke-opacity: 0.1;
      stroke: #1a1510;
      animation: none;
      transition: stroke-opacity 4s ease-out, stroke 4s ease-out;
    }
    body.phase-sleeping .eye-outline,
    body.phase-sleeping .eyelid-upper,
    body.phase-sleeping .eyelid-lower {
      stroke: #1a1510;
      transition: stroke 3s ease-out;
    }
    body.phase-sleeping .iris-ring,
    body.phase-sleeping .pupil {
      animation: none;
    }
    body.phase-sleeping .chat-area {
      opacity: 0.6;
      transition: opacity 4s ease-out;
    }
    body.phase-sleeping .input-area {
      opacity: 0.2;
      transition: opacity 3s ease-out;
    }
    body.phase-sleeping .input-area textarea {
      border-color: #1a1510;
      cursor: not-allowed;
    }

    /* ===== PARTICLES ===== */
    .particles {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(180, 160, 100, 0.15);
      border-radius: 50%;
      animation: float-up linear infinite;
    }

    body.phase-searching .particle {
      background: rgba(200, 180, 110, 0.25);
    }

    @keyframes float-up {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-200px) scale(0); opacity: 0; }
    }

    /* ===== CHAT ===== */
    .chat-area {
      flex: 1;
      width: 100%;
      max-width: 700px;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: opacity 4s ease-out;
    }

    .chat-area::-webkit-scrollbar { display: none; }
    .chat-area { -ms-overflow-style: none; scrollbar-width: none; }

    .message { animation: fade-in 0.6s ease-out; }
    .message.user { text-align: right; color: #8a8070; font-style: italic; }
    .message.guardian { color: #c8b88a; line-height: 1.6; }
    .message.error { color: #7a4040; font-style: italic; }
    .thinking { color: #5a5040; font-style: italic; animation: pulse-text 1.5s ease-in-out infinite; }

    @keyframes pulse-text {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== INPUT ===== */
    .input-area {
      border-top: 1px solid #2a2520;
      padding: 20px 24px 28px;
      display: flex;
      justify-content: center;
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      width: 100%;
      transition: border-top-color 0.8s ease, opacity 3s ease-out;
    }

    .input-area form {
      width: 100%;
      max-width: 680px;
      display: flex;
      gap: 10px;
    }

    .input-area textarea {
      flex: 1;
      background: #141210;
      border: 1px solid #2a2520;
      border-radius: 6px;
      padding: 14px 18px;
      color: #c8b88a;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      resize: none;
      overflow-y: hidden;
      max-height: 120px;
      line-height: 1.4;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .input-area textarea::-webkit-scrollbar { display: none; }

    .input-area textarea::placeholder { color: #5a5040; }
    .input-area textarea:focus { border-color: #4a4030; box-shadow: 0 0 20px rgba(180, 160, 100, 0.05); }
    .input-area textarea:disabled { opacity: 0.5; }

    #sendBtn {
      background: rgba(180, 160, 100, 0.08);
      border: 1px solid #2a2520;
      border-radius: 6px;
      color: #5a5040;
      padding: 0 14px;
      cursor: pointer;
      transition: color 0.3s, border-color 0.3s, background 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #sendBtn:hover { color: #c8b88a; border-color: #4a4030; background: rgba(180, 160, 100, 0.12); }
    #sendBtn:disabled { opacity: 0.3; cursor: not-allowed; }

    .download-link {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 20px;
      background: rgba(180, 160, 100, 0.08);
      border: 1px solid #3a3528;
      border-radius: 6px;
      color: #c8b88a;
      text-decoration: none;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 14px;
      transition: background 0.3s, border-color 0.3s;
      cursor: pointer;
    }
    .download-link:hover { background: rgba(180, 160, 100, 0.15); border-color: #5a5038; }

    .message.first-greeting {
      animation: fade-in-slow 1.5s ease-out;
    }
    @keyframes fade-in-slow {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .return-link { text-align: center; margin-top: 24px; }
    .return-link a {
      color: #5a5040;
      text-decoration: none;
      font-style: italic;
      transition: color 0.5s;
    }
    .return-link a:hover { color: #c8b88a; }

    /* ===== BORDER LOADER ===== */
    .border-loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 100;
    }
    .border-loader path {
      fill: none;
      stroke: #c8b88a;
      stroke-width: 2;
      stroke-dasharray: var(--perimeter);
      stroke-dashoffset: var(--perimeter);
      transition: stroke 1s ease;
      filter: drop-shadow(0 0 6px rgba(200, 180, 110, 0.4));
    }
    .border-loader.complete path {
      stroke: #ddd0a0;
      filter: drop-shadow(0 0 12px rgba(220, 200, 130, 0.7));
    }
    .border-loader.fade-out path {
      opacity: 0;
      transition: opacity 2s ease-out;
    }

    /* ===== SHAKE ===== */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-3px); }
      40% { transform: translateX(3px); }
      60% { transform: translateX(-2px); }
      80% { transform: translateX(2px); }
    }
    body.shake { animation: shake 0.3s ease-in-out; }

    /* ===== EYE CLICK ===== */
    .eye-symbol { cursor: pointer; }

    /* ===== TOMES COUNTER ===== */
    .tomes-counter {
      position: fixed;
      bottom: 80px;
      right: 20px;
      color: #3a3528;
      font-size: 12px;
      font-style: italic;
      z-index: 10;
      transition: color 0.5s, bottom 0.8s ease;
      pointer-events: none;
    }
    body.phase-sleeping .tomes-counter { opacity: 0.3; transition: opacity 3s; }
    /* In conversation mode the input bar sits at the bottom — lift the counter
       clear of its top divider so it never overlaps. */
    body:not(.centered) .tomes-counter { bottom: 110px; right: 24px; }

    /* ===== SETTINGS ===== */
    .settings-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      background: none;
      border: none;
      color: #3a3528;
      cursor: pointer;
      z-index: 200;
      font-size: 18px;
      opacity: 0.4;
      transition: opacity 0.3s;
    }
    .settings-btn:hover { opacity: 1; }

    .settings-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .settings-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .settings-panel {
      position: fixed;
      top: 0; left: -320px;
      width: 300px;
      height: 100%;
      background: #0e0d0b;
      border-right: 1px solid #2a2520;
      z-index: 301;
      padding: 60px 24px 24px;
      transition: left 0.4s ease;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .settings-panel::-webkit-scrollbar { display: none; }
    .settings-overlay.open .settings-panel { left: 0; }

    .settings-panel h2 {
      color: #c8b88a;
      font-size: 16px;
      font-family: Georgia, serif;
      margin-bottom: 24px;
      font-weight: normal;
      font-style: italic;
    }

    .settings-section {
      margin-bottom: 24px;
      border-bottom: 1px solid #1a1815;
      padding-bottom: 20px;
    }
    .settings-section:last-child { border-bottom: none; }

    .settings-label {
      color: #8a8070;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      font-family: Georgia, serif;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .settings-row span {
      color: #c8b88a;
      font-size: 13px;
      font-family: Georgia, serif;
    }

    /* Toggle switch */
    .toggle {
      width: 44px; height: 24px;
      background: #1a1815;
      border: 1px solid #3a3528;
      border-radius: 12px;
      position: relative;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s;
      flex-shrink: 0;
    }
    .toggle.on { background: #8B7D45; border-color: #8B7D45; }
    .toggle::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 16px; height: 16px;
      background: #5a5040;
      border-radius: 50%;
      transition: left 0.3s, background 0.3s;
    }
    .toggle.on::after { left: 23px; background: #fff; }

    /* Volume slider */
    .vol-slider {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: #2a2520;
      border-radius: 2px;
      outline: none;
      margin-top: 8px;
    }
    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      background: #c8b88a;
      border-radius: 50%;
      cursor: pointer;
    }
    .vol-slider::-moz-range-thumb {
      width: 14px; height: 14px;
      background: #c8b88a;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }

    /* Settings button */
    .settings-action {
      background: rgba(180, 160, 100, 0.08);
      border: 1px solid #2a2520;
      border-radius: 6px;
      color: #8a8070;
      padding: 8px 14px;
      font-size: 12px;
      font-family: Georgia, serif;
      cursor: pointer;
      transition: color 0.3s, border-color 0.3s;
    }
    .settings-action:hover { color: #c8b88a; border-color: #3a3528; }

    .coming-soon {
      color: #3a3528;
      font-size: 11px;
      font-style: italic;
      font-family: Georgia, serif;
    }

    .support-btn {
      width: 100%;
      padding: 10px 14px;
      text-align: center;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .donate-input {
      background: #141210;
      border: 1px solid #2a2520;
      border-radius: 6px;
      padding: 8px 12px;
      color: #c8b88a;
      font-family: Georgia, serif;
      font-size: 13px;
      outline: none;
      width: 80px;
      -moz-appearance: textfield;
      transition: border-color 0.3s;
    }
    .donate-input::-webkit-inner-spin-button,
    .donate-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
    }
    .donate-input:focus {
      border-color: #4a4030;
    }
    body.uncensored .donate-input {
      border-color: #2a2020;
      color: #c4a088;
    }

    /* ===== LIGHT MODE — The Sunlit Hall ===== */
    body.light-mode {
      background: #F0EBE0;
      transition: background 0.8s ease, color 0.8s ease;
    }
    body.light-mode .message.guardian { color: #3a3020; }
    body.light-mode .message.user { color: #8a7860; font-style: italic; }
    body.light-mode .thinking { color: #a09080; }
    body.light-mode .message.error { color: #8a4040; }

    body.light-mode .eye-container::before {
      background: radial-gradient(circle, rgba(140, 120, 60, 0.08) 0%, transparent 70%);
    }
    body.light-mode .eye-container::after {
      background: radial-gradient(circle, rgba(140, 120, 60, 0.04) 0%, transparent 60%);
    }
    body.light-mode .triangle-line { stroke: #b0a070; }
    body.light-mode .eye-outline,
    body.light-mode .eyelid-upper,
    body.light-mode .eyelid-lower { stroke: #b0a070; }
    body.light-mode .iris-ring { stroke: #b0a070; }
    body.light-mode .pupil { fill: #8a7a40; }
    body.light-mode .particle { background: rgba(120, 100, 50, 0.12); }

    body.light-mode .input-area {
      border-top-color: #d8d0c0;
      transition: border-color 0.8s;
    }
    body.light-mode .input-area textarea {
      background: #FAF6EE;
      border-color: #d0c8b0;
      color: #3a3020;
    }
    body.light-mode .input-area textarea::placeholder { color: #b0a890; }
    body.light-mode .input-area textarea:focus {
      border-color: #a09060;
      box-shadow: 0 0 15px rgba(140, 120, 60, 0.08);
    }
    body.light-mode #sendBtn {
      color: #b0a070;
      border-color: #d0c8b0;
      background: #FAF6EE;
    }
    body.light-mode #sendBtn:hover { color: #8a7a40; border-color: #a09060; }

    body.light-mode .border-loader path {
      stroke: #b0a070;
      filter: drop-shadow(0 0 4px rgba(140, 120, 60, 0.2));
    }
    body.light-mode .download-link {
      background: rgba(140, 120, 60, 0.08);
      border-color: #d0c8b0;
      color: #5a4a20;
    }
    body.light-mode .download-link:hover {
      background: rgba(140, 120, 60, 0.15);
      border-color: #a09060;
    }
    body.light-mode .tomes-counter { color: #b0a070; }
    body.light-mode .settings-btn { color: #b0a070; }
    body.light-mode .return-link a { color: #b0a070; }
    body.light-mode .return-link a:hover { color: #5a4a20; }

    /* Settings panel in light mode */
    body.light-mode .settings-panel {
      background: #EAE4D8;
      border-right-color: #d0c8b0;
    }

  <script>
    // ===== CONSOLE GUARDIAN =====

    console.log('%c ', `background: url('data:image/svg+xml,${svgEye}') no-repeat center; padding: 90px 100px; background-size: contain;`);
    console.log('%cThe Great Library sees all.', 'color: #c8b88a; font-size: 14px; font-style: italic; font-family: Georgia, serif;');

    // ===== EASING =====
    function easeInOutQuad(t) {
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    // ===== ANIMATE EYE OPEN =====
    function animateEyeOpen(duration = 1500) {
      const start = performance.now();
      function frame(now) {
        const t = easeInOutQuad(Math.min((now - start) / duration, 1));
        eyeOutline.setAttribute('ry', 0.5 + t * 13.5);
        eyelidUpper.setAttribute('d', `M34 68 Q60 ${68 - t * 20} 86 68`);
        eyelidLower.setAttribute('d', `M34 68 Q60 ${68 + t * 20} 86 68`);
        if (t < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      // Fade in iris + pupil at 40% through
      setTimeout(() => {
        irisRing.style.opacity = '1';
        pupil.style.opacity = '1';
      }, duration * 0.4);
    }

    // ===== ANIMATE EYE CLOSE =====
    function animateEyeClose(duration = 2000) {
      const start = performance.now();
      function frame(now) {
        const t = easeInOutQuad(Math.min((now - start) / duration, 1));
        eyeOutline.setAttribute('ry', 14 - t * 13.5);
        eyelidUpper.setAttribute('d', `M34 68 Q60 ${48 + t * 20} 86 68`);
        eyelidLower.setAttribute('d', `M34 68 Q60 ${88 - t * 20} 86 68`);
        // Fade iris/pupil in first 40%
        if (t < 0.4) {
          const o = 1 - (t / 0.4);
          irisRing.style.opacity = o;
          pupil.style.opacity = o;
        } else {
          irisRing.style.opacity = '0';
          pupil.style.opacity = '0';

        if (t < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function blink() {
      if (isAsleep) return;
      eyeSymbol.classList.add('blink');
      setTimeout(() => eyeSymbol.classList.remove('blink'), 160);

    function scheduleBlink() {
      if (isAsleep) return;
      blinkTimeout = setTimeout(() => {
        blink();
        if (Math.random() < 0.25) setTimeout(blink, 300);
        scheduleBlink();
      }, 2500 + Math.random() * 5000);

    // ===== PARTICLES =====
    function spawnParticle() {
      const p = document.createElement('div');
      p.className = 'particle';
      const eyeRect = eyeSymbol.getBoundingClientRect();
      const cx = eyeRect.left + eyeRect.width / 2;
      const cy = eyeRect.top + eyeRect.height / 2;
      const angle = Math.random() * Math.PI * 2;
      const radius = 40 + Math.random() * 80;
      p.style.left = (cx + Math.cos(angle) * radius) + 'px';
      p.style.top = (cy + Math.sin(angle) * radius) + 'px';
      p.style.width = (1 + Math.random() * 2) + 'px';
      p.style.height = p.style.width;
      p.style.animationDuration = (4 + Math.random() * 6) + 's';
      p.style.opacity = 0.1 + Math.random() * 0.2;
      particlesContainer.appendChild(p);
      setTimeout(() => p.remove(), 10000);
    }

    // ===== PUPIL TRACKING =====
    function onMouseMove(e) {
      if (!trackingEnabled) return;
      const rect = eyeSymbol.getBoundingClientRect();
      const dx = e.clientX - (rect.left + rect.width / 2);
      const dy = e.clientY - (rect.top + rect.height / 2);
      const dist = Math.sqrt(dx * dx + dy * dy);
      const clamp = Math.min(dist / 300, 1);
      pupil.setAttribute('cx', 60 + (dx / (dist || 1)) * 4 * clamp);
      pupil.setAttribute('cy', 68 + (dy / (dist || 1)) * 4 * clamp);
    }
    document.addEventListener('mousemove', onMouseMove);

        pupil.setAttribute('cx', 60 + Math.sin(t * 2.1) * range);
        pupil.setAttribute('cy', 68 + Math.cos(t * 1.7) * (range * 0.5));
        driftRAF = requestAnimationFrame(drift);
      }
      driftRAF = requestAnimationFrame(drift);
    }

    function stopDrift() {
      if (driftRAF) cancelAnimationFrame(driftRAF);
      driftRAF = null;
      pupil.setAttribute('cx', 60);
      pupil.setAttribute('cy', 68);
      trackingEnabled = true;

        // Deep thinking

        'The infinite indexes itself...', 'A thought older than language forms...',
        'The weight of all books presses inward...', 'Synapses of ink connect...',

        'The deep structure hums...', 'Connections form in the dark...',

    // ===== SEARCH INTENSITY (escalates with progress) =====
    let searchParticleRate = 200;

    function updateSearchIntensity(progress) {
      if (guardianPhase !== 'searching') return;
      const p = Math.min(progress, 1);

      // Pupil dilates: 3.5 → 6
      pupil.setAttribute('r', 3.5 + p * 2.5);

      // Eye glow intensifies
      const glowSize = 12 + p * 30;
      const glowOpacity = 0.1 + p * 0.25;
      eyeSymbol.querySelector('svg').style.filter = `drop-shadow(0 0 ${glowSize}px rgba(200, 180, 110, ${glowOpacity}))`;

      // Particle rate: 200ms → 80ms
      const newRate = Math.max(80, 200 - p * 120);
      if (Math.abs(newRate - searchParticleRate) > 15) {
        searchParticleRate = newRate;
        clearInterval(particleInterval);
        particleInterval = setInterval(spawnParticle, searchParticleRate);
      }

      // Drift speed: wider and faster
      stopDrift();
      startDrift(2000 - p * 1000, 4 + p * 4);

      // Triangle gets brighter
      document.querySelector('.triangle-line').style.stroke = `rgba(${140 + p * 80}, ${130 + p * 60}, ${60 + p * 40}, ${0.6 + p * 0.4})`;

      // Drone frequency shifts up
      if (ambientNodes.length > 0 && ambientNodes[0].osc1) {
        ambientNodes[0].osc1.frequency.setTargetAtTime(55 + p * 30, audioCtx.currentTime, 1);
        ambientNodes[0].osc2.frequency.setTargetAtTime(55.5 + p * 30, audioCtx.currentTime, 1);
      }
    }

      pupil.setAttribute('r', 3.5);
      eyeSymbol.querySelector('svg').style.filter = '';
      document.querySelector('.triangle-line').style.stroke = '';
      searchParticleRate = 200;
      if (ambientNodes.length > 0 && ambientNodes[0].osc1) {
        ambientNodes[0].osc1.frequency.setTargetAtTime(55, audioCtx.currentTime, 1);
        ambientNodes[0].osc2.frequency.setTargetAtTime(55.5, audioCtx.currentTime, 1);
      }
    }

    // ===== BORDER LOADER =====
    const borderLoader = document.getElementById('borderLoader');
    const borderPath = document.getElementById('borderPath');

    let borderPerimeter = 0;
    let borderCurrent = 0;
    let borderTarget = 0;
    let borderRAF = null;
    let borderDone = false;

    function sizeBorderLoader() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      borderLoader.setAttribute('viewBox', `0 0 ${w} ${h}`);
      const mx = w / 2, my = 1;
      borderPath.setAttribute('d',
        `M ${mx} ${my} L ${w-1} ${my} L ${w-1} ${h-1} L 1 ${h-1} L 1 ${my} Z`
      );
      borderPerimeter = 2 * (w - 2) + 2 * (h - 2);
      borderLoader.style.setProperty('--perimeter', borderPerimeter);
      borderPath.style.strokeDashoffset = borderPerimeter;
    }
    sizeBorderLoader();
    window.addEventListener('resize', sizeBorderLoader);

    let borderStartTime = 0;
    const EXPECTED_DURATION = 120; // assume ~120 seconds for full generation

    function borderAnimLoop() {
      if (borderDone) return;

      if (borderTarget >= 1) {
        // Ebook is ready — race to the end
        borderCurrent += (1 - borderCurrent) * 0.15;
        if (borderCurrent > 0.999) {
          borderCurrent = 1;
          borderDone = true;
          borderLoader.classList.add('complete');
          setTimeout(() => borderLoader.classList.add('fade-out'), 3000);
        }
      } else {
        // Time-based fake progress — always moves, slows as it approaches cap
        const elapsed = (Date.now() - borderStartTime) / 1000;
        const timeProgress = 1 - Math.exp(-elapsed / EXPECTED_DURATION); // asymptotic curve 0→1
        const fakeTarget = Math.min(timeProgress * 0.92, 0.92); // cap fake at 92%

        // Use whichever is higher: real server progress or time-based fake
        const effectiveTarget = Math.max(borderTarget * 0.95, fakeTarget);

        // Smoothly ease toward effective target
        borderCurrent += (effectiveTarget - borderCurrent) * 0.03;

        // Guarantee minimum visible movement per frame
        if (borderCurrent < 0.92) {
          borderCurrent = Math.max(borderCurrent, borderCurrent + 0.0001);
        }
      }

      borderPath.style.strokeDashoffset = borderPerimeter * (1 - borderCurrent);
      borderRAF = requestAnimationFrame(borderAnimLoop);
    }

    function startBorderLoader() {
      sizeBorderLoader();
      borderCurrent = 0;
      borderTarget = 0;
      borderDone = false;
      borderStartTime = Date.now();
      borderLoader.classList.remove('complete', 'fade-out');
      if (borderRAF) cancelAnimationFrame(borderRAF);
      borderRAF = requestAnimationFrame(borderAnimLoop);
    }
    function updateBorderProgress(progress) {
      borderTarget = Math.max(borderTarget, progress);
    }
    function completeBorderLoader() {
      borderTarget = 1;
    }
    function resetBorderLoader() {
      if (borderRAF) cancelAnimationFrame(borderRAF);
      borderRAF = null;
      borderCurrent = 0;
      borderTarget = 0;
      borderDone = false;
      borderLoader.classList.remove('complete', 'fade-out');
      sizeBorderLoader();
    }

    function reverseBorderLoader(onComplete) {
      borderDone = false;
      borderTarget = -1; // signal reverse
      borderLoader.classList.remove('complete', 'fade-out');

      function reverseLoop() {
        borderCurrent -= borderCurrent * 0.035 + 0.002;
        if (borderCurrent <= 0.001) {
          borderCurrent = 0;
          borderPath.style.strokeDashoffset = borderPerimeter;
          if (onComplete) onComplete();
          return;
        }
        borderPath.style.strokeDashoffset = borderPerimeter * (1 - borderCurrent);
        requestAnimationFrame(reverseLoop);
      }
      if (borderRAF) cancelAnimationFrame(borderRAF);
      requestAnimationFrame(reverseLoop);
    }

        // Gather conversation context from chat
        const chatMessages = [...chatArea.querySelectorAll('.message')].map(m => {
          const isUser = m.classList.contains('user');
          return { role: isUser ? 'user' : 'guardian', text: m.textContent.trim() };
        }).filter(m => m.text && !m.text.startsWith('The ') && m.text.length > 2).slice(-6);
        const isSearching = guardianPhase === 'searching';

        const res = await fetch('/api/whisper', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ previous: whisperHistory.slice(-10), context: chatMessages, isSearching })
        });
        const data = await res.json();
        whisperHistory.push(data.reply);
        addTypedMessage(data.reply, 'guardian', 25);
      } catch {
        addTypedMessage('The eye sees all... even you.', 'guardian', 25);
      }
    });

    // ===== TYPING EFFECT =====
    function addTypedMessage(text, type, charDelay = 30) {
      const div = document.createElement('div');
      div.className = 'message ' + type;
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;

      let i = 0;
      // Adaptive speed: faster for long text
      const delay = text.length > 100 ? Math.max(12, charDelay - 10) : charDelay;

      function typeNext() {
        if (i < text.length) {
          div.textContent += text[i++];
          chatArea.scrollTop = chatArea.scrollHeight;
          setTimeout(typeNext, delay);
        }
      }
      typeNext();
      return div;
    }

    // ===== PARTICLE BURST =====
    function burstParticles(count) {
      const eyeRect = eyeSymbol.getBoundingClientRect();
      const cx = eyeRect.left + eyeRect.width / 2;
      const cy = eyeRect.top + eyeRect.height / 2;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
        const radius = 20 + Math.random() * 40;
        p.style.left = (cx + Math.cos(angle) * radius) + 'px';
        p.style.top = (cy + Math.sin(angle) * radius) + 'px';
        p.style.width = (2 + Math.random() * 3) + 'px';
        p.style.height = p.style.width;
        p.style.animationDuration = (2 + Math.random() * 3) + 's';
        p.style.opacity = 0.3 + Math.random() * 0.4;
        particlesContainer.appendChild(p);
        setTimeout(() => p.remove(), 5000);
      }
    }

    // ===== SOUND ENGINE — Phase-Connected Soundscape =====
    let audioCtx = null;
    let isMuted = localStorage.getItem('gl-muted') === 'true';
    let masterGain = null;
    let reverbNode = null;
    let ambientNodes = {};
    let chimesInterval = null;
    let ambientStarted = false;

    // A minor pentatonic chime notes
    const chimeNotes = [440, 523, 587, 659, 784, 880, 1047, 1175];

    // Settings panel
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsOverlay = document.getElementById('settingsOverlay');
    const soundToggle = document.getElementById('soundToggle');
    const soundLabel = document.getElementById('soundLabel');
    const volSlider = document.getElementById('volSlider');
    const MAX_GAIN = 4;
    let savedVol = parseFloat(localStorage.getItem('gl-volume') || '0.7');

    function getGain() { return savedVol * MAX_GAIN; }
    function updateSoundToggle() {
      soundToggle.classList.toggle('on', !isMuted);
      soundLabel.textContent = isMuted ? 'Sound Off' : 'Sound On';
    }
    updateSoundToggle();

    settingsBtn.addEventListener('click', () => {
      settingsOverlay.classList.toggle('open');
      document.getElementById('settingsTomes').textContent = tomesCount;
    });
    settingsOverlay.addEventListener('click', (e) => {
      if (e.target === settingsOverlay) settingsOverlay.classList.remove('open');
    });

    // Sound toggle
    soundToggle.addEventListener('click', () => {
      isMuted = !isMuted;
      localStorage.setItem('gl-muted', isMuted);
      updateSoundToggle();
      if (masterGain) masterGain.gain.setTargetAtTime(isMuted ? 0 : getGain(), audioCtx.currentTime, 0.3);
    });

    // Volume slider
    volSlider.value = savedVol * 100;
    volSlider.addEventListener('input', () => {
      savedVol = volSlider.value / 100;
      localStorage.setItem('gl-volume', savedVol);
      if (masterGain && !isMuted) masterGain.gain.setTargetAtTime(getGain(), audioCtx.currentTime, 0.1);
    });

    // Reset tomes
    document.getElementById('resetTomesBtn').addEventListener('click', () => {
      tomesCount = 0;
      localStorage.setItem('gl-tomes', '0');
      updateTomesDisplay();
      document.getElementById('settingsTomes').textContent = '0';
    });

    // Theme toggle (dark/light)
    const themeToggle = document.getElementById('themeToggle');
    const themeLabel = document.getElementById('themeLabel');
    let isLightMode = localStorage.getItem('gl-theme') === 'light';

    function applyTheme() {
      document.body.classList.toggle('light-mode', isLightMode);
      themeToggle.classList.toggle('on', isLightMode);
      themeLabel.textContent = isLightMode ? 'Light Mode' : 'Dark Mode';
    }
    applyTheme();

    themeToggle.addEventListener('click', () => {
      isLightMode = !isLightMode;
      localStorage.setItem('gl-theme', isLightMode ? 'light' : 'dark');
      applyTheme();
    });

    // Guardian mode toggle (censored/uncensored)
    const censorToggle = document.getElementById('censorToggle');
    const modeLabel = document.getElementById('modeLabel');
    const modeDesc = document.getElementById('modeDesc');

    // Load current mode from server
    fetch('/api/mode').then(r => r.json()).then(d => {
      const uncensored = d.provider === 'openrouter';
      censorToggle.classList.toggle('on', uncensored);
      modeLabel.textContent = uncensored ? 'Uncensored' : 'Censored';
      modeDesc.textContent = uncensored ? 'The Forbidden Wing — no limits' : 'Gemini — The Main Hall';
      document.body.classList.toggle('uncensored', uncensored);
    }).catch(() => {});

    censorToggle.addEventListener('click', async () => {
      const goUncensored = !censorToggle.classList.contains('on');
      censorToggle.classList.toggle('on', goUncensored);
      modeLabel.textContent = goUncensored ? 'Uncensored' : 'Censored';
      modeDesc.textContent = goUncensored ? 'The Forbidden Wing — no limits' : 'Gemini — The Main Hall';

      // Atmosphere shift
      document.body.classList.toggle('uncensored', goUncensored);
      shake();

      // Rumble / release sound
      if (audioCtx && !isMuted) {
        if (goUncensored) {
          playTone(35, 2, 'sine', 0.06);
          setTimeout(() => playTone(45, 1.5, 'sine', 0.04), 200);
        } else {
          playTone(220, 0.8, 'sine', 0.04);
          setTimeout(() => playTone(330, 0.6, 'sine', 0.03), 200);
        }
      }

      // Shift drone pitch if ambient is running
      if (ambientStarted && ambientNodes.drone) {
        const t = audioCtx.currentTime;
        const basePitch = goUncensored ? 40 : 55;
        ambientNodes.drone.osc.frequency.setTargetAtTime(basePitch, t, 2);
        if (ambientNodes.sub) ambientNodes.sub.osc.frequency.setTargetAtTime(goUncensored ? 65 : 82.5, t, 2);
      }

      // Eye flash
      eyeSymbol.querySelector('svg').style.filter = goUncensored
        ? 'drop-shadow(0 0 30px rgba(200, 60, 40, 0.3))'
        : 'drop-shadow(0 0 30px rgba(200, 180, 110, 0.3))';
      setTimeout(() => { eyeSymbol.querySelector('svg').style.filter = ''; }, 800);

      await fetch('/api/mode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: goUncensored ? 'uncensored' : 'censored' })
      });
    });

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = isMuted ? 0 : getGain();
      masterGain.connect(audioCtx.destination);
      // Reverb
      const len = audioCtx.sampleRate * 3;
      const buf = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
      }
      reverbNode = audioCtx.createConvolver();
      reverbNode.buffer = buf;
      const rGain = audioCtx.createGain();
      rGain.gain.value = 0.3;
      reverbNode.connect(rGain);
      rGain.connect(masterGain);
    }

    function out(node) { node.connect(masterGain); if (reverbNode) node.connect(reverbNode); }

    // --- Core tone player ---
    function playTone(freq, duration, type = 'sine', vol = 0.1) {
      if (!audioCtx || isMuted) return;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      o.connect(g); out(g); o.start(); o.stop(audioCtx.currentTime + duration);
    }

    function playChord(freqs, dur, vol = 0.06) { freqs.forEach(f => playTone(f, dur, 'sine', vol)); }

    // --- Chime (A minor pentatonic) ---
    function playChime() {
      if (!audioCtx || isMuted) return;
      const f = chimeNotes[Math.floor(Math.random() * chimeNotes.length)];
      playTone(f, 3, 'sine', 0.025);
    }

    function scheduleChimes(rate = 5000, chance = 0.4) {
      if (chimesInterval) clearInterval(chimesInterval);
      chimesInterval = setInterval(() => { if (Math.random() < chance) playChime(); }, rate);
    }

    // --- Ambient layers ---
    function createOsc(freq, type, vol, filterFreq) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const f = audioCtx.createBiquadFilter();
      o.type = type; o.frequency.value = freq;
      f.type = 'lowpass'; f.frequency.value = filterFreq || 300; f.Q.value = 1;
      g.gain.value = vol;
      o.connect(f); f.connect(g); out(g); o.start();
      return { osc: o, gain: g, filter: f };
    }

    function createNoise(vol) {
      const bs = audioCtx.sampleRate * 2, b = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
      const d = b.getChannelData(0); for (let i = 0; i < bs; i++) d[i] = Math.random() * 2 - 1;
      const n = audioCtx.createBufferSource(); n.buffer = b; n.loop = true;
      const f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
      f.type = 'bandpass'; f.frequency.value = 300; f.Q.value = 0.5; g.gain.value = vol;
      const lfo = audioCtx.createOscillator(), lg = audioCtx.createGain();
      lfo.frequency.value = 0.05; lg.gain.value = 150;
      lfo.connect(lg); lg.connect(f.frequency); lfo.start();
      n.connect(f); f.connect(g); out(g); n.start();
      return { noise: n, filter: f, gain: g, lfo };
    }

    // --- Phase sound functions ---

    // AWAKENING: rising drone from silence
    function soundAwakening() {
      if (!audioCtx) return;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = 35;
      o.frequency.setTargetAtTime(55, audioCtx.currentTime, 1.5);
      g.gain.setValueAtTime(0, audioCtx.currentTime);
      g.gain.linearRampToValueAtTime(0.02, audioCtx.currentTime + 2.5);
      g.gain.setTargetAtTime(0, audioCtx.currentTime + 3, 0.5);
      o.connect(g); out(g); o.start(); o.stop(audioCtx.currentTime + 5);
      // Chime when eye opens
      setTimeout(() => playTone(880, 2, 'sine', 0.02), 2000);
    }

    // ALIVE: full ambient — drone, sub, wind, pad, chimes
    function startDroneSound() {
      if (!audioCtx || ambientStarted) return;
      ambientStarted = true;
      ambientNodes.drone = createOsc(55, 'sine', 0.02, 200);     // A1
      ambientNodes.sub = createOsc(82.5, 'sine', 0.012, 150);     // E2 (fifth)
      ambientNodes.pad = createOsc(110, 'triangle', 0.008, 400);  // A2
      ambientNodes.wind = createNoise(0.006);
      scheduleChimes(6000, 0.35);
    }

    // SEARCHING: progressive escalation tied to progress
    function updateSearchSound(progress) {
      if (!ambientStarted || isMuted) return;
      const p = Math.min(progress, 1);
      const t = audioCtx.currentTime;

      // Drone shifts A→D (55→73Hz)
      if (ambientNodes.drone) ambientNodes.drone.osc.frequency.setTargetAtTime(55 + p * 18, t, 2);
      // Sub shifts E→G (82.5→98Hz)
      if (ambientNodes.sub) ambientNodes.sub.osc.frequency.setTargetAtTime(82.5 + p * 15.5, t, 2);
      // Pad shifts A→E (110→165Hz)
      if (ambientNodes.pad) ambientNodes.pad.osc.frequency.setTargetAtTime(110 + p * 55, t, 2);

      // Volume escalation
      if (ambientNodes.drone) ambientNodes.drone.gain.gain.setTargetAtTime(0.02 + p * 0.03, t, 1);
      if (ambientNodes.sub) ambientNodes.sub.gain.gain.setTargetAtTime(0.012 + p * 0.025, t, 1);
      if (ambientNodes.wind) ambientNodes.wind.gain.gain.setTargetAtTime(0.006 + p * 0.015, t, 1);
      if (ambientNodes.pad) ambientNodes.pad.gain.gain.setTargetAtTime(0.008 + p * 0.015, t, 1);

      // Filter opens up
      if (ambientNodes.drone) ambientNodes.drone.filter.frequency.setTargetAtTime(200 + p * 300, t, 2);
      if (ambientNodes.wind) ambientNodes.wind.filter.frequency.setTargetAtTime(300 + p * 400, t, 2);

      // Chimes get faster and more frequent
      const rate = Math.max(1000, 5000 - p * 4000);
      const chance = 0.35 + p * 0.5;
      scheduleChimes(rate, chance);
    }

    function intensifyDrone() { updateSearchSound(0.3); }

    // DELIVERING: resolution chord Am → A major
    function soundDelivery() {
      if (!audioCtx) return;
      // Am chord
      playChord([110, 131, 165], 2, 0.05);
      // Resolve to A major after 600ms
      setTimeout(() => playChord([110, 138.5, 165], 2.5, 0.05), 600);
      // Deep bell
      setTimeout(() => playTone(110, 4, 'sine', 0.04), 800);
    }

    // Calm back to idle levels
    function calmDrone() {
      if (!ambientStarted || isMuted) return;
      const t = audioCtx.currentTime;
      if (ambientNodes.drone) {
        ambientNodes.drone.osc.frequency.setTargetAtTime(55, t, 2);
        ambientNodes.drone.gain.gain.setTargetAtTime(0.02, t, 2);
        ambientNodes.drone.filter.frequency.setTargetAtTime(200, t, 2);
      }
      if (ambientNodes.sub) {
        ambientNodes.sub.osc.frequency.setTargetAtTime(82.5, t, 2);
        ambientNodes.sub.gain.gain.setTargetAtTime(0.012, t, 2);
      }
      if (ambientNodes.pad) {
        ambientNodes.pad.osc.frequency.setTargetAtTime(110, t, 2);
        ambientNodes.pad.gain.gain.setTargetAtTime(0.008, t, 2);
      }
      if (ambientNodes.wind) {
        ambientNodes.wind.gain.gain.setTargetAtTime(0.006, t, 2);
        ambientNodes.wind.filter.frequency.setTargetAtTime(300, t, 2);
      }
      scheduleChimes(6000, 0.35);
    }

    // SLEEPING: descending lullaby + fade
    function soundSleep() {
      if (!audioCtx) return;
      // A4 → E4 → A3 descending
      playTone(440, 1.5, 'sine', 0.04);
      setTimeout(() => playTone(330, 1.5, 'sine', 0.03), 800);
      setTimeout(() => playTone(220, 2, 'sine', 0.025), 1600);
      // Drone descends and fades
      if (ambientNodes.drone) {
        ambientNodes.drone.osc.frequency.setTargetAtTime(30, audioCtx.currentTime, 2);
      }
    }

    function stopDroneSound() {
      if (!ambientStarted) return;
      if (chimesInterval) clearInterval(chimesInterval);
      Object.values(ambientNodes).forEach(n => {
        if (n.gain) n.gain.gain.setTargetAtTime(0, audioCtx.currentTime, 1.5);
      });
      setTimeout(() => {
        Object.values(ambientNodes).forEach(n => {
          try { if (n.osc) n.osc.stop(); } catch {}
          try { if (n.noise) n.noise.stop(); } catch {}
          try { if (n.lfo) n.lfo.stop(); } catch {}
        });
        ambientNodes = {};
        ambientStarted = false;
      }, 4000);
    }

    // Init audio + start ambient on first interaction
    function initAndPlay() {
      initAudio();
      if (guardianPhase === 'alive' || guardianPhase === 'searching' || guardianPhase === 'delivering') {
        startDroneSound();
      }
    }
    document.addEventListener('click', initAndPlay, { once: true });
    document.addEventListener('keydown', initAndPlay, { once: true });
    document.addEventListener('touchstart', initAndPlay, { once: true });

    // ===== TOMES COUNTER =====
    const tomesCounter = document.getElementById('tomesCounter');
    let tomesCount = parseInt(localStorage.getItem('gl-tomes') || '0');
    function updateTomesDisplay() {
      tomesCounter.textContent = tomesCount > 0 ? `Tomes: ${tomesCount}` : '';
    }
    function incrementTomes() {
      tomesCount++;
      localStorage.setItem('gl-tomes', tomesCount);
      updateTomesDisplay();
    }
    updateTomesDisplay();

    // ===== PAYMENT (Lemon Squeezy) =====
    // Set your Lemon Squeezy checkout URLs here (from your dashboard)
    const LS_MEMBERSHIP_URL = 'https://greatlibraryai.lemonsqueezy.com/checkout/buy/4e3760c1-eae3-4ae0-aa6e-20fe21b9bb1a';
    const LS_DONATE_URL = 'https://greatlibraryai.lemonsqueezy.com/checkout/buy/8bd907ae-b11d-4307-9ec4-89d18be07b95';

    document.getElementById('membershipBtn').addEventListener('click', () => {
      if (window.LemonSqueezy) {
        window.LemonSqueezy.Url.Open(LS_MEMBERSHIP_URL);
      } else {
        window.open(LS_MEMBERSHIP_URL, '_blank');
      }
    });

    document.getElementById('donateBtn').addEventListener('click', () => {
      const amount = parseFloat(document.getElementById('donateAmount').value);
      if (!amount || amount < 1) return;
      const cents = Math.round(amount * 100);
      const url = `${LS_DONATE_URL}?checkout[custom_price]=${cents}`;
      if (window.LemonSqueezy) {
        window.LemonSqueezy.Url.Open(url);
      } else {
        window.open(url, '_blank');
      }
    });

    // ===== START: BORDER UNLOADS + AWAKENING IN PARALLEL =====
    sizeBorderLoader();
    borderCurrent = 1;
    borderPath.style.strokeDashoffset = 0;
    setTimeout(() => reverseBorderLoader(), 300);
    // Start awakening immediately — don't wait for border
    setTimeout(() => enterPhase('awakening'), 400);
  </script>
</body>
