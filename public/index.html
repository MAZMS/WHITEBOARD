<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whiteboard — Agent System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #000;
      --fg: #fff;
      --dim: #555;
      --border: #333;
      --surface: #111;
      --grid-dot: #1a1a1a;
    }

    [data-theme="light"] {
      --bg: #fff;
      --fg: #000;
      --dim: #777;
      --border: #ccc;
      --surface: #f0f0f0;
      --grid-dot: #ddd;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      cursor: crosshair;
      transition: background 0.3s cubic-bezier(0.16, 1, 0.3, 1), color 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ── Hide all scrollbars globally ── */
    * {
      scrollbar-width: none;
    }
    *::-webkit-scrollbar { display: none; }

    /* ── Canvas ── */
    #canvas {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* ── Grid overlay ── */
    #grid {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        radial-gradient(circle, var(--grid-dot) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ── Command bar backdrop ── */
    #command-backdrop {
      position: fixed;
      inset: 0;
      z-index: 99;
      background: rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #command-backdrop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── Command bar ── */
    #command-bar {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(100px) scale(0.96);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 20px;
      min-width: 500px;
      max-width: 700px;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 40px rgba(128,128,128,0.08);
    }
    #command-bar.visible {
      transform: translateX(-50%) translateY(0) scale(1);
      opacity: 1;
    }
    #command-bar .prefix {
      color: var(--dim);
      font-size: 14px;
      user-select: none;
      white-space: nowrap;
    }
    #command-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--fg);
      font-family: inherit;
      font-size: 16px;
      caret-color: var(--fg);
    }
    #command-input::placeholder {
      color: var(--dim);
    }
    #command-bar .hint {
      color: var(--border);
      font-size: 11px;
      white-space: nowrap;
    }

    /* ── Agent contact cards on canvas ── */
    .agent-contact-card {
      position: absolute;
      z-index: 40;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      min-width: 160px;
      text-align: center;
      cursor: grab;
      user-select: none;
      animation: cardBounceIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transition: border-color 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 20px rgba(255,255,255,0.03);
    }
    [data-theme="light"] .agent-contact-card {
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    }
    .agent-contact-card:active { cursor: grabbing; }
    .agent-contact-card.active {
      border-color: var(--fg);
      box-shadow: 0 0 15px rgba(255,255,255,0.08);
    }
    [data-theme="light"] .agent-contact-card.active {
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    .agent-contact-card .card-avatar {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
    }
    .agent-contact-card .card-avatar .avatar-head {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--fg);
      margin-bottom: 2px;
    }
    .agent-contact-card .card-avatar .avatar-body {
      width: 32px;
      height: 14px;
      border-radius: 16px 16px 0 0;
      border: 2px solid var(--fg);
      border-bottom: none;
    }
    .agent-contact-card .card-name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .agent-contact-card .card-status {
      font-size: 11px;
      color: var(--dim);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 14px;
    }
    .agent-contact-card .card-status .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--fg);
      animation: pulse 2s infinite ease-in-out;
    }
    .agent-contact-card .card-status .dot.streaming {
      animation: pulseFast 0.5s infinite ease-in-out;
    }
    .agent-contact-card .message-btn {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: none;
      color: var(--fg);
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .agent-contact-card .message-btn:hover {
      background: var(--fg);
      color: var(--bg);
      border-color: var(--fg);
    }
    .agent-contact-card .message-btn:active {
      transform: scale(0.97);
    }

    /* ── Agent chat panel (right side) ── */
    .agent-chat-panel {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      width: 420px;
      max-width: 100vw;
      z-index: 80;
      background: var(--bg);
      border: none;
      border-left: 1px solid var(--border);
      border-radius: 0;
      display: flex;
      flex-direction: column;
      cursor: default;
      user-select: none;
      animation: panelSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      box-shadow: -4px 0 30px rgba(0,0,0,0.15);
    }
    .agent-chat-panel.dismissing {
      animation: panelSlideOut 0.35s cubic-bezier(0.4, 0, 1, 1) forwards;
    }
    .agent-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .agent-avatar {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }
    .avatar-head {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--fg);
      margin-bottom: 1px;
    }
    .avatar-body {
      width: 28px;
      height: 12px;
      border-radius: 14px 14px 0 0;
      border: 2px solid var(--fg);
      border-bottom: none;
    }
    .agent-header-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .agent-chat-panel .agent-name {
      text-align: left;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .agent-chat-panel .agent-status {
      text-align: left;
      justify-content: flex-start;
      font-size: 11px;
      color: var(--dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .agent-chat-panel .agent-status .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--fg);
      animation: pulse 2s infinite ease-in-out;
    }
    .agent-chat-panel .agent-status .dot.streaming {
      animation: pulseFast 0.5s infinite ease-in-out;
    }
    .agent-chat-panel .agent-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
      color: var(--dim);
      line-height: 1.6;
      flex: 1;
      overflow-y: auto;
      word-break: break-word;
      scrollbar-width: none;
      padding: 20px;
    }
    .agent-chat-panel .agent-body::-webkit-scrollbar { display: none; }

    /* ── Chat bubbles ── */
    .msg {
      padding: 10px 16px;
      max-width: 80%;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      font-size: 14px;
      animation: bubbleFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .msg-agent {
      background: var(--surface);
      color: var(--dim);
      border-radius: 18px 18px 18px 4px;
      align-self: flex-start;
    }
    .msg-user {
      background: var(--fg);
      color: var(--bg);
      border-radius: 18px 18px 4px 18px;
      align-self: flex-end;
    }

    /* ── Typing indicator ── */
    .typing-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 2px;
    }
    .typing-indicator .typing-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--dim);
      animation: typingBounce 0.6s infinite ease-in-out;
    }
    .typing-indicator .typing-dot:nth-child(2) {
      animation-delay: 0.15s;
    }
    .typing-indicator .typing-dot:nth-child(3) {
      animation-delay: 0.3s;
    }
    .agent-input-area {
      flex-shrink: 0;
      padding: 16px 20px;
      border-top: 1px solid var(--border);
    }
    .agent-chat-panel .agent-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .agent-chat-panel .agent-input-row input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--fg);
      font-family: inherit;
      font-size: 14px;
      padding: 12px 16px;
      border-radius: 24px;
      outline: none;
      transition: border-color 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .agent-chat-panel .agent-input-row input:focus {
      border-color: var(--fg);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.1), 0 0 16px rgba(255,255,255,0.04);
    }
    [data-theme="light"] .agent-chat-panel .agent-input-row input:focus {
      box-shadow: 0 0 0 3px rgba(0,0,0,0.08), 0 0 16px rgba(0,0,0,0.03);
    }
    .agent-chat-panel .agent-input-row input::placeholder { color: var(--dim); }
    .agent-chat-panel .agent-input-row button {
      background: var(--fg);
      border: none;
      color: var(--bg);
      font-family: inherit;
      font-size: 14px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .agent-chat-panel .agent-input-row button:hover { opacity: 0.85; }
    .agent-chat-panel .agent-input-row button:active { transform: scale(0.9); }
    .agent-chat-panel .agent-input-row button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .agent-chat-panel .agent-model {
      font-size: 10px;
      color: var(--border);
      margin-top: 8px;
      text-align: center;
    }
    .agent-chat-panel .close-btn {
      background: none;
      border: none;
      color: var(--dim);
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .agent-chat-panel .close-btn:hover { color: var(--fg); }
    .agent-chat-panel .close-btn:active { transform: scale(0.9); }
    .agent-chat-panel .close-btn-top {
      position: static;
      margin-left: auto;
      flex-shrink: 0;
    }

    /* ── Drawing lines ── */
    .draw-line {
      position: absolute;
      z-index: 2;
      pointer-events: none;
    }

    /* ── Theme toggle ── */
    #theme-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      background: none;
      border: 1px solid var(--border);
      color: var(--dim);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #theme-toggle:hover { color: var(--fg); border-color: var(--fg); }
    #theme-toggle:active { transform: scale(0.92); }

    /* ── Sticky notes ── */
    .sticky-note {
      position: absolute;
      z-index: 40;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      min-width: 180px;
      min-height: 100px;
      cursor: grab;
      user-select: none;
      animation: agentAppear 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .sticky-note:active { cursor: grabbing; }
    .sticky-note textarea {
      width: 100%;
      min-height: 60px;
      background: none;
      border: none;
      outline: none;
      color: var(--fg);
      font-family: inherit;
      font-size: 13px;
      resize: none;
      line-height: 1.5;
    }
    .sticky-note .close-btn {
      position: absolute;
      top: 6px;
      right: 10px;
      background: none;
      border: none;
      color: var(--dim);
      font-size: 16px;
      cursor: pointer;
      transition: color 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sticky-note .close-btn:hover { color: var(--fg); }

    /* ── Toast ── */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      z-index: 200;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 13px;
      color: var(--dim);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Animations ── */
    @keyframes agentAppear {
      0% {
        opacity: 0;
        transform: scale(0.85) translateY(20px);
        box-shadow: 0 0 40px rgba(255,255,255,0.08);
      }
      60% {
        opacity: 1;
        transform: scale(1.02) translateY(-2px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        box-shadow: 0 0 20px rgba(255,255,255,0.03);
      }
    }
    @keyframes cardBounceIn {
      0% {
        opacity: 0;
        transform: scale(0.9) translateY(24px);
      }
      50% {
        opacity: 1;
        transform: scale(1.04) translateY(-4px);
      }
      75% {
        transform: scale(0.99) translateY(1px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    @keyframes bubbleFadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes panelSlideIn {
      from { transform: translateX(100%); opacity: 0.8; }
      to   { transform: translateX(0); opacity: 1; }
    }
    @keyframes panelSlideOut {
      from { transform: translateX(0); opacity: 1; }
      to   { transform: translateX(100%); opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @keyframes pulseFast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── Splashscreen ── */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #splash h1 {
      font-size: 36px;
      font-weight: 200;
      letter-spacing: 8px;
      text-transform: uppercase;
      margin-bottom: 16px;
      opacity: 0;
      animation: splashFadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    #splash .subtitle {
      font-size: 14px;
      color: var(--dim);
      letter-spacing: 4px;
      opacity: 0;
      animation: splashFadeUp 1.2s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    #splash .disclaimer {
      font-size: 12px;
      color: var(--border);
      letter-spacing: 1px;
      margin-top: 24px;
      opacity: 0;
      animation: splashFadeUp 1.2s 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    #splash .enter-btn {
      margin-top: 48px;
      background: transparent;
      border: 1px solid #fff;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      letter-spacing: 2px;
      padding: 14px 44px;
      border-radius: 8px;
      cursor: pointer;
      opacity: 0;
      animation: splashFadeUp 1.2s 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                 enterBtnPulse 3s 2.2s ease-in-out infinite;
      transition: background 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  color 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }
    [data-theme="light"] #splash .enter-btn {
      border-color: #000;
      color: #000;
    }
    #splash .enter-btn:hover {
      background: #fff;
      color: #000;
      box-shadow: 0 0 24px rgba(255,255,255,0.15);
    }
    [data-theme="light"] #splash .enter-btn:hover {
      background: #000;
      color: #fff;
      box-shadow: 0 0 24px rgba(0,0,0,0.12);
    }
    #splash .enter-btn:active {
      transform: scale(0.97);
    }
    @keyframes splashFadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes enterBtnPulse {
      0%, 100% { box-shadow: 0 0 0 rgba(255,255,255,0); }
      50% { box-shadow: 0 0 20px rgba(255,255,255,0.1); }
    }
    [data-theme="light"] .enter-btn {
      animation-name: splashFadeUp, enterBtnPulseLight !important;
    }
    @keyframes enterBtnPulseLight {
      0%, 100% { box-shadow: 0 0 0 rgba(0,0,0,0); }
      50% { box-shadow: 0 0 20px rgba(0,0,0,0.08); }
    }

    /* ── Help panel ── */
    #help-panel {
      position: fixed;
      right: 20px;
      top: 80px;
      z-index: 100;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      width: 260px;
      font-size: 12px;
      color: var(--dim);
      line-height: 2;
      display: none;
    }
    #help-panel.visible { display: block; animation: agentAppear 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    #help-panel h3 { color: var(--fg); font-size: 13px; margin-bottom: 8px; letter-spacing: 1px; }
    #help-panel kbd {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
      color: var(--fg);
    }
  </style>
</head>
<body>

  <!-- Splash -->
  <div id="splash">
    <h1>The Great Library</h1>
    <p class="subtitle">AI Agent Workspace</p>
    <p class="disclaimer">Designed for desktop. Best experienced on a computer.</p>
    <button class="enter-btn" onclick="startApp()">Enter the Library</button>
  </div>

  <!-- Grid background -->
  <div id="grid"></div>

  <!-- Drawing canvas -->
  <svg id="canvas"></svg>

  <!-- Theme toggle -->
  <button id="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode" style="display:none;">&#9684;</button>

  <!-- Command bar backdrop -->
  <div id="command-backdrop" onclick="closeCommand()"></div>

  <!-- Command bar -->
  <div id="command-bar">
    <span class="prefix">&gt;</span>
    <input id="command-input" type="text" placeholder="What are you trying to achieve?" autocomplete="off" spellcheck="false">
    <span class="hint">enter to begin</span>
  </div>

  <!-- Help panel -->
  <div id="help-panel">
    <h3>SHORTCUTS</h3>
    <div><kbd>Space</kbd> &mdash; command bar</div>
    <div><kbd>D</kbd> &mdash; draw mode</div>
    <div><kbd>N</kbd> &mdash; new note</div>
    <div><kbd>M</kbd> &mdash; move mode</div>
    <div><kbd>E</kbd> &mdash; eraser</div>
    <div><kbd>Esc</kbd> &mdash; close / cancel</div>
    <div><kbd>C</kbd> &mdash; clear board</div>
    <h3 style="margin-top:12px;">AGENTS</h3>
    <div>Describe your goal — AI picks the best agent</div>
    <div id="agent-list-help" style="margin-top:4px;color:var(--dim);font-size:11px;line-height:1.8;"></div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script>
    // ── Theme ──
    (function initTheme() {
      const saved = localStorage.getItem('wb-theme');
      if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();

    function toggleTheme() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('wb-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('wb-theme', 'light');
      }
    }

    // ── State ──
    let started = false;
    let currentTool = 'draw';
    let isDrawing = false;
    let currentPath = null;
    let commandOpen = false;
    let dragTarget = null;
    let dragOffset = { x: 0, y: 0 };

    const canvas = document.getElementById('canvas');
    const commandBar = document.getElementById('command-bar');
    const commandInput = document.getElementById('command-input');
    const themeToggle = document.getElementById('theme-toggle');
    const splash = document.getElementById('splash');
    const helpPanel = document.getElementById('help-panel');

    // ── Agent definitions (loaded from server) ──
    let agents = {};
    async function loadAgents() {
      try {
        const res = await fetch('/api/agents');
        const list = await res.json();
        list.forEach(a => {
          agents[a.key] = { icon: a.icon, desc: a.description, tier: a.tier };
        });
        // Populate help panel
        const helpList = document.getElementById('agent-list-help');
        if (helpList) {
          helpList.innerHTML = list.map(a =>
            `<div>${a.icon} <strong>${a.key}</strong> — ${a.description}</div>`
          ).join('');
        }
      } catch {}
    }
    loadAgents();

    // ── Splash ──
    function startApp() {
      if (started) return;
      started = true;
      splash.classList.add('fade-out');
      setTimeout(() => { splash.style.display = 'none'; }, 600);
      themeToggle.style.display = '';
      toast('Ready — press Space to begin');
    }

    document.addEventListener('keydown', (e) => {
      if (!started && e.code === 'Space') {
        e.preventDefault();
        startApp();
      }
    });

    // ── Toast ──
    let toastTimer;
    let toastFadeTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      // Cancel any pending fade-out and immediately reset
      clearTimeout(toastTimer);
      clearTimeout(toastFadeTimer);
      // Force a reflow to restart the transition if already showing
      t.classList.remove('show');
      void t.offsetWidth;
      t.textContent = msg;
      t.classList.add('show');
      toastTimer = setTimeout(() => {
        t.classList.remove('show');
      }, 2200);
    }

    // ── Help ──
    function toggleHelp() {
      helpPanel.classList.toggle('visible');
    }

    // ── Command bar ──
    const commandBackdrop = document.getElementById('command-backdrop');

    function openCommand() {
      commandOpen = true;
      commandBar.classList.add('visible');
      commandBackdrop.classList.add('visible');
      commandInput.value = '';
      // Immediate auto-focus with a microtask to ensure DOM is ready
      requestAnimationFrame(() => commandInput.focus());
    }
    function closeCommand() {
      commandOpen = false;
      commandBar.classList.remove('visible');
      commandBackdrop.classList.remove('visible');
      commandInput.blur();
    }

    commandInput.addEventListener('keydown', async (e) => {
      if (e.key === 'Escape') { closeCommand(); }
      if (e.key === 'Enter') {
        const val = commandInput.value.trim();
        if (!val) return;
        closeCommand();
        toast('Finding the right agent...');
        try {
          const res = await fetch('/api/agent/pick', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ goal: val }),
          });
          if (!res.ok) {
            const err = await res.json();
            toast(err.error || 'Failed to pick agent');
            return;
          }
          const data = await res.json();
          summonAgent(data.agent, {
            displayName: data.displayName,
            greeting: data.greeting,
          });
        } catch (err) {
          toast('Connection error: ' + err.message);
        }
      }
    });

    // ── Keyboard shortcuts ──
    document.addEventListener('keydown', (e) => {
      if (!started) return;
      if (commandOpen) return;
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

      switch (e.code) {
        case 'Space':
          e.preventDefault();
          openCommand();
          break;
        case 'Escape':
          helpPanel.classList.remove('visible');
          // Close active chat panel on Escape
          if (openPanelId) {
            closeChatPanel();
          }
          break;
      }
    });

    // ── Tool switching ──
    function setTool(tool) {
      currentTool = tool;
      document.body.style.cursor =
        tool === 'draw' ? 'crosshair' :
        tool === 'move' ? 'grab' :
        tool === 'erase' ? 'pointer' :
        'default';
    }

    // ── Drawing ──
    canvas.addEventListener('mousedown', (e) => {
      if (!started || currentTool !== 'draw') return;
      isDrawing = true;
      currentPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      currentPath.setAttribute('stroke', getComputedStyle(document.documentElement).getPropertyValue('--fg').trim());
      currentPath.setAttribute('stroke-width', '2');
      currentPath.setAttribute('fill', 'none');
      currentPath.setAttribute('stroke-linecap', 'round');
      currentPath.setAttribute('stroke-linejoin', 'round');
      currentPath.setAttribute('d', `M ${e.clientX} ${e.clientY}`);
      currentPath.classList.add('draw-line');
      canvas.appendChild(currentPath);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing || !currentPath) return;
      const d = currentPath.getAttribute('d');
      currentPath.setAttribute('d', d + ` L ${e.clientX} ${e.clientY}`);
    });

    canvas.addEventListener('mouseup', () => {
      isDrawing = false;
      currentPath = null;
    });

    canvas.addEventListener('mouseleave', () => {
      isDrawing = false;
      currentPath = null;
    });

    // ── Eraser ──
    canvas.addEventListener('click', (e) => {
      if (currentTool !== 'erase') return;
      const el = document.elementFromPoint(e.clientX, e.clientY);
      if (el && el.tagName === 'path' && el.parentNode === canvas) {
        el.style.transition = 'opacity 0.2s';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 200);
      }
    });

    // ── Sticky notes ──
    function createNote(x, y) {
      const note = document.createElement('div');
      note.className = 'sticky-note';
      note.style.left = x + 'px';
      note.style.top = y + 'px';
      note.innerHTML = `
        <button class="close-btn" onclick="this.parentElement.remove()">&times;</button>
        <textarea placeholder="Type here..."></textarea>
      `;
      document.body.appendChild(note);
      makeDraggable(note);
      note.querySelector('textarea').focus();
    }

    // ── Conversation memory per agent ──
    const conversationMap = new Map(); // agentId -> [{ role, content }, ...]
    const agentCards = new Map();      // agentId -> { name, displayName, element }
    let openPanelId = null;            // which agent's chat panel is open (or null)
    let cardCounter = 0;               // for staggered placement

    // ── Card placement (staggered grid with randomness) ──
    function getCardPosition() {
      const cols = 3;
      const baseX = 120;
      const baseY = 100;
      const spacingX = 200;
      const spacingY = 220;
      const col = cardCounter % cols;
      const row = Math.floor(cardCounter / cols);
      const randX = (Math.random() - 0.5) * 40;
      const randY = (Math.random() - 0.5) * 30;
      cardCounter++;
      return {
        x: baseX + col * spacingX + randX,
        y: baseY + row * spacingY + randY,
      };
    }

    // ── Agent summoning — creates a contact card on canvas ──
    function summonAgent(name, opts = {}) {
      const agent = agents[name] || { icon: '●', desc: `Custom agent "${name}" is ready. Ask me anything.` };
      const displayName = opts.displayName || (name.charAt(0).toUpperCase() + name.slice(1));
      const greeting = opts.greeting || agent.desc;
      const agentId = 'agent-' + Date.now();

      // Initialize conversation history with the greeting
      conversationMap.set(agentId, [
        { role: 'assistant', content: greeting },
      ]);

      // Get staggered position
      const pos = getCardPosition();

      // Create the contact card
      const card = document.createElement('div');
      card.className = 'agent-contact-card';
      card.id = agentId;
      card.dataset.agentName = name;
      card.style.left = pos.x + 'px';
      card.style.top = pos.y + 'px';

      card.innerHTML = `
        <div class="card-avatar">
          <div class="avatar-head"></div>
          <div class="avatar-body"></div>
        </div>
        <div class="card-name">${displayName}</div>
        <div class="card-status"><span class="dot"></span> Online</div>
        <button class="message-btn" onclick="openChat('${agentId}')">Message</button>
      `;

      document.body.appendChild(card);
      makeDraggable(card);

      // Track the card
      agentCards.set(agentId, { name, displayName, element: card });

      toast(`${displayName} is online`);
    }

    // ── Open chat panel for an agent ──
    function openChat(agentId) {
      // If same panel is already open, just focus input
      if (openPanelId === agentId) {
        const existing = document.getElementById('chat-panel');
        if (existing) {
          existing.querySelector('.agent-input-row input').focus();
        }
        return;
      }

      // Close existing panel instantly (no animation) if switching
      if (openPanelId) {
        const oldPanel = document.getElementById('chat-panel');
        if (oldPanel) oldPanel.remove();
        // Remove active highlight from old card
        const oldCard = document.getElementById(openPanelId);
        if (oldCard) oldCard.classList.remove('active');
      }

      openPanelId = agentId;
      const info = agentCards.get(agentId);
      if (!info) return;

      // Highlight the active card
      info.element.classList.add('active');

      // Build the chat panel
      const panel = document.createElement('div');
      panel.className = 'agent-chat-panel';
      panel.id = 'chat-panel';
      panel.dataset.agentId = agentId;

      panel.innerHTML = `
        <div class="agent-header">
          <div class="agent-avatar">
            <div class="avatar-head"></div>
            <div class="avatar-body"></div>
          </div>
          <div class="agent-header-info">
            <div class="agent-name">${info.displayName}</div>
            <div class="agent-status">
              <span class="dot"></span>
              <span>Online</span>
            </div>
          </div>
          <button class="close-btn close-btn-top" onclick="closeChatPanel()">&times;</button>
        </div>
        <div class="agent-body"></div>
        <div class="agent-input-area">
          <div class="agent-input-row">
            <input type="text" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendToAgent('${agentId}')">
            <button onclick="sendToAgent('${agentId}')">&#9654;</button>
          </div>
          <div class="agent-model"></div>
        </div>
      `;

      document.body.appendChild(panel);

      // Render existing conversation history into the panel with staggered fade-in
      const body = panel.querySelector('.agent-body');
      const history = conversationMap.get(agentId) || [];
      history.forEach((msg, idx) => {
        const bubble = document.createElement('div');
        bubble.className = msg.role === 'user' ? 'msg msg-user' : 'msg msg-agent';
        bubble.textContent = msg.content;
        bubble.style.animationDelay = (idx * 0.06) + 's';
        bubble.style.opacity = '0';
        body.appendChild(bubble);
      });

      // Scroll to bottom
      body.scrollTop = body.scrollHeight;

      // Focus the input
      panel.querySelector('.agent-input-row input').focus();
    }

    // ── Close chat panel ──
    function closeChatPanel() {
      const panel = document.getElementById('chat-panel');
      if (!panel) return;

      // Remove active highlight from card
      if (openPanelId) {
        const card = document.getElementById(openPanelId);
        if (card) card.classList.remove('active');
      }

      panel.classList.add('dismissing');
      setTimeout(() => {
        panel.remove();
      }, 350);
      openPanelId = null;
    }

    // ── Send message to agent ──
    async function sendToAgent(agentId) {
      const panel = document.getElementById('chat-panel');
      if (!panel || panel.dataset.agentId !== agentId) return;

      const input = panel.querySelector('.agent-input-row input');
      const btn = panel.querySelector('.agent-input-row button');
      const body = panel.querySelector('.agent-body');
      const statusEl = panel.querySelector('.agent-status span:last-child');
      const dotEl = panel.querySelector('.dot');
      const modelEl = panel.querySelector('.agent-model');
      const message = input.value.trim();
      if (!message) return;

      const info = agentCards.get(agentId);
      const history = conversationMap.get(agentId) || [];

      // Also update the card's status dot to streaming
      const cardDot = info ? info.element.querySelector('.dot') : null;

      // 1. Show user bubble
      const userBubble = document.createElement('div');
      userBubble.className = 'msg msg-user';
      userBubble.textContent = message;
      body.appendChild(userBubble);

      // Add to conversation history
      history.push({ role: 'user', content: message });

      // 2. Append agent bubble with typing indicator
      const agentBubble = document.createElement('div');
      agentBubble.className = 'msg msg-agent';
      agentBubble.innerHTML = '<span class="typing-indicator"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></span>';
      body.appendChild(agentBubble);

      // Auto-scroll
      body.scrollTop = body.scrollHeight;

      // Set running state
      input.value = '';
      btn.disabled = true;
      statusEl.textContent = 'Thinking...';
      dotEl.classList.add('streaming');
      if (cardDot) cardDot.classList.add('streaming');

      let replyText = '';

      try {
        const agentName = info ? info.name : (document.getElementById(agentId)?.dataset.agentName || 'unknown');

        const res = await fetch('/api/agent/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            agent: agentName,
            messages: history,
          }),
        });

        if (!res.ok) {
          const err = await res.json();
          agentBubble.textContent = err.error || 'Something went wrong.';
          statusEl.textContent = 'Error';
          dotEl.classList.remove('streaming');
          if (cardDot) cardDot.classList.remove('streaming');
          btn.disabled = false;
          return;
        }

        statusEl.textContent = 'Streaming...';
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let firstChunk = true;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            try {
              const data = JSON.parse(line.slice(6));
              if (data.text) {
                if (firstChunk) {
                  agentBubble.textContent = '';
                  firstChunk = false;
                }
                replyText += data.text;
                agentBubble.textContent = replyText;
                body.scrollTop = body.scrollHeight;
              }
              if (data.done) {
                modelEl.textContent = data.total_tokens ? `${data.total_tokens} tokens` : '';
              }
            } catch {}
          }
        }

        // Save assistant reply to conversation history
        history.push({ role: 'assistant', content: replyText });
        conversationMap.set(agentId, history);

        statusEl.textContent = 'Online';
        dotEl.classList.remove('streaming');
        if (cardDot) cardDot.classList.remove('streaming');
      } catch (err) {
        agentBubble.textContent = 'Connection error: ' + err.message;
        statusEl.textContent = 'Error';
        dotEl.classList.remove('streaming');
        if (cardDot) cardDot.classList.remove('streaming');
      }

      btn.disabled = false;
      input.focus();
    }

    // ── Drag system ──
    function makeDraggable(el) {
      el.addEventListener('mousedown', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
        dragTarget = el;
        dragOffset.x = e.clientX - el.offsetLeft;
        dragOffset.y = e.clientY - el.offsetTop;
        el.style.zIndex = 60;
      });
    }

    document.addEventListener('mousemove', (e) => {
      if (!dragTarget) return;
      dragTarget.style.left = (e.clientX - dragOffset.x) + 'px';
      dragTarget.style.top = (e.clientY - dragOffset.y) + 'px';
    });

    document.addEventListener('mouseup', () => {
      if (dragTarget) {
        dragTarget.style.zIndex = '';
        dragTarget = null;
      }
    });

    // ── Clear board ──
    function clearBoard() {
      canvas.innerHTML = '';
      // Close chat panel if open
      const panel = document.getElementById('chat-panel');
      if (panel) panel.remove();
      openPanelId = null;
      // Remove all contact cards and sticky notes
      document.querySelectorAll('.agent-contact-card, .sticky-note').forEach(el => el.remove());
      agentCards.clear();
      conversationMap.clear();
      cardCounter = 0;
      toast('Board cleared');
    }
  </script>
</body>
</html>
