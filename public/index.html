<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GreatLibrary</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto; }
  </style>
</head>
<body class="bg-white text-black">
  <main x-data="store()" class="max-w-6xl mx-auto px-6 py-12">
    <header class="border-b border-black/10 pb-8 mb-12 flex justify-between items-end">
      <div>
        <h1 class="text-5xl font-extrabold tracking-tight">GreatLibrary</h1>
        <p class="text-lg text-black/60 mt-2">A library of deployable agents.</p>
      </div>
      <div class="flex gap-4">
        <a href="/workspace.html" class="text-sm uppercase tracking-wider hover:underline">Workspace</a>
        <a href="/admin.html" class="text-sm uppercase tracking-wider hover:underline">Admin</a>
      </div>
    </header>

    <input
      type="search"
      x-model="q"
      placeholder="Search blueprints..."
      class="w-full border border-black/10 rounded-none px-4 py-3 mb-8 focus:outline-none focus:border-black"
    />

    <ul class="grid grid-cols-1 md:grid-cols-2 gap-px bg-black/10">
      <template x-for="bp in filtered()" :key="bp.id">
        <li class="bg-white p-8 hover:bg-black/[0.02]">
          <h2 class="font-bold text-xl" x-text="bp.name"></h2>
          <p class="text-black/60 mt-1" x-text="bp.description"></p>
          <div class="mt-4 flex flex-wrap gap-2">
            <template x-for="perm in bp.requiredPermissions" :key="perm">
              <span class="text-xs bg-black/5 px-2 py-1 rounded" x-text="perm"></span>
            </template>
          </div>
          <div class="mt-6 flex justify-between text-xs uppercase tracking-wider text-black/50">
            <span x-text="bp.stability + '% stable'"></span>
            <span x-text="bp.activeRuns + ' runs'"></span>
            <span x-text="'~$' + bp.estimatedMonthlyCost + '/mo'"></span>
          </div>
          <button
            @click="deploy(bp)"
            class="mt-6 w-full bg-black text-white py-3 text-sm font-medium uppercase tracking-wider hover:bg-black/80"
          >
            Deploy
          </button>
        </li>
      </template>
    </ul>

    <div x-show="bps.length === 0" class="text-center text-black/40 py-20">
      <p class="text-xl">No blueprints yet</p>
      <p class="mt-2">Publish your first blueprint with <code class="bg-black/5 px-2 py-1">greatlibrary publish</code></p>
    </div>

    <!-- Support Chat Panel -->
    <div x-data="supportChat()" class="fixed bottom-6 right-6 z-50">
      <button @click="open = !open" class="bg-black text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg text-xl">?</button>
      <div x-show="open" x-cloak class="absolute bottom-16 right-0 w-80 bg-white border border-black/10 shadow-xl">
        <div class="p-4 border-b border-black/10 font-bold">Support</div>
        <div class="p-4 h-64 overflow-y-auto" x-ref="msgs">
          <template x-for="msg in messages" :key="msg.id">
            <div :class="msg.role === 'user' ? 'text-right mb-2' : 'text-left mb-2'">
              <span :class="msg.role === 'user' ? 'bg-black text-white' : 'bg-black/5'" class="inline-block px-3 py-2 text-sm rounded" x-text="msg.text"></span>
            </div>
          </template>
          <div x-show="escalated" class="bg-red-50 border border-red-200 p-3 mt-2 text-sm">
            <p class="font-bold">This issue needs human support.</p>
            <a href="mailto:support@greatlibrary.ai" class="text-red-600 underline">Email support@greatlibrary.ai</a>
          </div>
        </div>
        <div class="p-4 border-t border-black/10 flex gap-2">
          <input x-model="input" @keyup.enter="send()" placeholder="Ask a question..." class="flex-1 border border-black/10 px-3 py-2 text-sm focus:outline-none" />
          <button @click="send()" class="bg-black text-white px-4 py-2 text-sm">Send</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    function store() {
      return {
        q: '',
        bps: [],
        async init() {
          this.bps = await (await fetch('/api/blueprints')).json();
        },
        filtered() {
          const q = this.q.toLowerCase();
          return this.bps.filter(b => b.name.toLowerCase().includes(q) || b.description.toLowerCase().includes(q));
        },
        async deploy(bp) {
          alert('Deploying ' + bp.name + '... (sign in required)');
        }
      };
    }

    function supportChat() {
      return {
        open: false,
        input: '',
        messages: [],
        escalated: false,
        msgId: 0,
        async send() {
          if (!this.input.trim()) return;
          const text = this.input;
          this.input = '';
          this.messages.push({ id: ++this.msgId, role: 'user', text });
          try {
            const res = await fetch('/api/support', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            if (data.escalated) {
              this.escalated = true;
            } else {
              this.messages.push({ id: ++this.msgId, role: 'assistant', text: data.reply });
            }
          } catch {
            this.messages.push({ id: ++this.msgId, role: 'assistant', text: 'Support is currently unavailable.' });
          }
        }
      };
    }
  </script>
</body>
</html>
