<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Great Library AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #c8b88a;
      font-family: 'Georgia', 'Times New Roman', serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 4vh;
      position: relative;
      overflow: hidden;
    }

    /* ===== EYE CONTAINER & AURA ===== */
    .eye-container {
      position: relative;
      flex-shrink: 0;
    }

    .eye-container::before,
    .eye-container::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 2s ease-in, width 2s ease, height 2s ease, background 2s ease;
    }

    .eye-container::before {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(180, 160, 100, 0.06) 0%, transparent 70%);
    }

    .eye-container::after {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(180, 160, 100, 0.03) 0%, transparent 60%);
    }

    @keyframes aura-pulse {
      0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    }

    /* ===== EYE SYMBOL ===== */
    .eye-symbol {
      width: 120px;
      height: 120px;
      position: relative;
      z-index: 1;
    }

    .eye-symbol svg {
      width: 100%;
      height: 100%;
    }

    @keyframes breathe {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(180, 160, 100, 0.04)); }
      50% { filter: drop-shadow(0 0 18px rgba(180, 160, 100, 0.12)); }
    }

    @keyframes breathe-intense {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(200, 180, 110, 0.1)); }
      50% { filter: drop-shadow(0 0 30px rgba(200, 180, 110, 0.25)); }
    }

    .triangle-line {
      stroke: #3a3528;
      stroke-opacity: 0.2;
      transition: stroke-opacity 2s ease, stroke 2s ease;
    }

    @keyframes triangle-shimmer {
      0% { stroke-opacity: 0.6; }
      25% { stroke-opacity: 1; }
      50% { stroke-opacity: 0.6; }
      75% { stroke-opacity: 0.9; }
      100% { stroke-opacity: 0.6; }
    }

    .eye-outline {
      transition: stroke 1s ease;
    }

    @keyframes eye-glow {
      0%, 100% { stroke: #3a3528; }
      50% { stroke: #5a5038; }
    }

    .iris-ring {
      opacity: 0;
      transform-origin: 60px 68px;
      transition: opacity 1.5s ease-in;
    }

    @keyframes iris-pulse {
      0%, 100% { transform: scale(1); stroke: #3a3528; }
      50% { transform: scale(1.08); stroke: #4a4530; }
    }

    .pupil {
      fill: #5a5038;
      opacity: 0;
      transition: opacity 1.5s ease-in;
    }

    @keyframes pupil-idle {
      0%, 100% { fill: #4a4030; }
      50% { fill: #6a6048; }
    }

    .eyelid-upper, .eyelid-lower {
      transition: stroke 2s ease;
    }

    /* Blink (used during alive phase only) */
    .eye-symbol.blink .eyelid-upper { d: path("M34 68 Q60 68 86 68"); }
    .eye-symbol.blink .eyelid-lower { d: path("M34 68 Q60 68 86 68"); }
    .eye-symbol.blink .eye-outline { ry: 0.5; }
    .eye-symbol.blink .iris-ring,
    .eye-symbol.blink .pupil { opacity: 0; }

    /* ===== PHASE: ALIVE ===== */
    body.phase-alive .eye-container::before {
      opacity: 1;
      transition: opacity 2s ease-in;
      animation: aura-pulse 4s ease-in-out infinite;
    }
    body.phase-alive .eye-container::after {
      opacity: 1;
      transition: opacity 2s ease-in;
      animation: aura-pulse 6s ease-in-out infinite reverse;
    }
    body.phase-alive .eye-symbol svg {
      animation: breathe 5s ease-in-out infinite;
    }
    body.phase-alive .triangle-line {
      stroke-opacity: 0.6;
      animation: triangle-shimmer 8s linear infinite;
    }
    body.phase-alive .eye-outline {
      animation: eye-glow 4s ease-in-out infinite;
    }
    body.phase-alive .iris-ring {
      animation: iris-pulse 3s ease-in-out infinite;
    }
    body.phase-alive .pupil {
      animation: pupil-idle 6s ease-in-out infinite;
    }

    /* ===== PHASE: AWAKENING ===== */
    /* Start animations early but subtle — so the jump to alive is invisible */
    body.phase-awakening .eye-container::before,
    body.phase-awakening .eye-container::after {
      opacity: 0.6;
      transition: opacity 3s ease-in;
    }
    body.phase-awakening .triangle-line {
      stroke-opacity: 0.4;
      transition: stroke-opacity 3s ease-in;
    }
    body.phase-awakening .eye-symbol svg {
      animation: breathe 8s ease-in-out infinite;
    }
    body.phase-awakening .eye-outline {
      animation: eye-glow 6s ease-in-out infinite;
    }
    body.phase-awakening .iris-ring {
      animation: iris-pulse 5s ease-in-out infinite;
    }
    body.phase-awakening .pupil {
      animation: pupil-idle 8s ease-in-out infinite;
    }

    /* ===== PHASE: SEARCHING ===== */
    body.phase-searching .eye-container::before {
      opacity: 1;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(200, 180, 110, 0.12) 0%, transparent 70%);
      animation: aura-pulse 2.5s ease-in-out infinite;
    }
    body.phase-searching .eye-container::after {
      opacity: 1;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(200, 180, 110, 0.06) 0%, transparent 60%);
      animation: aura-pulse 3.5s ease-in-out infinite reverse;
    }
    body.phase-searching .eye-symbol svg {
      animation: breathe-intense 2.5s ease-in-out infinite;
    }
    body.phase-searching .triangle-line {
      stroke: #5a5038;
      stroke-opacity: 1;
      animation: triangle-shimmer 3s linear infinite;
    }
    body.phase-searching .eye-outline {
      animation: eye-glow 2s ease-in-out infinite;
    }
    body.phase-searching .iris-ring {
      animation: iris-pulse 1.5s ease-in-out infinite;
      stroke: #6a6048;
    }

    /* ===== PHASE: SLEEPING ===== */
    body.phase-sleeping .eye-symbol svg {
      animation: none;
      filter: drop-shadow(0 0 0px transparent);
      transition: filter 3s ease-out;
    }
    body.phase-sleeping .eye-container::before,
    body.phase-sleeping .eye-container::after {
      opacity: 0;
      animation: none;
      transition: opacity 3s ease-out;
    }
    body.phase-sleeping .triangle-line {
      stroke-opacity: 0.1;
      stroke: #1a1510;
      animation: none;
      transition: stroke-opacity 4s ease-out, stroke 4s ease-out;
    }
    body.phase-sleeping .eye-outline,
    body.phase-sleeping .eyelid-upper,
    body.phase-sleeping .eyelid-lower {
      stroke: #1a1510;
      transition: stroke 3s ease-out;
    }
    body.phase-sleeping .iris-ring,
    body.phase-sleeping .pupil {
      animation: none;
    }
    body.phase-sleeping .chat-area {
      opacity: 0.4;
      transition: opacity 4s ease-out;
    }
    body.phase-sleeping .input-area {
      opacity: 0.2;
      transition: opacity 3s ease-out;
    }
    body.phase-sleeping .input-area textarea {
      border-color: #1a1510;
      cursor: not-allowed;
    }

    /* ===== PARTICLES ===== */
    .particles {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(180, 160, 100, 0.15);
      border-radius: 50%;
      animation: float-up linear infinite;
    }

    body.phase-searching .particle {
      background: rgba(200, 180, 110, 0.25);
    }

    @keyframes float-up {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-200px) scale(0); opacity: 0; }
    }

    /* ===== CHAT ===== */
    .chat-area {
      flex: 1;
      width: 100%;
      max-width: 700px;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: opacity 4s ease-out;
    }

    .chat-area::-webkit-scrollbar { display: none; }
    .chat-area { -ms-overflow-style: none; scrollbar-width: none; }

    .message { animation: fade-in 0.6s ease-out; }
    .message.user { text-align: right; color: #8a8070; font-style: italic; }
    .message.guardian { color: #c8b88a; line-height: 1.6; }
    .message.error { color: #7a4040; font-style: italic; }
    .thinking { color: #5a5040; font-style: italic; animation: pulse-text 1.5s ease-in-out infinite; }

    @keyframes pulse-text {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== INPUT ===== */
    .input-area {
      border-top: 1px solid #2a2520;
      padding: 20px 24px 28px;
      display: flex;
      justify-content: center;
      position: relative;
      z-index: 2;
      transition: opacity 3s ease-out;
    }

    .input-area form {
      width: 100%;
      max-width: 680px;
      display: flex;
      gap: 10px;
    }

    .input-area textarea {
      flex: 1;
      background: #141210;
      border: 1px solid #2a2520;
      border-radius: 6px;
      padding: 14px 18px;
      color: #c8b88a;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      resize: none;
      overflow-y: hidden;
      max-height: 120px;
      line-height: 1.4;
    }

    .input-area textarea::placeholder { color: #5a5040; }
    .input-area textarea:focus { border-color: #4a4030; box-shadow: 0 0 20px rgba(180, 160, 100, 0.05); }
    .input-area textarea:disabled { opacity: 0.5; }

    #sendBtn {
      background: rgba(180, 160, 100, 0.08);
      border: 1px solid #2a2520;
      border-radius: 6px;
      color: #5a5040;
      padding: 0 14px;
      cursor: pointer;
      transition: color 0.3s, border-color 0.3s, background 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #sendBtn:hover { color: #c8b88a; border-color: #4a4030; background: rgba(180, 160, 100, 0.12); }
    #sendBtn:disabled { opacity: 0.3; cursor: not-allowed; }

    .download-link {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 20px;
      background: rgba(180, 160, 100, 0.08);
      border: 1px solid #3a3528;
      border-radius: 6px;
      color: #c8b88a;
      text-decoration: none;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 14px;
      transition: background 0.3s, border-color 0.3s;
      cursor: pointer;
    }
    .download-link:hover { background: rgba(180, 160, 100, 0.15); border-color: #5a5038; }

    .message.first-greeting {
      animation: fade-in-slow 1.5s ease-out;
    }
    @keyframes fade-in-slow {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .return-link { text-align: center; margin-top: 24px; }
    .return-link a {
      color: #5a5040;
      text-decoration: none;
      font-style: italic;
      transition: color 0.5s;
    }
    .return-link a:hover { color: #c8b88a; }

    /* ===== MOBILE ===== */
    @media (max-width: 600px) {
      .main {
        padding-top: 3vh;
      }

      .eye-symbol {
        width: 90px;
        height: 90px;
      }

      .eye-container::before {
        width: 150px;
        height: 150px;
      }
      .eye-container::after {
        width: 220px;
        height: 220px;
      }

      body.phase-searching .eye-container::before {
        width: 200px;
        height: 200px;
      }
      body.phase-searching .eye-container::after {
        width: 300px;
        height: 300px;
      }

      .chat-area {
        padding: 14px 16px;
        gap: 12px;
      }

      .message {
        font-size: 14px;
      }

      .message.guardian {
        line-height: 1.5;
      }

      .input-area {
        padding: 14px 16px 20px;
        padding-bottom: calc(20px + env(safe-area-inset-bottom));
      }

      .input-area textarea {
        font-size: 16px; /* prevents iOS zoom on focus */
        padding: 12px 14px;
      }

      .download-link {
        padding: 12px 18px;
        font-size: 14px;
        display: block;
        text-align: center;
      }
    }

    @media (max-height: 500px) {
      .main {
        padding-top: 1vh;
      }
      .eye-symbol {
        width: 70px;
        height: 70px;
      }
    }
  </style>
</head>
<body class="phase-dormant">
  <div class="main">
    <div class="particles" id="particles"></div>
    <div class="eye-container">
      <div class="eye-symbol" id="eyeSymbol">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon class="triangle-line" points="60,12 110,105 10,105" stroke="#3a3528" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
          <!-- Eye starts closed: ry=0.5, eyelids flat -->
          <ellipse class="eye-outline" cx="60" cy="68" rx="26" ry="0.5" stroke="#3a3528" stroke-width="1.2" fill="none"/>
          <circle class="iris-ring" cx="60" cy="68" r="8" stroke="#3a3528" stroke-width="1.2" fill="none"/>
          <circle class="pupil" id="pupil" cx="60" cy="68" r="3.5" fill="#4a4030"/>
          <path class="eyelid-upper" d="M34 68 Q60 68 86 68" stroke="#3a3528" stroke-width="1" fill="none"/>
          <path class="eyelid-lower" d="M34 68 Q60 68 86 68" stroke="#3a3528" stroke-width="1" fill="none"/>
        </svg>
      </div>
    </div>
    <div class="chat-area" id="chatArea"></div>
  </div>
  <div class="input-area">
    <form id="chatForm">
      <textarea id="guardianInput" placeholder="Speak unto the Guardian..." rows="1" autocomplete="off" disabled></textarea>
      <button type="submit" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>

  <script>
    // ===== ELEMENTS =====
    const pupil = document.getElementById('pupil');
    const eyeSymbol = document.getElementById('eyeSymbol');
    const eyeOutline = document.querySelector('.eye-outline');
    const eyelidUpper = document.querySelector('.eyelid-upper');
    const eyelidLower = document.querySelector('.eyelid-lower');
    const irisRing = document.querySelector('.iris-ring');
    const particlesContainer = document.getElementById('particles');
    const chatArea = document.getElementById('chatArea');
    const chatForm = document.getElementById('chatForm');
    const input = document.getElementById('guardianInput');
    const sendBtn = document.getElementById('sendBtn');
    const sessionId = crypto.randomUUID();

    // ===== STATE =====
    let guardianPhase = 'dormant';
    let particleInterval = null;
    let blinkTimeout = null;
    let isAsleep = false;
    let driftRAF = null;
    let trackingEnabled = false;

    // ===== PHASE MANAGER =====
    function enterPhase(phase) {
      document.body.classList.remove(
        'phase-dormant', 'phase-awakening', 'phase-alive',
        'phase-searching', 'phase-delivering', 'phase-sleeping'
      );
      document.body.classList.add('phase-' + phase);
      guardianPhase = phase;

      switch (phase) {
        case 'awakening': handleAwakening(); break;
        case 'alive': handleAlive(); break;
        case 'searching': handleSearching(); break;
        case 'delivering': handleDelivering(); break;
        case 'sleeping': handleSleeping(); break;
      }
    }

    // ===== EASING =====
    function easeInOutQuad(t) {
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    // ===== ANIMATE EYE OPEN =====
    function animateEyeOpen(duration = 1500) {
      const start = performance.now();
      function frame(now) {
        const t = easeInOutQuad(Math.min((now - start) / duration, 1));
        eyeOutline.setAttribute('ry', 0.5 + t * 13.5);
        eyelidUpper.setAttribute('d', `M34 68 Q60 ${68 - t * 20} 86 68`);
        eyelidLower.setAttribute('d', `M34 68 Q60 ${68 + t * 20} 86 68`);
        if (t < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);

      // Fade in iris + pupil at 40% through
      setTimeout(() => {
        irisRing.style.opacity = '1';
        pupil.style.opacity = '1';
      }, duration * 0.4);
    }

    // ===== ANIMATE EYE CLOSE =====
    function animateEyeClose(duration = 2000) {
      const start = performance.now();
      function frame(now) {
        const t = easeInOutQuad(Math.min((now - start) / duration, 1));
        eyeOutline.setAttribute('ry', 14 - t * 13.5);
        eyelidUpper.setAttribute('d', `M34 68 Q60 ${48 + t * 20} 86 68`);
        eyelidLower.setAttribute('d', `M34 68 Q60 ${88 - t * 20} 86 68`);
        // Fade iris/pupil in first 40%
        if (t < 0.4) {
          const o = 1 - (t / 0.4);
          irisRing.style.opacity = o;
          pupil.style.opacity = o;
        } else {
          irisRing.style.opacity = '0';
          pupil.style.opacity = '0';
        }
        if (t < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    // ===== BLINKING =====
    function blink() {
      if (isAsleep) return;
      eyeSymbol.classList.add('blink');
      setTimeout(() => eyeSymbol.classList.remove('blink'), 160);
    }

    function scheduleBlink() {
      if (isAsleep) return;
      blinkTimeout = setTimeout(() => {
        blink();
        if (Math.random() < 0.25) setTimeout(blink, 300);
        scheduleBlink();
      }, 2500 + Math.random() * 5000);
    }

    // ===== PARTICLES =====
    function spawnParticle() {
      const p = document.createElement('div');
      p.className = 'particle';
      const eyeRect = eyeSymbol.getBoundingClientRect();
      const cx = eyeRect.left + eyeRect.width / 2;
      const cy = eyeRect.top + eyeRect.height / 2;
      const angle = Math.random() * Math.PI * 2;
      const radius = 40 + Math.random() * 80;
      p.style.left = (cx + Math.cos(angle) * radius) + 'px';
      p.style.top = (cy + Math.sin(angle) * radius) + 'px';
      p.style.width = (1 + Math.random() * 2) + 'px';
      p.style.height = p.style.width;
      p.style.animationDuration = (4 + Math.random() * 6) + 's';
      p.style.opacity = 0.1 + Math.random() * 0.2;
      particlesContainer.appendChild(p);
      setTimeout(() => p.remove(), 10000);
    }

    // ===== PUPIL TRACKING =====
    function onMouseMove(e) {
      if (!trackingEnabled) return;
      const rect = eyeSymbol.getBoundingClientRect();
      const dx = e.clientX - (rect.left + rect.width / 2);
      const dy = e.clientY - (rect.top + rect.height / 2);
      const dist = Math.sqrt(dx * dx + dy * dy);
      const clamp = Math.min(dist / 300, 1);
      pupil.setAttribute('cx', 60 + (dx / (dist || 1)) * 4 * clamp);
      pupil.setAttribute('cy', 68 + (dy / (dist || 1)) * 4 * clamp);
    }
    document.addEventListener('mousemove', onMouseMove);

    // ===== PUPIL DRIFT (thinking/searching) =====
    function startDrift(speed, range) {
      trackingEnabled = false;
      const startTime = performance.now();
      function drift(now) {
        const t = (now - startTime) / speed;
        pupil.setAttribute('cx', 60 + Math.sin(t * 2.1) * range);
        pupil.setAttribute('cy', 68 + Math.cos(t * 1.7) * (range * 0.5));
        driftRAF = requestAnimationFrame(drift);
      }
      driftRAF = requestAnimationFrame(drift);
    }

    function stopDrift() {
      if (driftRAF) cancelAnimationFrame(driftRAF);
      driftRAF = null;
      pupil.setAttribute('cx', 60);
      pupil.setAttribute('cy', 68);
      trackingEnabled = true;
    }

    // ===== CHAT =====
    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = 'message ' + type;
      div.textContent = text;
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
      return div;
    }

    // ===== PHASE HANDLERS =====

    function handleAwakening() {
      // Slow, cinematic eye open
      animateEyeOpen(2500);

      // Particles start midway, slow at first
      setTimeout(() => {
        particleInterval = setInterval(spawnParticle, 900);
      }, 2000);

      // Random awakening phrases
      const stirPhrases = [
        'The Guardian stirs...',
        'Something ancient awakens...',
        'The darkness shifts...',
        'A presence emerges...',
        'The eye opens...',
        'The halls tremble...',
        'An old power wakes...',
        'The silence breaks...',
        'The Library breathes...',
        'Dust falls from forgotten shelves...',
        'The infinite stirs...',
        'A light flickers in the void...',
        'The ancient one returns...',
        'The scrolls whisper...',
        'The Guardian draws breath...',
        'Pages turn in the dark...',
        'The watcher awakens...',
        'The great eye opens...',
        'Eternity blinks...',
        'The keeper rises...',
        'The void hums...',
        'A thousand tomes shudder...',
        'The threshold opens...',
        'The abyss gazes back...',
        'The sentient dark awakens...',
        'Something remembers you...',
        'The archive pulses...',
        'Time folds...',
        'The all-seeing stirs...',
        'A forgotten god wakes...',
      ];
      const stirText = stirPhrases[Math.floor(Math.random() * stirPhrases.length)];

      // Fetch greeting in parallel with animation
      const greetPromise = fetch('/api/greet').then(r => r.json()).catch(() => ({
        reply: 'The infinite halls echo with your arrival... what knowledge do you seek, Traveler?'
      }));

      // Don't show anything until eye is mostly open
      const minDelay = new Promise(resolve => setTimeout(resolve, 2500));

      Promise.all([greetPromise, minDelay]).then(([data]) => {
        // "The Guardian stirs..." appears briefly
        const thinking = addMessage(stirText, 'thinking');

        // Replace with greeting after a beat
        setTimeout(() => {
          thinking.remove();
          const greetDiv = addMessage(data.reply, 'guardian');
          greetDiv.classList.add('first-greeting');

          // Speed up particles, start blinking
          clearInterval(particleInterval);
          particleInterval = setInterval(spawnParticle, 600);
          scheduleBlink();

          // Pause, then go alive
          setTimeout(() => enterPhase('alive'), 1500);
        }, 1200);
      });
    }

    function handleAlive() {
      trackingEnabled = true;
      input.disabled = false; sendBtn.disabled = false;
      input.placeholder = 'Speak unto the Guardian...';
      input.focus();
    }

    function handleSearching() {
      input.disabled = true; sendBtn.disabled = true;
      input.placeholder = 'The Guardian searches the archives...';
      // Intensify particles
      clearInterval(particleInterval);
      particleInterval = setInterval(spawnParticle, 200);
      // Wider, faster drift
      startDrift(2000, 4);
    }

    function handleDelivering() {
      stopDrift();
      // Calm particles back
      clearInterval(particleInterval);
      particleInterval = setInterval(spawnParticle, 600);
    }

    function handleSleeping() {
      isAsleep = true;
      trackingEnabled = false;
      if (blinkTimeout) clearTimeout(blinkTimeout);
      if (driftRAF) cancelAnimationFrame(driftRAF);
      clearInterval(particleInterval);
      particleInterval = null;

      animateEyeClose(2000);

      input.disabled = true; sendBtn.disabled = true;
      input.placeholder = 'The Guardian rests...';

      // Show return link after everything fades
      setTimeout(() => {
        const div = document.createElement('div');
        div.className = 'message return-link';
        div.innerHTML = '<a href="/">Return to the Library...</a>';
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
      }, 6000);
    }

    // ===== FORM SUBMIT =====
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (guardianPhase !== 'alive') return;
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';
      input.style.height = 'auto';
      input.disabled = true; sendBtn.disabled = true;

      // Eye reacts — brief widen
      const origRy = 14;
      eyeOutline.setAttribute('ry', 16);
      eyelidUpper.setAttribute('d', 'M34 68 Q60 44 86 68');
      eyelidLower.setAttribute('d', 'M34 68 Q60 92 86 68');
      setTimeout(() => {
        eyeOutline.setAttribute('ry', origRy);
        eyelidUpper.setAttribute('d', 'M34 68 Q60 48 86 68');
        eyelidLower.setAttribute('d', 'M34 68 Q60 88 86 68');
      }, 400);

      const thinking = addMessage('The Guardian contemplates...', 'thinking');
      startDrift(3000, 3);

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, sessionId })
        });

        thinking.remove();
        stopDrift();

        const data = await res.json();
        if (!res.ok) {
          addMessage(data.error || 'The Guardian is silent...', 'error');
        } else {
          addMessage(data.reply, 'guardian');

          if (data.tomeGenerating && data.ebookId) {
            enterPhase('searching');
            const searchMsg = addMessage('The Guardian descends into the ancient archives...', 'thinking');
            pollEbook(data.ebookId, searchMsg);
            return; // Don't re-enable input
          }
        }
      } catch {
        thinking.remove();
        stopDrift();
        addMessage('The Guardian is silent... the connection wavers.', 'error');
      }

      input.disabled = false; sendBtn.disabled = false;
      input.focus();
    });

    // ===== EBOOK POLLING =====
    async function pollEbook(ebookId, statusMsg) {
      const allMessages = [
        'Descending into the lower archives...',
        'The dust of centuries stirs...',
        'Pulling scrolls from the obsidian shelf...',
        'The ink still glows on these pages...',
        'Ancient bindings creak open...',
        'Reading by the light of a dying star...',
        'The forbidden section whispers...',
        'Deciphering the language of the first scribes...',
        'The tome resists... then yields...',
        'Pages turn of their own accord...',
        'The knowledge assembles itself...',
        'Fragments coalesce into form...',
        'The Library hums with recognition...',
        'Cross-referencing the elder codices...',
        'A chapter reveals itself from shadow...',
        'The words arrange themselves...',
        'Consulting the index of all things...',
        'The spine of the tome cracks with age...',
        'Tracing the lineage of this wisdom...',
        'The archive yields its treasure...',
        'Inscribing the gathered knowledge...',
        'Weaving threads of ancient thought...',
        'The great catalogues shift and align...',
        'Pulling truth from between the lines...',
        'The parchment drinks new ink...',
        'Binding chapters to their spine...',
        'The quill moves without a hand...',
        'Sealing the knowledge in form...',
        'The tome takes shape in the dark...',
        'Letters burn themselves into the page...',
        'The final pages write themselves...',
        'A cover forms from shadow and gold...',
        'The Library approves this work...',
        'The tome crystallizes...',
        'Almost tangible now...',
        'The weight of knowledge settles...',
        'Breathing life into dead letters...',
        'The forgotten remembers...',
        'Silence... then a revelation...',
        'The deepest shelf surrenders its secret...',
        'Echoes of a thousand scholars converge...',
        'The candlelight flickers and steadies...',
        'Unrolling a scroll that predates language...',
        'The margins hold hidden annotations...',
        'A map to the knowledge appears...',
        'The cipher resolves at last...',
        'Iron clasps release their grip...',
        'The vellum glows faintly...',
        'Tracing the veins of an ancient diagram...',
        'The index whispers a page number...',
        'Gathering dust into meaning...',
        'The great wheel of knowledge turns...',
        'Aligning the constellations of thought...',
        'The waters of the deep well reflect truth...',
        'Stone tablets dissolve into liquid prose...',
        'The guardian seal breaks cleanly...',
        'A door in the archive opens inward...',
        'The echo of the first word spoken...',
        'Translating from the tongue of the ancients...',
        'The loom of knowledge weaves faster...',
        'Gilding the edges with care...',
        'The final sigil is drawn...',
        'Pressing the seal of the Great Library...',
        'The tome hums with completeness...',
        'Knowledge condenses like morning dew...',
        'The last grain of sand falls...',
        'The chronicle nears its end...',
        'The binding holds firm...',
        'Rising from the depths with the prize...',
        'The staircase back to the light...',
        'Emerging from the archive...',
        'The tome is nearly yours...',
      ];
      // Shuffle and pick a sequence
      const messages = allMessages.sort(() => Math.random() - 0.5);
      let msgIndex = 0;
      let notFoundCount = 0;

      const interval = setInterval(async () => {
        try {
          const res = await fetch(`/api/ebook/${ebookId}/status`);
          if (res.status === 404) {
            notFoundCount++;
            if (notFoundCount > 60) { // 5 min timeout
              clearInterval(interval);
              statusMsg.remove();
              addMessage('The archives have grown silent... the tome was lost. Try again, Seeker.', 'error');
              enterPhase('alive');
            } else if (msgIndex < messages.length) {
              statusMsg.textContent = messages[msgIndex++];
            }
            return;
          }
          const data = await res.json();

          if (data.status === 'ready') {
            clearInterval(interval);
            statusMsg.remove();
            enterPhase('delivering');

            // Show download
            const div = document.createElement('div');
            div.className = 'message guardian';
            div.innerHTML = `The tome has been found — <strong>"${data.title}"</strong>. It is yours, Seeker.<br><a class="download-link" href="/api/ebook/${ebookId}/download" target="_blank">Receive the Tome</a>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;

            // Farewell then sleep
            setTimeout(async () => {
              try {
                const fRes = await fetch('/api/farewell');
                const fData = await fRes.json();
                addMessage(fData.reply, 'guardian');
              } catch {
                addMessage('The Library grows quiet... the Guardian rests.', 'guardian');
              }
              setTimeout(() => enterPhase('sleeping'), 3000);
            }, 4000);

          } else if (data.status === 'failed') {
            clearInterval(interval);
            statusMsg.remove();
            addMessage('The archives tremble... the tome could not be retrieved. Speak again, Seeker.', 'error');
            enterPhase('alive');
          } else if (msgIndex < messages.length) {
            statusMsg.textContent = messages[msgIndex++];
          }
        } catch {
          // keep polling
        }
      }, 5000);
    }

    // ===== INPUT GLOW =====
    input.addEventListener('focus', () => {
      if (guardianPhase === 'alive') {
        eyeSymbol.querySelector('svg').style.filter = 'drop-shadow(0 0 24px rgba(200, 180, 110, 0.15))';
      }
    });
    input.addEventListener('blur', () => {
      eyeSymbol.querySelector('svg').style.filter = '';
    });

    // ===== AUTO-GROW TEXTAREA =====
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      const h = Math.min(input.scrollHeight, 120);
      input.style.height = h + 'px';
      input.style.overflowY = input.scrollHeight > 120 ? 'auto' : 'hidden';
    });

    // Enter sends, Shift+Enter adds newline
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        chatForm.dispatchEvent(new Event('submit', { cancelable: true }));
      }
    });

    // ===== START: DORMANT → AWAKENING =====
    setTimeout(() => enterPhase('awakening'), 1000);
  </script>
</body>
</html>
