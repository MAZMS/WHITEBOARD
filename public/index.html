<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whiteboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f8f9fa; --fg: #1a1a2e; --dim: #8b8fa3; --muted: #c1c4d0;
      --border: #e4e6ed; --surface: #ffffff; --surface-alt: #f0f1f5;
      --accent: #4f46e5; --accent-soft: rgba(79,70,229,.08);
      --shadow-sm: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,.06), 0 2px 4px rgba(0,0,0,.04);
      --shadow-lg: 0 12px 40px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
      --shadow-xl: 0 24px 48px rgba(0,0,0,.12);
      --toolbar-bg: rgba(255,255,255,.88);
      --grid-color: #e8eaef;
      --note-yellow: #fef9c3; --note-yellow-border: #fde047;
      --note-blue: #dbeafe; --note-blue-border: #93c5fd;
      --note-green: #dcfce7; --note-green-border: #86efac;
      --note-pink: #fce7f3; --note-pink-border: #f9a8d4;
      --radius: 12px; --radius-sm: 8px; --radius-xs: 6px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --ease: cubic-bezier(.16,1,.3,1); --ease-bounce: cubic-bezier(.34,1.56,.64,1);
    }
    [data-theme="dark"] {
      --bg: #0c0c14; --fg: #e4e5ea; --dim: #6b6f82; --muted: #3a3d4e;
      --border: #1e2030; --surface: #14151f; --surface-alt: #1a1b28;
      --accent: #818cf8; --accent-soft: rgba(129,140,248,.1);
      --shadow-sm: 0 1px 3px rgba(0,0,0,.2); --shadow-md: 0 4px 12px rgba(0,0,0,.25);
      --shadow-lg: 0 12px 40px rgba(0,0,0,.35); --shadow-xl: 0 24px 48px rgba(0,0,0,.4);
      --toolbar-bg: rgba(20,21,31,.9);
      --grid-color: #252638;
      --note-yellow: #292520; --note-yellow-border: #854d0e;
      --note-blue: #172033; --note-blue-border: #1e40af;
      --note-green: #14261a; --note-green-border: #166534;
      --note-pink: #261320; --note-pink-border: #9d174d;
    }
    body {
      font-family: var(--font); background: var(--bg); color: var(--fg);
      overflow: hidden; height: 100vh; width: 100vw;
      transition: background .4s var(--ease), color .4s var(--ease);
      -webkit-font-smoothing: antialiased;
    }
    * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }
    button { font-family: var(--font); cursor: pointer; border: none; background: none; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }

    /* ── Dot Grid ── */
    #whiteboard {
      position: absolute; inset: 0; z-index: 1;
      background-image: radial-gradient(circle, var(--grid-color) 1.2px, transparent 1.2px);
      background-size: 32px 32px;
      transition: background .4s var(--ease);
    }
    #draw-canvas { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    #draw-canvas.active { pointer-events: auto; cursor: crosshair; }

    /* ── Top Bar ── */
    #topbar {
      position: fixed; top: 12px; left: 12px; right: 12px; z-index: 90;
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; background: var(--toolbar-bg);
      backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid var(--border); border-radius: 14px;
      box-shadow: var(--shadow-md); transition: all .3s var(--ease);
    }
    #topbar-left { display: flex; align-items: center; gap: 8px; }
    #topbar-right { display: flex; align-items: center; gap: 6px; }
    #board-name {
      font-size: 13px; font-weight: 600; background: none; border: none;
      color: var(--fg); padding: 6px 10px; border-radius: var(--radius-xs);
      transition: all .2s var(--ease); min-width: 100px; letter-spacing: -.2px;
    }
    #board-name:hover { background: var(--accent-soft); }
    #board-name:focus { background: var(--surface-alt); outline: 2px solid var(--accent); }
    .tb { display: flex; align-items: center; justify-content: center; gap: 5px;
      height: 32px; padding: 0 10px; border-radius: var(--radius-xs);
      color: var(--dim); font-size: 12px; font-weight: 500;
      transition: all .2s var(--ease); }
    .tb:hover { background: var(--accent-soft); color: var(--fg); }
    .tb svg { width: 15px; height: 15px; }
    .tb-icon { width: 32px; height: 32px; padding: 0; border-radius: var(--radius-xs);
      display: flex; align-items: center; justify-content: center; color: var(--dim);
      transition: all .2s var(--ease); }
    .tb-icon:hover { background: var(--accent-soft); color: var(--fg); }
    .tb-icon svg { width: 16px; height: 16px; }
    .save-ind { font-size: 11px; color: var(--dim); padding: 0 6px;
      transition: opacity .3s var(--ease); font-weight: 500; }
    .save-ind.saved { color: var(--accent); }

    /* ── Toolbar ── */
    #toolbar {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      z-index: 100; display: flex; align-items: center; gap: 2px;
      background: var(--toolbar-bg); backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid var(--border); border-radius: 16px; padding: 6px;
      box-shadow: var(--shadow-lg); transition: all .3s var(--ease);
    }
    .t-btn {
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 10px; color: var(--dim);
      font-size: 18px; transition: all .15s var(--ease); position: relative;
    }
    .t-btn:hover { background: var(--accent-soft); color: var(--fg); }
    .t-btn.active { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(79,70,229,.3); }
    [data-theme="dark"] .t-btn.active { box-shadow: 0 2px 8px rgba(129,140,248,.25); }
    .t-btn svg { width: 18px; height: 18px; }
    .t-sep { width: 1px; height: 20px; background: var(--border); margin: 0 3px; flex-shrink: 0; }
    .t-btn .tt {
      position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%);
      background: var(--fg); color: var(--bg); font-size: 11px; font-weight: 500;
      padding: 5px 10px; border-radius: var(--radius-xs); white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity .12s var(--ease);
      box-shadow: var(--shadow-md); letter-spacing: .2px;
    }
    .t-btn .tt span { font-size: 10px; opacity: .6; margin-left: 4px; }
    .t-btn:hover .tt { opacity: 1; }

    /* ── Pen Options ── */
    #pen-opts {
      position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%);
      z-index: 99; background: var(--toolbar-bg); backdrop-filter: blur(24px);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 8px 12px; display: none; gap: 6px; align-items: center;
      box-shadow: var(--shadow-lg); animation: slideUp .25s var(--ease);
    }
    #pen-opts.visible { display: flex; }
    .c-dot {
      width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; transition: all .12s var(--ease); flex-shrink: 0;
    }
    .c-dot:hover { transform: scale(1.2); }
    .c-dot.active { border-color: var(--fg); transform: scale(1.1); box-shadow: 0 0 0 2px var(--bg); }
    .sz-btn {
      width: 28px; height: 28px; border-radius: var(--radius-xs);
      border: 1px solid var(--border); color: var(--dim);
      font-size: 10px; font-weight: 700; transition: all .12s var(--ease);
      display: flex; align-items: center; justify-content: center;
    }
    .sz-btn:hover { border-color: var(--dim); color: var(--fg); }
    .sz-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── Board Elements ── */
    .b-el { position: absolute; z-index: 10; cursor: grab; user-select: none; }
    .b-el:active { cursor: grabbing; }
    .b-el.selected { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: var(--radius); }

    /* Sticky Note */
    .sticky {
      width: 220px; min-height: 140px; padding: 14px 16px;
      border-radius: var(--radius); border: 1px solid var(--note-yellow-border);
      background: var(--note-yellow); box-shadow: var(--shadow-md);
      transition: box-shadow .2s var(--ease), transform .15s var(--ease);
    }
    .sticky:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
    .sticky.blue { background: var(--note-blue); border-color: var(--note-blue-border); }
    .sticky.green { background: var(--note-green); border-color: var(--note-green-border); }
    .sticky.pink { background: var(--note-pink); border-color: var(--note-pink-border); }
    .sticky textarea {
      width: 100%; height: 100%; min-height: 100px; border: none; background: none;
      color: var(--fg); font-family: var(--font); font-size: 13px; line-height: 1.65;
      resize: none; outline: none;
    }
    .sticky textarea::placeholder { color: var(--dim); }
    .el-actions {
      position: absolute; top: -12px; right: -8px;
      display: flex; gap: 3px; opacity: 0; transition: opacity .12s var(--ease);
    }
    .b-el:hover .el-actions { opacity: 1; }
    .el-act {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--fg); color: var(--bg); display: flex;
      align-items: center; justify-content: center;
      font-size: 11px; box-shadow: var(--shadow-sm);
      transition: transform .12s var(--ease);
    }
    .el-act:hover { transform: scale(1.15); }

    /* Text */
    .txt-el { min-width: 80px; padding: 6px 10px; font-size: 18px; font-weight: 400; line-height: 1.5; }
    .txt-el [contenteditable] { outline: none; min-width: 40px; min-height: 1em; }
    .txt-el [contenteditable]:empty::before {
      content: 'Type here...'; color: var(--muted); font-style: italic;
    }

    /* Image */
    .img-el {
      border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border);
      background: var(--surface); box-shadow: var(--shadow-md);
      transition: box-shadow .2s var(--ease), transform .15s var(--ease);
    }
    .img-el:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
    .img-el img { display: block; max-width: 400px; max-height: 400px; object-fit: contain; pointer-events: none; }

    /* Shape */
    .shp-el { border: 2px solid var(--fg); background: none; transition: border-color .2s; }
    .shp-el.circle { border-radius: 50%; }

    /* ── Modals ── */
    .m-overlay {
      position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,.35);
      backdrop-filter: blur(6px); display: none; align-items: center;
      justify-content: center; animation: fadeIn .15s var(--ease);
    }
    .m-overlay.visible { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 28px; width: 90%; max-width: 480px;
      box-shadow: var(--shadow-xl); animation: modalIn .3s var(--ease-bounce);
    }
    .modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 4px; letter-spacing: -.3px; }
    .modal p { font-size: 13px; color: var(--dim); margin-bottom: 18px; line-height: 1.5; }
    .m-input {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); background: var(--bg); color: var(--fg);
      font-family: var(--font); font-size: 13px; transition: border-color .2s var(--ease);
    }
    .m-input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
    .m-input::placeholder { color: var(--muted); }
    .m-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
    .m-btn {
      padding: 9px 18px; border-radius: var(--radius-sm); font-size: 13px;
      font-weight: 500; transition: all .15s var(--ease); border: 1px solid var(--border);
      background: var(--surface); color: var(--fg);
    }
    .m-btn:hover { background: var(--surface-alt); }
    .m-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .m-btn.primary:hover { opacity: .9; }
    .m-btn:disabled { opacity: .5; cursor: not-allowed; }
    .img-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 14px; max-height: 260px; overflow-y: auto; }
    .img-grid-item {
      aspect-ratio: 4/3; border-radius: var(--radius-sm); overflow: hidden;
      border: 2px solid transparent; cursor: pointer; transition: all .15s var(--ease);
    }
    .img-grid-item:hover { border-color: var(--accent); transform: scale(1.03); }
    .img-grid-item.selected { border-color: var(--accent); }
    .img-grid-item img { width: 100%; height: 100%; object-fit: cover; }

    /* ── Boards Panel ── */
    #boards-panel {
      position: fixed; left: 0; top: 0; bottom: 0; width: 260px; z-index: 200;
      background: var(--surface); border-right: 1px solid var(--border);
      transform: translateX(-100%); transition: transform .3s var(--ease);
      display: flex; flex-direction: column; box-shadow: var(--shadow-lg);
    }
    #boards-panel.visible { transform: translateX(0); }
    .bp-header {
      padding: 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .bp-header h3 { font-size: 14px; font-weight: 700; letter-spacing: -.2px; }
    #boards-list { flex: 1; overflow-y: auto; padding: 6px; }
    .b-item {
      padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer;
      font-size: 13px; color: var(--dim); transition: all .12s var(--ease);
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px;
    }
    .b-item:hover { background: var(--accent-soft); color: var(--fg); }
    .b-item.active { background: var(--accent); color: #fff; }
    .b-item .b-date { font-size: 10px; opacity: .6; }
    #new-board-btn {
      margin: 8px; padding: 10px; border-radius: var(--radius-sm);
      border: 1px dashed var(--border); color: var(--dim);
      font-size: 13px; font-weight: 500; transition: all .15s var(--ease);
    }
    #new-board-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

    /* ── Empty State ── */
    #empty-state {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      z-index: 3; text-align: center; pointer-events: none; transition: opacity .5s var(--ease);
    }
    #empty-state.hidden { opacity: 0; }
    #empty-state h2 { font-size: 22px; font-weight: 300; color: var(--muted); margin-bottom: 8px; letter-spacing: -.3px; }
    #empty-state p { font-size: 13px; color: var(--muted); opacity: .7; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%) translateY(12px);
      z-index: 999; background: var(--fg); color: var(--bg);
      font-size: 13px; font-weight: 500; padding: 8px 18px;
      border-radius: 10px; opacity: 0; pointer-events: none;
      transition: all .25s var(--ease); box-shadow: var(--shadow-lg);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Spinner ── */
    .spinner { width: 16px; height: 16px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%; animation: spin .5s linear infinite;
      display: inline-block; vertical-align: middle; }

    /* ── Animations ── */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modalIn { 0% { opacity: 0; transform: scale(.96) translateY(6px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes elIn { 0% { opacity: 0; transform: scale(.92); } 100% { opacity: 1; transform: scale(1); } }
    .el-enter { animation: elIn .25s var(--ease-bounce); }

    @media (max-width: 640px) {
      #toolbar { bottom: 8px; padding: 4px; }
      .t-btn { width: 36px; height: 36px; }
      #topbar { top: 6px; left: 6px; right: 6px; padding: 6px 8px; }
      #boards-panel { width: 220px; }
    }
  </style>
</head>
<body>
  <!-- Top bar -->
  <div id="topbar">
    <div id="topbar-left">
      <button class="tb-icon" onclick="toggleBoardsPanel()" title="Boards">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
      <input id="board-name" value="Untitled Board" spellcheck="false" />
      <span class="save-ind" id="save-ind"></span>
    </div>
    <div id="topbar-right">
      <button class="tb" onclick="undo()" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="1,4 1,10 7,10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      </button>
      <button class="tb" onclick="redo()" title="Redo (Ctrl+Shift+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23,4 23,10 17,10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
      <button class="tb" onclick="saveBoard()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>
        Save
      </button>
      <button class="tb" onclick="clearBoard()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3,6 5,6 21,6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        Clear
      </button>
      <button class="tb-icon" onclick="toggleTheme()" title="Toggle theme" id="theme-btn">
        <svg id="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </div>

  <!-- Boards Panel -->
  <div id="boards-panel">
    <div class="bp-header">
      <h3>Boards</h3>
      <button class="tb-icon" onclick="toggleBoardsPanel()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="boards-list"></div>
    <button id="new-board-btn" onclick="createNewBoard()">+ New Board</button>
  </div>

  <!-- Whiteboard -->
  <div id="whiteboard" onmousedown="onCanvasDown(event)"></div>
  <canvas id="draw-canvas"></canvas>

  <!-- Empty State -->
  <div id="empty-state">
    <h2>Start creating</h2>
    <p>Pick a tool below, or just click to add a note</p>
  </div>

  <!-- Toolbar -->
  <div id="toolbar">
    <button class="t-btn active" data-tool="select" onclick="setTool('select')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="M13 13l6 6"/></svg>
      <span class="tt">Select <span>V</span></span>
    </button>
    <button class="t-btn" data-tool="pen" onclick="setTool('pen')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="2" x2="22" y2="6"/><path d="M7.5 20.5L19 9l-4-4L3.5 16.5 2 22z"/></svg>
      <span class="tt">Pen <span>P</span></span>
    </button>
    <button class="t-btn" data-tool="text" onclick="setTool('text')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,7 4,4 20,4 20,7"/><line x1="9.5" y1="20" x2="14.5" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
      <span class="tt">Text <span>T</span></span>
    </button>
    <button class="t-btn" data-tool="note" onclick="setTool('note')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15.5 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V8.5L15.5 3z"/><polyline points="14,3 14,9 21,9"/></svg>
      <span class="tt">Note <span>N</span></span>
    </button>
    <button class="t-btn" data-tool="shape" onclick="setTool('shape')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      <span class="tt">Shape <span>S</span></span>
    </button>
    <div class="t-sep"></div>
    <button class="t-btn" onclick="openModal('img-gen')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg>
      <span class="tt">AI Image <span>I</span></span>
    </button>
    <button class="t-btn" onclick="openModal('web-cap')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
      <span class="tt">Web Image <span>W</span></span>
    </button>
    <div class="t-sep"></div>
    <button class="t-btn" data-tool="eraser" onclick="setTool('eraser')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 20H7L3 16c-.8-.8-.8-2 0-2.8L14.8 1.4c.8-.8 2-.8 2.8 0L21 4.8c.8.8.8 2 0 2.8L12 16"/><line x1="6" y1="20" x2="20" y2="20"/></svg>
      <span class="tt">Eraser <span>E</span></span>
    </button>
  </div>

  <!-- Pen Options -->
  <div id="pen-opts">
    <div class="c-dot active" style="background:#1a1a2e" data-color="#1a1a2e" onclick="setPenColor(this)"></div>
    <div class="c-dot" style="background:#ef4444" data-color="#ef4444" onclick="setPenColor(this)"></div>
    <div class="c-dot" style="background:#3b82f6" data-color="#3b82f6" onclick="setPenColor(this)"></div>
    <div class="c-dot" style="background:#22c55e" data-color="#22c55e" onclick="setPenColor(this)"></div>
    <div class="c-dot" style="background:#f59e0b" data-color="#f59e0b" onclick="setPenColor(this)"></div>
    <div class="c-dot" style="background:#a855f7" data-color="#a855f7" onclick="setPenColor(this)"></div>
    <div class="t-sep" style="height:18px"></div>
    <button class="sz-btn active" data-size="2" onclick="setPenSize(this)">S</button>
    <button class="sz-btn" data-size="4" onclick="setPenSize(this)">M</button>
    <button class="sz-btn" data-size="8" onclick="setPenSize(this)">L</button>
  </div>

  <!-- AI Image Modal -->
  <div class="m-overlay" id="img-gen" onclick="if(event.target===this)closeModals()">
    <div class="modal">
      <h2>Generate with AI</h2>
      <p>Describe the image you'd like to create</p>
      <input class="m-input" id="img-gen-prompt" placeholder="A mountain lake reflecting the northern lights..." />
      <select class="m-input" id="img-gen-size" style="margin-top:10px;cursor:pointer">
        <option value="1024x1024">Square (1024x1024)</option>
        <option value="1792x1024">Landscape (1792x1024)</option>
        <option value="1024x1792">Portrait (1024x1792)</option>
      </select>
      <div id="img-gen-preview" style="margin-top:14px;text-align:center;display:none">
        <img id="img-gen-result" style="max-width:100%;border-radius:10px" />
      </div>
      <div class="m-actions">
        <button class="m-btn" onclick="closeModals()">Cancel</button>
        <button class="m-btn primary" id="img-gen-btn" onclick="generateImage()">Generate</button>
      </div>
    </div>
  </div>

  <!-- Web Capture Modal -->
  <div class="m-overlay" id="web-cap" onclick="if(event.target===this)closeModals()">
    <div class="modal">
      <h2>Add from Web</h2>
      <p>Paste an image URL or search for one</p>
      <input class="m-input" id="web-url" placeholder="https://example.com/photo.jpg" />
      <div style="margin-top:12px;display:flex;gap:6px">
        <input class="m-input" id="web-q" placeholder="Search images..." style="flex:1" />
        <button class="m-btn" onclick="searchImages()">Search</button>
      </div>
      <div class="img-grid" id="web-grid"></div>
      <div class="m-actions">
        <button class="m-btn" onclick="closeModals()">Cancel</button>
        <button class="m-btn primary" id="web-cap-btn" onclick="captureImage()">Add to Board</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
  // ═══════════════════════ STATE ═══════════════════════
  let tool = 'select', boardId = null, elements = [], selected = null;
  let drag = null, zIdx = 10, saveTimer = null, bpOpen = false;
  let undoStack = [], redoStack = [], penColor = '#1a1a2e', penSize = 2;
  let isDrawing = false, drawPath = [];
  const canvas = document.getElementById('draw-canvas');
  const ctx = canvas.getContext('2d');
  const wb = document.getElementById('whiteboard');

  // ═══════════════════════ THEME ═══════════════════════
  (function(){
    const s = localStorage.getItem('wb-theme');
    if(s==='dark') document.documentElement.setAttribute('data-theme','dark');
    updateThemeIcon(); setTimeout(updatePenColors,0);
  })();
  function toggleTheme(){
    const d = document.documentElement.getAttribute('data-theme')==='dark';
    if(d){ document.documentElement.removeAttribute('data-theme'); localStorage.setItem('wb-theme','light'); }
    else{ document.documentElement.setAttribute('data-theme','dark'); localStorage.setItem('wb-theme','dark'); }
    updateThemeIcon(); updatePenColors();
  }
  function updateThemeIcon(){
    const d = document.documentElement.getAttribute('data-theme')==='dark';
    document.getElementById('sun-icon').style.display = d?'none':'block';
    document.getElementById('moon-icon').style.display = d?'block':'none';
  }
  function updatePenColors(){
    const d = document.documentElement.getAttribute('data-theme')==='dark';
    const first = document.querySelector('.c-dot[data-color="#1a1a2e"]');
    if(first){
      if(d){ first.style.background='#e4e5ea'; first.dataset.color='#e4e5ea'; if(penColor==='#1a1a2e') penColor='#e4e5ea'; }
      else{ first.style.background='#1a1a2e'; first.dataset.color='#1a1a2e'; if(penColor==='#e4e5ea') penColor='#1a1a2e'; }
    }
  }

  // ═══════════════════════ CANVAS ═══════════════════════
  function resizeCanvas(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; redraw(); }
  window.addEventListener('resize', resizeCanvas); resizeCanvas();

  // ═══════════════════════ TOOLS ═══════════════════════
  function setTool(t){
    tool=t;
    document.querySelectorAll('.t-btn[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));
    canvas.classList.toggle('active', t==='pen'||t==='eraser');
    document.getElementById('pen-opts').classList.toggle('visible', t==='pen');
    if(selected) deselect();
  }

  document.addEventListener('keydown', e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable) return;
    const k=e.key.toLowerCase();
    if(k==='v') setTool('select');
    else if(k==='p') setTool('pen');
    else if(k==='t') setTool('text');
    else if(k==='n') setTool('note');
    else if(k==='s'&&!e.ctrlKey) setTool('shape');
    else if(k==='e') setTool('eraser');
    else if(k==='i') openModal('img-gen');
    else if(k==='w') openModal('web-cap');
    else if(k==='escape'){ closeModals(); deselect(); }
    else if(k==='delete'||k==='backspace'){ if(selected) deleteEl(selected); }
    if(e.ctrlKey&&k==='z'&&!e.shiftKey){ e.preventDefault(); undo(); }
    if(e.ctrlKey&&k==='z'&&e.shiftKey){ e.preventDefault(); redo(); }
    if(e.ctrlKey&&k==='s'){ e.preventDefault(); saveBoard(); }
  });

  // ═══════════════════════ PEN (smooth curves) ═══════════════════════
  function setPenColor(el){ document.querySelectorAll('.c-dot').forEach(d=>d.classList.remove('active')); el.classList.add('active'); penColor=el.dataset.color; }
  function setPenSize(el){ document.querySelectorAll('.sz-btn').forEach(b=>b.classList.remove('active')); el.classList.add('active'); penSize=+el.dataset.size; }

  canvas.addEventListener('mousedown', e=>{
    if(tool==='pen'){ isDrawing=true; drawPath=[{x:e.clientX,y:e.clientY}]; ctx.beginPath(); ctx.moveTo(e.clientX,e.clientY); ctx.strokeStyle=penColor; ctx.lineWidth=penSize; ctx.lineCap='round'; ctx.lineJoin='round'; }
    else if(tool==='eraser'){ isDrawing=true; eraseAt(e.clientX,e.clientY); }
  });

  canvas.addEventListener('mousemove', e=>{
    if(!isDrawing) return;
    if(tool==='pen'){
      drawPath.push({x:e.clientX,y:e.clientY});
      // Smooth quadratic curve to midpoint
      if(drawPath.length>2){
        const l=drawPath.length, p0=drawPath[l-3], p1=drawPath[l-2], p2=drawPath[l-1];
        const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
        ctx.quadraticCurveTo(p1.x,p1.y,mx,my);
        ctx.stroke();
      } else { ctx.lineTo(e.clientX,e.clientY); ctx.stroke(); }
    } else if(tool==='eraser') eraseAt(e.clientX,e.clientY);
  });

  canvas.addEventListener('mouseup', ()=>{
    if(isDrawing&&tool==='pen'&&drawPath.length>1){
      pushUndo();
      elements.push({ id:genId(), type:'drawing', x:0, y:0, data:{path:drawPath,color:penColor,size:penSize}, z_index:zIdx++ });
      schedSave(); updateEmpty();
    }
    isDrawing=false; drawPath=[];
  });

  function eraseAt(x,y){
    const r=20; ctx.clearRect(x-r,y-r,r*2,r*2);
    const before=elements.length;
    elements=elements.filter(el=>{
      if(el.type!=='drawing') return true;
      return !el.data.path.some(p=>Math.hypot(p.x-x,p.y-y)<r);
    });
    if(elements.length!==before){ redraw(); schedSave(); }
  }

  function redraw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    elements.filter(el=>el.type==='drawing').forEach(el=>{
      const p=el.data.path; if(p.length<2) return;
      ctx.beginPath(); ctx.moveTo(p[0].x,p[0].y);
      // Smooth quadratic curves through midpoints
      for(let i=1;i<p.length-1;i++){
        const mx=(p[i].x+p[i+1].x)/2, my=(p[i].y+p[i+1].y)/2;
        ctx.quadraticCurveTo(p[i].x,p[i].y,mx,my);
      }
      if(p.length>1) ctx.lineTo(p[p.length-1].x,p[p.length-1].y);
      ctx.strokeStyle=el.data.color||'#1a1a2e'; ctx.lineWidth=el.data.size||2;
      ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke();
    });
  }

  // ═══════════════════════ UNDO / REDO ═══════════════════════
  function pushUndo(){ undoStack.push(JSON.parse(JSON.stringify(elements))); if(undoStack.length>30) undoStack.shift(); redoStack=[]; }
  function undo(){ if(!undoStack.length) return; redoStack.push(JSON.parse(JSON.stringify(elements))); elements=undoStack.pop(); renderAll(); schedSave(); }
  function redo(){ if(!redoStack.length) return; undoStack.push(JSON.parse(JSON.stringify(elements))); elements=redoStack.pop(); renderAll(); schedSave(); }

  // ═══════════════════════ ELEMENTS ═══════════════════════
  function genId(){ return 'el-'+Date.now()+'-'+Math.random().toString(36).slice(2,6); }
  const noteColors = ['','blue','green','pink'];
  let noteColorIdx = 0;

  function onCanvasDown(e){
    if(tool==='pen'||tool==='eraser') return;
    if(e.target!==wb) return;
    const x=e.clientX, y=e.clientY-50;
    pushUndo();
    if(tool==='text'){ addText(x,y); setTool('select'); }
    else if(tool==='note'){ addNote(x,y); setTool('select'); }
    else if(tool==='shape'){ addShape(x,y); setTool('select'); }
    else if(tool==='select') deselect();
  }

  function addText(x,y){
    const el={id:genId(),type:'text',x,y,data:{text:''},z_index:zIdx++};
    elements.push(el); renderEl(el); schedSave(); updateEmpty();
    setTimeout(()=>{ const d=document.getElementById(el.id); if(d){ const e=d.querySelector('[contenteditable]'); if(e) e.focus(); }},50);
  }

  function addNote(x,y){
    const color = noteColors[noteColorIdx % noteColors.length]; noteColorIdx++;
    const el={id:genId(),type:'note',x,y,width:220,height:140,data:{text:'',color},z_index:zIdx++};
    elements.push(el); renderEl(el); schedSave(); updateEmpty();
  }

  function addShape(x,y){
    const el={id:genId(),type:'shape',x,y,width:120,height:120,data:{shape:'rect'},z_index:zIdx++};
    elements.push(el); renderEl(el); schedSave(); updateEmpty();
  }

  function addImage(src,x,y){
    pushUndo();
    const el={id:genId(),type:'image',x:x||200,y:y||200,data:{src},z_index:zIdx++};
    elements.push(el); renderEl(el); schedSave(); updateEmpty();
  }

  // ═══════════════════════ RENDERING ═══════════════════════
  function renderEl(el){
    const old=document.getElementById(el.id); if(old) old.remove();
    const d=document.createElement('div');
    d.id=el.id; d.className='b-el el-enter'; d.style.left=el.x+'px'; d.style.top=el.y+'px'; d.style.zIndex=el.z_index||10;

    if(el.type==='text'){
      d.classList.add('txt-el');
      d.innerHTML=`<div class="el-actions"><button class="el-act" onclick="deleteEl('${el.id}')">&times;</button></div><div contenteditable="true">${el.data.text||''}</div>`;
      const ed=d.querySelector('[contenteditable]');
      ed.addEventListener('input',()=>{ const f=elements.find(e=>e.id===el.id); if(f) f.data.text=ed.innerHTML; schedSave(); });
      ed.addEventListener('mousedown',e=>e.stopPropagation());
    }
    else if(el.type==='note'){
      d.classList.add('sticky'); if(el.data.color) d.classList.add(el.data.color);
      if(el.width) d.style.width=el.width+'px';
      d.innerHTML=`<div class="el-actions"><button class="el-act" onclick="cycleNoteColor('${el.id}')">&#9632;</button><button class="el-act" onclick="deleteEl('${el.id}')">&times;</button></div><textarea placeholder="Write something...">${el.data.text||''}</textarea>`;
      const ta=d.querySelector('textarea');
      ta.addEventListener('input',()=>{ const f=elements.find(e=>e.id===el.id); if(f) f.data.text=ta.value; schedSave(); });
      ta.addEventListener('mousedown',e=>e.stopPropagation());
    }
    else if(el.type==='image'){
      d.classList.add('img-el');
      d.innerHTML=`<div class="el-actions"><button class="el-act" onclick="deleteEl('${el.id}')">&times;</button></div><img src="${el.data.src}" alt="" />`;
    }
    else if(el.type==='shape'){
      d.classList.add('shp-el'); if(el.data.shape==='circle') d.classList.add('circle');
      d.style.width=(el.width||120)+'px'; d.style.height=(el.height||120)+'px';
      d.innerHTML=`<div class="el-actions"><button class="el-act" onclick="toggleShape('${el.id}')">&cir;</button><button class="el-act" onclick="deleteEl('${el.id}')">&times;</button></div>`;
    }

    d.addEventListener('mousedown',e=>{
      if(e.target.tagName==='BUTTON'||e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'||e.target.isContentEditable) return;
      if(tool!=='select') return;
      select(el.id); drag={id:el.id,sx:e.clientX,sy:e.clientY,ox:el.x,oy:el.y}; d.style.zIndex=++zIdx; e.preventDefault();
    });
    wb.appendChild(d);
  }

  function renderAll(){
    wb.querySelectorAll('.b-el').forEach(e=>e.remove());
    elements.filter(e=>e.type!=='drawing').forEach(renderEl);
    redraw(); updateEmpty();
  }

  // Drag
  document.addEventListener('mousemove',e=>{
    if(!drag) return;
    const el=elements.find(x=>x.id===drag.id); if(!el) return;
    el.x=drag.ox+(e.clientX-drag.sx); el.y=drag.oy+(e.clientY-drag.sy);
    const dom=document.getElementById(el.id);
    if(dom){ dom.style.left=el.x+'px'; dom.style.top=el.y+'px'; }
  });
  document.addEventListener('mouseup',()=>{ if(drag){ schedSave(); drag=null; }});

  // Select
  function select(id){ deselect(); selected=id; const d=document.getElementById(id); if(d) d.classList.add('selected'); }
  function deselect(){ if(selected){ const d=document.getElementById(selected); if(d) d.classList.remove('selected'); } selected=null; }

  function deleteEl(id){
    pushUndo();
    elements=elements.filter(e=>e.id!==id);
    const d=document.getElementById(id);
    if(d){ d.style.transition='opacity .15s,transform .15s'; d.style.opacity='0'; d.style.transform='scale(.9)'; setTimeout(()=>d.remove(),150); }
    if(selected===id) selected=null;
    schedSave(); redraw(); updateEmpty();
  }

  function toggleShape(id){ const el=elements.find(e=>e.id===id); if(!el) return; el.data.shape=el.data.shape==='rect'?'circle':'rect'; renderEl(el); schedSave(); }
  function cycleNoteColor(id){
    const el=elements.find(e=>e.id===id); if(!el) return;
    const colors=['','blue','green','pink'];
    const i=colors.indexOf(el.data.color||'');
    el.data.color=colors[(i+1)%colors.length];
    renderEl(el); schedSave();
  }

  function updateEmpty(){
    const has=elements.length>0;
    document.getElementById('empty-state').classList.toggle('hidden',has);
  }

  // ═══════════════════════ PERSISTENCE ═══════════════════════
  function schedSave(){ clearTimeout(saveTimer); si('Unsaved...'); saveTimer=setTimeout(autoSave,2000); }
  function si(t,saved){ const el=document.getElementById('save-ind'); el.textContent=t; el.classList.toggle('saved',!!saved); }

  async function autoSave(){
    if(!boardId){
      try{ const r=await fetch('/api/boards',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('board-name').value})}); boardId=(await r.json()).id; }
      catch(e){ return; }
    }
    await saveBoard();
  }

  async function saveBoard(){
    if(!boardId){
      try{ const r=await fetch('/api/boards',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('board-name').value})}); boardId=(await r.json()).id; }
      catch(e){ toast('Save failed'); return; }
    }
    try{
      await fetch(`/api/boards/${boardId}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('board-name').value})});
      await fetch(`/api/boards/${boardId}/elements`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({elements})});
      si('Saved',true); setTimeout(()=>{ const el=document.getElementById('save-ind'); if(el.textContent==='Saved') si(''); },2500);
    } catch(e){ toast('Save failed'); }
  }

  async function loadBoard(id){
    try{
      const r=await fetch(`/api/boards/${id}`); const b=await r.json();
      boardId=b.id; document.getElementById('board-name').value=b.name;
      elements=(b.elements||[]).map(e=>({...e,data:typeof e.data==='string'?JSON.parse(e.data):e.data}));
      zIdx=Math.max(10,...elements.map(e=>e.z_index||0))+1;
      undoStack=[]; redoStack=[]; renderAll(); toast('Board loaded');
    } catch(e){ toast('Failed to load'); }
  }

  async function loadBoardsList(){
    try{
      const r=await fetch('/api/boards'); const boards=await r.json();
      const list=document.getElementById('boards-list');
      if(!boards.length){ list.innerHTML='<div style="padding:24px;text-align:center;color:var(--dim);font-size:13px">No boards yet</div>'; return; }
      list.innerHTML=boards.map(b=>`<div class="b-item ${b.id===boardId?'active':''}" onclick="loadBoard('${b.id}');toggleBoardsPanel()"><span>${b.name}</span><span class="b-date">${new Date(b.updated_at).toLocaleDateString()}</span></div>`).join('');
    } catch(e){}
  }

  function createNewBoard(){ boardId=null; elements=[]; undoStack=[]; redoStack=[]; document.getElementById('board-name').value='Untitled Board'; renderAll(); toggleBoardsPanel(); toast('New board'); }
  function clearBoard(){ pushUndo(); elements=[]; selected=null; renderAll(); schedSave(); toast('Cleared'); }
  function toggleBoardsPanel(){ bpOpen=!bpOpen; document.getElementById('boards-panel').classList.toggle('visible',bpOpen); if(bpOpen) loadBoardsList(); }

  // ═══════════════════════ AI IMAGE ═══════════════════════
  async function generateImage(){
    const prompt=document.getElementById('img-gen-prompt').value.trim(); if(!prompt) return;
    const btn=document.getElementById('img-gen-btn');
    btn.innerHTML='<span class="spinner"></span> Generating...'; btn.disabled=true;
    try{
      const r=await fetch('/api/ai/generate-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,size:document.getElementById('img-gen-size').value,boardId})});
      const d=await r.json(); if(d.error){ toast(d.error); return; }
      document.getElementById('img-gen-preview').style.display='block';
      document.getElementById('img-gen-result').src=d.url;
      addImage(d.url,window.innerWidth/2-200,window.innerHeight/2-150);
      toast('Image generated'); setTimeout(closeModals,1200);
    } catch(e){ toast('Failed: '+e.message); }
    finally{ btn.innerHTML='Generate'; btn.disabled=false; }
  }
  document.getElementById('img-gen-prompt').addEventListener('keydown',e=>{ if(e.key==='Enter') generateImage(); });

  // ═══════════════════════ WEB CAPTURE ═══════════════════════
  let selWebImg=null;
  async function captureImage(){
    const url=document.getElementById('web-url').value.trim()||selWebImg; if(!url){ toast('Enter a URL'); return; }
    const btn=document.getElementById('web-cap-btn');
    btn.innerHTML='<span class="spinner"></span> Loading...'; btn.disabled=true;
    try{
      const r=await fetch('/api/ai/capture-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,boardId})});
      const d=await r.json(); if(d.error){ toast(d.error); return; }
      addImage(d.dataUrl,window.innerWidth/2-200,window.innerHeight/2-150);
      toast('Image added'); setTimeout(closeModals,800);
    } catch(e){ toast('Failed: '+e.message); }
    finally{ btn.innerHTML='Add to Board'; btn.disabled=false; }
  }
  async function searchImages(){
    const q=document.getElementById('web-q').value.trim(); if(!q) return;
    const g=document.getElementById('web-grid');
    g.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:20px"><span class="spinner"></span></div>';
    try{
      const r=await fetch('/api/ai/search-images',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});
      const d=await r.json();
      g.innerHTML=d.images.map(i=>`<div class="img-grid-item" onclick="selSearchImg(this,'${i.url}')"><img src="${i.thumb}" alt="${i.alt}" loading="lazy"/></div>`).join('');
    } catch(e){ g.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:16px;color:var(--dim)">Search failed</div>'; }
  }
  function selSearchImg(el,url){ document.querySelectorAll('.img-grid-item').forEach(i=>i.classList.remove('selected')); el.classList.add('selected'); selWebImg=url; document.getElementById('web-url').value=url; }
  document.getElementById('web-url').addEventListener('keydown',e=>{ if(e.key==='Enter') captureImage(); });
  document.getElementById('web-q').addEventListener('keydown',e=>{ if(e.key==='Enter') searchImages(); });

  // ═══════════════════════ MODALS & TOAST ═══════════════════════
  function openModal(id){ document.getElementById(id).classList.add('visible'); const inp=document.getElementById(id).querySelector('input'); if(inp) inp.focus(); }
  function closeModals(){ document.querySelectorAll('.m-overlay').forEach(m=>m.classList.remove('visible')); }
  let toastT; function toast(m){ const t=document.getElementById('toast'); clearTimeout(toastT); t.classList.remove('show'); void t.offsetWidth; t.textContent=m; t.classList.add('show'); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

  // ═══════════════════════ INIT ═══════════════════════
  (async function(){
    try{ const r=await fetch('/api/boards'); const b=await r.json(); if(b.length>0) await loadBoard(b[0].id); else updateEmpty(); }
    catch(e){ updateEmpty(); }
  })();
  </script>
</body>
</html>
