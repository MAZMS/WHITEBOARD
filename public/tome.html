<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tome | Great Library AI</title>
  <meta name="description" content="Read an AI-generated tome from the Great Library.">
  <link rel="icon" type="image/jpeg" href="/favicon.jpg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --bg-card: #111110;
      --bg-hover: #1a1917;
      --bg-surface: #161614;
      --gold: #c8b88a;
      --gold-dim: #8a7d5a;
      --gold-bright: #e0d4a8;
      --accent: #3a3528;
      --accent-hover: #4a4030;
      --accent-bright: #5a5038;
      --text-muted: #6a6050;
      --border: #2a2520;
      --border-light: #332e26;
      --font: Georgia, 'Times New Roman', serif;
      --glow-gold: rgba(200, 184, 138, 0.08);
      --glow-gold-hover: rgba(200, 184, 138, 0.15);
    }

    html, body {
      background: var(--bg);
      color: var(--gold);
      font-family: var(--font);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Light mode */
    body.light-mode {
      --bg: #F0EBE0;
      --bg-card: #E8E2D4;
      --bg-hover: #DDD7C8;
      --bg-surface: #EAE4D6;
      --gold: #3a3020;
      --gold-dim: #6a5d40;
      --gold-bright: #2a2010;
      --accent: #D8D0C0;
      --accent-hover: #CCC4B0;
      --accent-bright: #B8B098;
      --text-muted: #8a8070;
      --border: #C8C0B0;
      --border-light: #D0C8B8;
      --glow-gold: rgba(60, 50, 20, 0.06);
      --glow-gold-hover: rgba(60, 50, 20, 0.12);
    }

    ::-webkit-scrollbar { width: 0; height: 0; }
    * { scrollbar-width: none; }

    /* --- Header --- */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(10, 10, 10, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    body.light-mode .header {
      background: rgba(240, 235, 224, 0.94);
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .header-logo {
      font-size: 18px; color: var(--gold); text-decoration: none;
      letter-spacing: 1px; transition: color 0.3s;
    }
    .header-logo:hover { color: var(--gold-bright); }
    .header-logo span { opacity: 0.4; }
    .back-link {
      color: var(--gold-dim); text-decoration: none; font-size: 14px;
      padding: 8px 14px; border-radius: 6px; transition: all 0.2s;
    }
    .back-link:hover { color: var(--gold); background: var(--accent); }

    /* ================ DETAIL VIEW ================ */
    .detail-view {
      padding-top: 88px;
      max-width: 1200px;
      margin: 0 auto;
      padding-left: 32px;
      padding-right: 32px;
      padding-bottom: 80px;
    }

    /* --- Cover Hero (YouTube player area) --- */
    .cover-hero {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
    }

    .cover-hero-inner {
      display: flex;
      align-items: stretch;
      min-height: 340px;
    }

    .cover-image-wrap {
      flex: 0 0 260px;
      position: relative;
      overflow: hidden;
    }
    .cover-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cover-image-wrap .placeholder-cover {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 24px;
      text-align: center;
    }
    .placeholder-cover .placeholder-title {
      font-size: 20px;
      color: var(--gold);
      line-height: 1.3;
    }
    .placeholder-cover .placeholder-ornament {
      margin-top: 16px;
      font-size: 28px;
      opacity: 0.2;
      color: var(--gold-dim);
    }

    .cover-info {
      flex: 1;
      padding: 32px 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .cover-title {
      font-size: 30px;
      color: var(--gold-bright);
      line-height: 1.25;
      margin-bottom: 8px;
    }
    .cover-subtitle {
      font-size: 17px;
      color: var(--gold-dim);
      font-style: italic;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .cover-author-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }
    .author-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--gold-dim);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .author-info { line-height: 1.3; }
    .author-name {
      font-size: 15px;
      color: var(--gold);
    }
    .author-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .cover-date {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
      margin-top: 4px;
    }

    .cover-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .cover-tag {
      font-size: 12px;
      color: var(--gold-dim);
      background: var(--accent);
      padding: 5px 14px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .cover-tag:hover {
      background: var(--accent-hover);
      color: var(--gold);
    }

    .cover-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .action-btn {
      background: var(--accent);
      border: 1px solid var(--border);
      color: var(--gold-dim);
      font-family: var(--font);
      font-size: 14px;
      padding: 11px 22px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
    }
    .action-btn:hover {
      background: var(--accent-hover);
      color: var(--gold);
      border-color: var(--accent-bright);
    }
    .action-btn.primary {
      background: var(--accent-hover);
      border-color: var(--accent-bright);
      color: var(--gold);
    }
    .action-btn.primary:hover {
      background: var(--accent-bright);
      color: var(--gold-bright);
    }

    /* --- Engagement Bar (like YouTube) --- */
    .engagement-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 0;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .engage-group {
      display: flex;
      align-items: center;
      background: var(--accent);
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .engage-btn {
      background: none;
      border: none;
      color: var(--gold-dim);
      font-family: var(--font);
      font-size: 14px;
      cursor: pointer;
      padding: 9px 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .engage-btn:hover { color: var(--gold); background: var(--accent-hover); }
    .engage-btn.active { color: var(--gold-bright); }

    .engage-divider {
      width: 1px;
      height: 22px;
      background: var(--border);
    }

    .engage-pill {
      background: var(--accent);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 9px 16px;
      color: var(--gold-dim);
      font-family: var(--font);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .engage-pill:hover { color: var(--gold); background: var(--accent-hover); }
    .engage-pill.active { color: var(--gold-bright); border-color: var(--gold-dim); }

    .engage-spacer { flex: 1; }

    .engage-stats {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
    }

    /* --- Two-column layout: content + sidebar --- */
    .detail-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 32px;
    }

    .detail-main { min-width: 0; }
    .detail-sidebar { min-width: 0; }

    /* --- Chapters list (like YouTube playlist) --- */
    .chapters-section {
      margin-bottom: 36px;
    }
    .sec-title {
      font-size: 18px;
      color: var(--gold);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sec-title .count {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: normal;
    }

    .chapter-list {
      list-style: none;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .chapter-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chapter-item:not(:last-child) {
      border-bottom: 1px solid rgba(42, 37, 32, 0.4);
    }
    .chapter-item:hover {
      background: var(--accent);
    }
    .chapter-num {
      font-size: 13px;
      color: var(--accent-bright);
      font-weight: normal;
      min-width: 28px;
      text-align: center;
    }
    .chapter-name {
      font-size: 15px;
      color: var(--gold-dim);
      transition: color 0.2s;
      flex: 1;
    }
    .chapter-item:hover .chapter-name { color: var(--gold); }
    .chapter-play {
      font-size: 12px;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .chapter-item:hover .chapter-play { opacity: 1; }

    /* --- Comments --- */
    .comments-section {
      margin-bottom: 36px;
    }

    .comment-form {
      margin-bottom: 20px;
    }
    .comment-form-inner {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .comment-form-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--gold-dim);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .comment-form-body { flex: 1; }
    .comment-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--gold);
      font-family: var(--font);
      font-size: 16px;
      padding: 8px 0;
      resize: none;
      min-height: 36px;
      outline: none;
      transition: border-color 0.3s;
    }
    .comment-input::placeholder { color: var(--text-muted); }
    .comment-input:focus { border-color: var(--gold-dim); }
    .comment-submit-row {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
      display: none;
    }
    .comment-input:focus ~ .comment-submit-row,
    .comment-submit-row.visible { display: flex; }
    .comment-cancel-btn {
      background: none;
      border: none;
      color: var(--gold-dim);
      font-family: var(--font);
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .comment-cancel-btn:hover { background: var(--accent); }
    .comment-submit-btn {
      background: var(--accent-hover);
      border: 1px solid var(--accent-bright);
      color: var(--gold);
      font-family: var(--font);
      font-size: 13px;
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .comment-submit-btn:hover { background: var(--accent-bright); color: var(--gold-bright); }
    .comment-submit-btn:disabled { opacity: 0.4; cursor: default; }

    .comment-signin-msg {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      padding: 16px;
    }
    .comment-signin-msg a { color: var(--gold-dim); text-decoration: none; }
    .comment-signin-msg a:hover { color: var(--gold); }

    .comment-item {
      padding: 14px 0;
    }
    .comment-item:not(:last-child) {
      border-bottom: 1px solid rgba(42, 37, 32, 0.3);
    }
    .comment-top {
      display: flex;
      gap: 12px;
    }
    .comment-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--gold-dim);
      overflow: hidden;
      flex-shrink: 0;
    }
    .comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .comment-content { flex: 1; min-width: 0; }
    .comment-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .comment-name {
      font-size: 13px;
      color: var(--gold-dim);
    }
    .comment-time {
      font-size: 11px;
      color: var(--text-muted);
    }
    .comment-text {
      font-size: 14px;
      color: var(--gold);
      line-height: 1.5;
      margin-bottom: 6px;
    }
    .comment-actions {
      display: flex;
      gap: 12px;
    }
    .comment-action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      padding: 4px 2px;
      font-family: var(--font);
      transition: color 0.2s;
    }
    .comment-action-btn:hover { color: var(--gold-dim); }

    .comment-replies {
      margin-left: 44px;
      border-left: 2px solid var(--border);
      padding-left: 16px;
      margin-top: 4px;
    }

    .no-comments {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      padding: 28px;
      font-style: italic;
    }

    /* --- Sidebar: Related tomes --- */
    .sidebar-section {
      margin-bottom: 28px;
    }
    .sidebar-title {
      font-size: 14px;
      color: var(--gold);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 11px;
    }

    .related-card {
      display: flex;
      gap: 10px;
      padding: 8px 0;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 8px;
    }
    .related-card:hover {
      background: var(--accent);
      padding-left: 8px;
      padding-right: 8px;
    }
    .related-cover {
      width: 100px;
      aspect-ratio: 3 / 4;
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .related-cover img { width: 100%; height: 100%; object-fit: cover; }
    .related-cover .placeholder-sm {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      font-size: 11px;
      color: var(--gold-dim);
      text-align: center;
      padding: 6px;
      line-height: 1.2;
    }
    .related-info {
      flex: 1;
      min-width: 0;
      padding-top: 4px;
    }
    .related-title {
      font-size: 13px;
      color: var(--gold);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
      line-height: 1.35;
    }
    .related-author {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .related-stats {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* --- Stats bar in sidebar --- */
    .stats-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 13px;
    }
    .stat-row:not(:last-child) {
      border-bottom: 1px solid rgba(42, 37, 32, 0.4);
    }
    .stat-label { color: var(--text-muted); }
    .stat-value { color: var(--gold); }

    /* ================ READING VIEW ================ */
    .reading-view {
      display: none;
      padding-top: 88px;
      max-width: 720px;
      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
      padding-bottom: 80px;
    }

    .reading-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .reading-back {
      color: var(--gold-dim);
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      transition: color 0.2s;
      padding: 6px 0;
    }
    .reading-back:hover { color: var(--gold); }

    .reading-progress {
      position: fixed;
      top: 64px;
      left: 0;
      height: 2px;
      background: var(--gold-dim);
      transition: width 0.3s ease;
      z-index: 101;
    }

    .reading-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .font-btn {
      background: var(--accent);
      border: 1px solid var(--border);
      color: var(--gold-dim);
      width: 34px;
      height: 34px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-family: var(--font);
    }
    .font-btn:hover { color: var(--gold); background: var(--accent-hover); }

    .reading-chapter-num {
      font-size: 12px;
      color: var(--accent-bright);
      text-transform: uppercase;
      letter-spacing: 4px;
      text-align: center;
      margin-bottom: 14px;
    }

    .reading-chapter-title {
      font-size: 30px;
      color: var(--gold-bright);
      text-align: center;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .reading-divider {
      text-align: center;
      color: var(--accent-bright);
      font-size: 16px;
      margin-bottom: 36px;
    }

    .reading-body {
      font-size: 17px;
      color: var(--gold);
      line-height: 1.85;
    }
    .reading-body p {
      margin-bottom: 1.3em;
      text-indent: 1.5em;
    }
    .reading-body p:first-child { text-indent: 0; }

    .reading-end-mark {
      text-align: center;
      color: var(--accent-bright);
      font-size: 16px;
      margin-top: 52px;
      margin-bottom: 52px;
    }

    .reading-pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }
    .reading-page-btn {
      background: var(--accent);
      border: 1px solid var(--border);
      color: var(--gold-dim);
      font-family: var(--font);
      font-size: 14px;
      padding: 11px 22px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .reading-page-btn:hover { background: var(--accent-hover); color: var(--gold); border-color: var(--accent-bright); }
    .reading-page-btn:disabled { opacity: 0.3; cursor: default; }
    .reading-page-btn:disabled:hover { background: var(--accent); color: var(--gold-dim); }

    /* --- TOC Sidebar (reading mode) --- */
    .toc-sidebar {
      position: fixed;
      left: 0;
      top: 64px;
      bottom: 0;
      width: 300px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      z-index: 99;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      padding: 24px 0;
      overflow-y: auto;
    }
    .toc-sidebar.open { transform: translateX(0); }
    .toc-sidebar-title {
      padding: 0 20px 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 11px;
      color: var(--gold-dim);
    }
    .toc-sidebar-item {
      display: block;
      padding: 10px 20px;
      font-size: 14px;
      color: var(--gold-dim);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toc-sidebar-item:hover { background: var(--accent); color: var(--gold); }
    .toc-sidebar-item.active { color: var(--gold-bright); background: var(--accent); }
    .toc-overlay {
      display: none;
      position: fixed;
      top: 64px; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 98;
    }
    .toc-overlay.open { display: block; }

    /* --- Share modal --- */
    .share-modal-bg {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .share-modal-bg.open { display: flex; }
    .share-modal {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      width: 400px;
      max-width: 90vw;
    }
    .share-modal h3 {
      font-size: 18px;
      color: var(--gold);
      margin-bottom: 18px;
      font-weight: normal;
    }
    .share-link-row {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .share-link-input {
      flex: 1;
      background: var(--accent);
      border: 1px solid var(--border);
      color: var(--gold);
      font-family: var(--font);
      font-size: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      outline: none;
    }
    .share-copy-btn {
      background: var(--accent-hover);
      border: 1px solid var(--accent-bright);
      color: var(--gold);
      font-family: var(--font);
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .share-copy-btn:hover { background: var(--accent-bright); }
    .share-options {
      display: flex;
      gap: 10px;
    }
    .share-option {
      flex: 1;
      background: var(--accent);
      border: 1px solid var(--border);
      color: var(--gold-dim);
      font-family: var(--font);
      font-size: 13px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .share-option:hover { background: var(--accent-hover); color: var(--gold); }

    /* --- Loading --- */
    .loading-state {
      text-align: center;
      padding: 140px 20px;
      color: var(--text-muted);
      font-style: italic;
      font-size: 16px;
    }

    /* --- Responsive --- */
    @media (max-width: 1024px) {
      .detail-layout {
        grid-template-columns: 1fr;
      }
      .detail-sidebar { order: 2; }
    }

    @media (max-width: 768px) {
      .header { padding: 0 16px; height: 56px; }
      .detail-view {
        padding-top: 76px;
        padding-left: 16px;
        padding-right: 16px;
        padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px));
      }
      .reading-view {
        padding-top: 76px;
        padding-left: 16px;
        padding-right: 16px;
        padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
      }
      .cover-hero-inner {
        flex-direction: column;
        min-height: auto;
      }
      .cover-image-wrap {
        flex: none;
        width: 100%;
        max-height: 280px;
      }
      .cover-info { padding: 20px; }
      .cover-title { font-size: 24px; }
      .cover-subtitle { font-size: 15px; }
      .action-btn { min-height: 44px; padding: 10px 18px; }
      .engage-btn { min-height: 44px; padding: 10px 14px; }
      .engage-pill { min-height: 44px; }
      .reading-chapter-title { font-size: 24px; }
      .reading-body { font-size: 16px; }
      .font-btn { width: 44px; height: 44px; }
      .reading-page-btn { min-height: 44px; }
      .toc-sidebar { width: 260px; }
      .related-cover { width: 80px; }
      .share-modal { padding: 20px; }
      .share-copy-btn { min-height: 44px; }
      .share-option { min-height: 44px; }
      .comment-submit-btn { min-height: 44px; }
    }

    @media (max-width: 480px) {
      .cover-image-wrap { max-height: 220px; }
      .cover-title { font-size: 20px; }
      .cover-info { padding: 16px; }
      .back-link { min-height: 44px; display: inline-flex; align-items: center; }
      .reading-body { font-size: 15px; line-height: 1.7; }
      .toc-sidebar { width: 100%; }
      .related-cover { width: 70px; }
    }

    /* --- Reduced motion --- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Fade in */
    .fade-in {
      opacity: 0;
      transform: translateY(10px);
      animation: fadeInUp 0.45s ease forwards;
    }
    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Placeholder gradients */
    .cover-grad-0 { background: linear-gradient(145deg, #1c1916, #2a2318, #1a1510); }
    .cover-grad-1 { background: linear-gradient(145deg, #1a1520, #28202a, #151018); }
    .cover-grad-2 { background: linear-gradient(145deg, #101820, #182830, #0c1418); }
    .cover-grad-3 { background: linear-gradient(145deg, #1a1810, #2a2818, #181610); }
    .cover-grad-4 { background: linear-gradient(145deg, #1c1012, #2a1820, #180c10); }
    .cover-grad-5 { background: linear-gradient(145deg, #121a18, #1a2a28, #0e1816); }
    .cover-grad-6 { background: linear-gradient(145deg, #181418, #281c28, #161016); }
    .cover-grad-7 { background: linear-gradient(145deg, #1a1a10, #2a2a18, #18180e); }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <a href="/" class="header-logo">Great Library <span>AI</span></a>
      <a href="/tomes" class="back-link">&#8592; Browse</a>
    </div>
  </header>

  <!-- Loading -->
  <div class="loading-state" id="loadingState">The tome materializes...</div>

  <!-- Detail View -->
  <div class="detail-view" id="detailView" style="display: none;">
    <!-- Cover Hero -->
    <div class="cover-hero fade-in" id="coverHero">
      <div class="cover-hero-inner">
        <div class="cover-image-wrap" id="coverImageWrap"></div>
        <div class="cover-info">
          <h1 class="cover-title" id="coverTitle"></h1>
          <p class="cover-subtitle" id="coverSubtitle"></p>
          <div class="cover-author-row" id="coverAuthorRow">
            <div class="author-avatar" id="authorAvatar"></div>
            <div class="author-info">
              <div class="author-name" id="authorName"></div>
              <div class="author-meta" id="authorMeta"></div>
            </div>
          </div>
          <p class="cover-date" id="coverDate"></p>
          <div class="cover-tags" id="coverTags"></div>
          <div class="cover-actions">
            <a class="action-btn primary" id="readBtn">&#9776; Read Online</a>
            <a class="action-btn primary" id="downloadBtn">&#8615; Download</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Engagement Bar -->
    <div class="engagement-bar fade-in">
      <div class="engage-group">
        <button class="engage-btn" id="likeBtn" title="Like">&#9825; <span id="likeCount">0</span></button>
        <div class="engage-divider"></div>
        <button class="engage-btn" id="dislikeBtn" title="Dislike">&#9877;</button>
      </div>
      <button class="engage-pill" id="saveBtn" title="Save">&#9734; Save</button>
      <button class="engage-pill" id="shareBtn" title="Share">&#8599; Share</button>
      <button class="engage-pill" id="reportBtn" title="Report">&#9872;</button>
      <span class="engage-spacer"></span>
      <div class="engage-stats" id="engageStats"></div>
    </div>

    <!-- Two-column layout -->
    <div class="detail-layout">
      <!-- Main column -->
      <div class="detail-main">
        <!-- Chapters -->
        <div class="chapters-section fade-in">
          <h2 class="sec-title">Chapters <span class="count" id="chapterCountLabel"></span></h2>
          <ul class="chapter-list" id="chapterList"></ul>
        </div>

        <!-- Comments -->
        <div class="comments-section fade-in">
          <h2 class="sec-title" id="commentsTitle">Comments <span class="count">0</span></h2>
          <div class="comment-form" id="commentForm"></div>
          <div id="commentsList"></div>
        </div>
      </div>

      <!-- Sidebar -->
      <div class="detail-sidebar">
        <!-- Stats -->
        <div class="sidebar-section fade-in">
          <div class="sidebar-title">Tome Stats</div>
          <div class="stats-card" id="statsCard">
            <div class="stat-row"><span class="stat-label">Views</span><span class="stat-value" id="statViews">0</span></div>
            <div class="stat-row"><span class="stat-label">Likes</span><span class="stat-value" id="statLikes">0</span></div>
            <div class="stat-row"><span class="stat-label">Downloads</span><span class="stat-value" id="statDownloads">0</span></div>
            <div class="stat-row"><span class="stat-label">Chapters</span><span class="stat-value" id="statChapters">0</span></div>
            <div class="stat-row"><span class="stat-label">Created</span><span class="stat-value" id="statCreated">-</span></div>
          </div>
        </div>

        <!-- Related Tomes -->
        <div class="sidebar-section fade-in" id="relatedSection" style="display: none;">
          <div class="sidebar-title">More like this</div>
          <div id="relatedList"></div>
        </div>

        <!-- By same author -->
        <div class="sidebar-section fade-in" id="authorSection" style="display: none;">
          <div class="sidebar-title" id="authorSectionTitle">By this seeker</div>
          <div id="authorList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Reading View -->
  <div class="reading-view" id="readingView">
    <div class="reading-progress" id="readingProgress"></div>

    <!-- TOC Sidebar -->
    <div class="toc-overlay" id="tocOverlay"></div>
    <div class="toc-sidebar" id="tocSidebar">
      <div class="toc-sidebar-title">Contents</div>
      <div id="tocItems"></div>
    </div>

    <div class="reading-nav">
      <span class="reading-back" id="readingBackBtn">&#8592; Back to tome</span>
      <div class="reading-controls">
        <button class="font-btn" id="tocToggle" title="Table of contents">&#9776;</button>
        <button class="font-btn" id="fontDown" title="Smaller text">A-</button>
        <button class="font-btn" id="fontUp" title="Larger text">A+</button>
      </div>
    </div>

    <div id="readingContent"></div>

    <div class="reading-pagination">
      <button class="reading-page-btn" id="prevChapter" disabled>&#8592; Previous</button>
      <span id="chapterIndicator" style="font-size: 13px; color: var(--text-muted);"></span>
      <button class="reading-page-btn" id="nextChapter">Next &#8594;</button>
    </div>
  </div>

  <!-- Share Modal -->
  <div class="share-modal-bg" id="shareModal">
    <div class="share-modal">
      <h3>Share this tome</h3>
      <div class="share-link-row">
        <input class="share-link-input" id="shareLink" readonly>
        <button class="share-copy-btn" id="shareCopyBtn">Copy</button>
      </div>
      <div class="share-options">
        <a class="share-option" id="shareX" target="_blank" rel="noopener">X / Twitter</a>
        <a class="share-option" id="shareWhatsApp" target="_blank" rel="noopener">WhatsApp</a>
      </div>
    </div>
  </div>

  <script>
    // --- Theme ---
    (function initTheme() {
      const theme = localStorage.getItem('gl-theme');
      if (theme === 'light') document.body.classList.add('light-mode');
    })();

    // --- State ---
    const tomeId = window.location.pathname.split('/')[2];
    const isReadMode = window.location.pathname.endsWith('/read');
    let tomeData = null;
    let chaptersData = null;
    let currentChapter = 0;
    let readingFontSize = 17;
    let userState = { liked: false, disliked: false, saved: false, signedIn: false };

    // --- DOM refs ---
    const detailView = document.getElementById('detailView');
    const readingView = document.getElementById('readingView');
    const loadingState = document.getElementById('loadingState');

    // --- Helpers ---
    function timeAgo(dateStr) {
      const seconds = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
      if (seconds < 60) return 'just now';
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return minutes + (minutes === 1 ? ' minute ago' : ' minutes ago');
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + (hours === 1 ? ' hour ago' : ' hours ago');
      const days = Math.floor(hours / 24);
      if (days < 7) return days + (days === 1 ? ' day ago' : ' days ago');
      const weeks = Math.floor(days / 7);
      if (weeks < 5) return weeks + (weeks === 1 ? ' week ago' : ' weeks ago');
      const months = Math.floor(days / 30);
      if (months < 12) return months + (months === 1 ? ' month ago' : ' months ago');
      return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function formatCount(n) {
      if (!n || n === 0) return '0';
      if (n < 1000) return String(n);
      if (n < 10000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
      if (n < 1000000) return Math.floor(n / 1000) + 'K';
      return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function getInitial(name) {
      return (name || 'A').charAt(0).toUpperCase();
    }

    function getPlaceholderGradient(title) {
      let hash = 0;
      for (let i = 0; i < (title || '').length; i++) {
        hash = ((hash << 5) - hash) + title.charCodeAt(i);
        hash = hash & hash;
      }
      return 'cover-grad-' + (Math.abs(hash) % 8);
    }

    // --- Load tome data ---
    async function loadTome() {
      try {
        const res = await fetch('/api/tomes/' + tomeId);
        if (!res.ok) throw new Error('Not found');
        tomeData = await res.json();

        document.title = tomeData.title + ' | Great Library AI';
        // Update meta description
        const metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) metaDesc.content = (tomeData.subtitle || tomeData.title) + ' - AI-generated tome from the Great Library.';

        renderDetail();
        loadUserState();
        loadComments();
        loadRelated();
        loadAuthorTomes();

        if (isReadMode) {
          loadChaptersAndRead();
        }
      } catch (err) {
        loadingState.textContent = 'This tome could not be found in the archives.';
      }
    }

    // --- Render detail view ---
    function renderDetail() {
      loadingState.style.display = 'none';
      detailView.style.display = 'block';

      // Cover image
      const coverWrap = document.getElementById('coverImageWrap');
      const gradClass = getPlaceholderGradient(tomeData.title);
      if (tomeData.coverUrl) {
        coverWrap.innerHTML = `<img src="${tomeData.coverUrl}" alt="${escapeHtml(tomeData.title)}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
          <div class="placeholder-cover ${gradClass}" style="display:none">
            <span class="placeholder-title">${escapeHtml(tomeData.title)}</span>
            <span class="placeholder-ornament">&#10022;</span>
          </div>`;
      } else {
        coverWrap.innerHTML = `<div class="placeholder-cover ${gradClass}">
          <span class="placeholder-title">${escapeHtml(tomeData.title)}</span>
          <span class="placeholder-ornament">&#10022;</span>
        </div>`;
      }

      // Title and subtitle
      document.getElementById('coverTitle').textContent = tomeData.title;
      document.getElementById('coverSubtitle').textContent = tomeData.subtitle || '';
      if (!tomeData.subtitle) document.getElementById('coverSubtitle').style.display = 'none';

      // Author
      document.getElementById('authorAvatar').textContent = getInitial(tomeData.authorName);
      document.getElementById('authorName').textContent = tomeData.authorName || 'Anonymous Seeker';
      document.getElementById('authorMeta').textContent = tomeData.authorTomesCount > 1
        ? tomeData.authorTomesCount + ' tomes'
        : '';

      // Date
      document.getElementById('coverDate').textContent = timeAgo(tomeData.createdAt);

      // Tags
      const tagsHtml = (tomeData.topicTags || []).map(t =>
        '<a class="cover-tag" href="/tomes?topic=' + t + '">' + t.charAt(0).toUpperCase() + t.slice(1) + '</a>'
      ).join('');
      document.getElementById('coverTags').innerHTML = tagsHtml;

      // Actions
      document.getElementById('readBtn').onclick = () => enterReading();
      document.getElementById('downloadBtn').href = '/api/tomes/' + tomeId + '/download';

      // Engagement stats
      document.getElementById('likeCount').textContent = formatCount(tomeData.likesCount);
      document.getElementById('engageStats').innerHTML =
        '<span>' + formatCount(tomeData.viewsCount) + ' views</span>' +
        '<span>' + formatCount(tomeData.downloadsCount) + ' downloads</span>';

      // Chapters list
      const chapters = tomeData.chapters || [];
      document.getElementById('chapterCountLabel').textContent = chapters.length > 0 ? '(' + chapters.length + ')' : '';
      const chapterList = document.getElementById('chapterList');
      chapterList.innerHTML = chapters.map(function(ch, i) {
        return '<li class="chapter-item" onclick="enterReading(' + i + ')">' +
          '<span class="chapter-num">' + String(i + 1).padStart(2, '0') + '</span>' +
          '<span class="chapter-name">' + escapeHtml(ch.title) + '</span>' +
          '<span class="chapter-play">&#9654;</span>' +
        '</li>';
      }).join('');

      // Stats sidebar
      document.getElementById('statViews').textContent = formatCount(tomeData.viewsCount);
      document.getElementById('statLikes').textContent = formatCount(tomeData.likesCount);
      document.getElementById('statDownloads').textContent = formatCount(tomeData.downloadsCount);
      document.getElementById('statChapters').textContent = chapters.length;
      document.getElementById('statCreated').textContent = new Date(tomeData.createdAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // --- User state (likes/saves) ---
    async function loadUserState() {
      try {
        const res = await fetch('/api/tomes/' + tomeId + '/user-state');
        userState = await res.json();
        updateEngagementButtons();
      } catch (e) {}
    }

    function updateEngagementButtons() {
      var likeBtn = document.getElementById('likeBtn');
      var dislikeBtn = document.getElementById('dislikeBtn');
      var saveBtn = document.getElementById('saveBtn');

      likeBtn.className = 'engage-btn' + (userState.liked ? ' active' : '');
      likeBtn.innerHTML = (userState.liked ? '&#9829;' : '&#9825;') + ' <span id="likeCount">' + formatCount(tomeData.likesCount || 0) + '</span>';

      dislikeBtn.className = 'engage-btn' + (userState.disliked ? ' active' : '');

      saveBtn.className = 'engage-pill' + (userState.saved ? ' active' : '');
      saveBtn.innerHTML = (userState.saved ? '&#9733; Saved' : '&#9734; Save');
    }

    // --- Engagement actions ---
    document.getElementById('likeBtn').addEventListener('click', async function() {
      try {
        var res = await fetch('/api/tomes/' + tomeId + '/like', { method: 'POST' });
        var data = await res.json();
        userState.liked = data.liked;
        if (data.liked) userState.disliked = false;
        tomeData.likesCount = data.likesCount;
        updateEngagementButtons();
        document.getElementById('statLikes').textContent = formatCount(data.likesCount);
      } catch (e) {}
    });

    document.getElementById('dislikeBtn').addEventListener('click', async function() {
      try {
        var res = await fetch('/api/tomes/' + tomeId + '/dislike', { method: 'POST' });
        var data = await res.json();
        userState.disliked = data.disliked;
        if (data.disliked) userState.liked = false;
        tomeData.dislikesCount = data.dislikesCount;
        var tomeRes = await fetch('/api/tomes/' + tomeId);
        var tomeRefresh = await tomeRes.json();
        tomeData.likesCount = tomeRefresh.likesCount;
        updateEngagementButtons();
        document.getElementById('statLikes').textContent = formatCount(tomeData.likesCount);
      } catch (e) {}
    });

    document.getElementById('saveBtn').addEventListener('click', async function() {
      if (!userState.signedIn) {
        alert('Sign in to save tomes to your collection.');
        return;
      }
      try {
        var res = await fetch('/api/tomes/' + tomeId + '/save', { method: 'POST' });
        var data = await res.json();
        userState.saved = data.saved;
        updateEngagementButtons();
      } catch (e) {}
    });

    // Share
    document.getElementById('shareBtn').addEventListener('click', function() {
      var url = window.location.origin + '/tome/' + tomeId;
      document.getElementById('shareLink').value = url;
      document.getElementById('shareX').href = 'https://x.com/intent/tweet?text=' + encodeURIComponent(tomeData.title + ' - AI-generated tome') + '&url=' + encodeURIComponent(url);
      document.getElementById('shareWhatsApp').href = 'https://wa.me/?text=' + encodeURIComponent(tomeData.title + ' ' + url);
      document.getElementById('shareModal').classList.add('open');
    });

    document.getElementById('shareModal').addEventListener('click', function(e) {
      if (e.target === document.getElementById('shareModal')) {
        document.getElementById('shareModal').classList.remove('open');
      }
    });

    document.getElementById('shareCopyBtn').addEventListener('click', function() {
      var input = document.getElementById('shareLink');
      input.select();
      navigator.clipboard.writeText(input.value).then(function() {
        document.getElementById('shareCopyBtn').textContent = 'Copied!';
        setTimeout(function() { document.getElementById('shareCopyBtn').textContent = 'Copy'; }, 2000);
      });
    });

    // Report
    document.getElementById('reportBtn').addEventListener('click', async function() {
      var reason = prompt('Why are you reporting this tome?');
      if (!reason) return;
      try {
        await fetch('/api/tomes/' + tomeId + '/report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason: reason })
        });
        alert('Report submitted. Thank you.');
      } catch (e) {}
    });

    // --- Comments ---
    async function loadComments() {
      try {
        var res = await fetch('/api/tomes/' + tomeId + '/comments');
        var data = await res.json();

        document.getElementById('commentsTitle').innerHTML = 'Comments <span class="count">' + (data.total || 0) + '</span>';

        // Comment form
        var formEl = document.getElementById('commentForm');
        if (userState.signedIn) {
          formEl.innerHTML =
            '<div class="comment-form-inner">' +
              '<div class="comment-form-avatar">' + getInitial('You') + '</div>' +
              '<div class="comment-form-body">' +
                '<textarea class="comment-input" id="commentInput" placeholder="Share your thoughts on this tome..." rows="1"></textarea>' +
                '<div class="comment-submit-row" id="commentSubmitRow">' +
                  '<button class="comment-cancel-btn" id="commentCancelBtn">Cancel</button>' +
                  '<button class="comment-submit-btn" id="commentSubmitBtn">Comment</button>' +
                '</div>' +
              '</div>' +
            '</div>';

          var commentInput = document.getElementById('commentInput');
          var submitRow = document.getElementById('commentSubmitRow');
          commentInput.addEventListener('focus', function() { submitRow.classList.add('visible'); });
          document.getElementById('commentCancelBtn').addEventListener('click', function() {
            commentInput.value = '';
            commentInput.blur();
            submitRow.classList.remove('visible');
          });
          document.getElementById('commentSubmitBtn').addEventListener('click', submitComment);
        } else {
          formEl.innerHTML = '<p class="comment-signin-msg"><a href="/library">Sign in</a> to leave a comment.</p>';
        }

        // Comments list
        var listEl = document.getElementById('commentsList');
        if (data.comments.length === 0) {
          listEl.innerHTML = '<p class="no-comments">No comments yet. Be the first to share your thoughts.</p>';
        } else {
          listEl.innerHTML = data.comments.map(function(c) { return renderComment(c); }).join('');
        }
      } catch (e) {}
    }

    function renderComment(c) {
      var avatarContent = c.userAvatar
        ? '<img src="' + c.userAvatar + '" alt="">'
        : (c.userName || 'A').charAt(0).toUpperCase();

      var repliesHtml = (c.replies || []).length > 0
        ? '<div class="comment-replies">' + c.replies.map(function(r) { return renderComment(r); }).join('') + '</div>'
        : '';

      return '<div class="comment-item">' +
        '<div class="comment-top">' +
          '<div class="comment-avatar">' + avatarContent + '</div>' +
          '<div class="comment-content">' +
            '<div class="comment-header">' +
              '<span class="comment-name">' + escapeHtml(c.userName || 'Anonymous') + '</span>' +
              '<span class="comment-time">' + timeAgo(c.createdAt) + '</span>' +
            '</div>' +
            '<div class="comment-text">' + escapeHtml(c.text) + '</div>' +
            '<div class="comment-actions">' +
              '<button class="comment-action-btn" onclick="likeComment(\'' + c.id + '\', this)">&#9825; ' + (c.likesCount || 0) + '</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        repliesHtml +
      '</div>';
    }

    async function submitComment() {
      var input = document.getElementById('commentInput');
      var text = input.value.trim();
      if (!text) return;

      var btn = document.getElementById('commentSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'Posting...';

      try {
        var res = await fetch('/api/tomes/' + tomeId + '/comments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text })
        });
        if (res.ok) {
          input.value = '';
          document.getElementById('commentSubmitRow').classList.remove('visible');
          loadComments();
        } else {
          var err = await res.json();
          alert(err.error || 'Failed to post comment');
        }
      } catch (e) {
        alert('Failed to post comment');
      }
      btn.disabled = false;
      btn.textContent = 'Comment';
    }

    async function likeComment(commentId, btn) {
      try {
        var res = await fetch('/api/tomes/' + tomeId + '/comments/' + commentId + '/like', { method: 'POST' });
        var data = await res.json();
        btn.innerHTML = '&#9825; ' + data.likesCount;
      } catch (e) {}
    }

    // --- Related tomes ---
    async function loadRelated() {
      if (!tomeData.topicTags || tomeData.topicTags.length === 0) return;
      try {
        var tag = tomeData.topicTags[0];
        var res = await fetch('/api/tomes?topic=' + tag + '&limit=8&sort=trending');
        var data = await res.json();
        var related = data.tomes.filter(function(t) { return t.id !== tomeId; }).slice(0, 6);
        if (related.length === 0) return;

        document.getElementById('relatedSection').style.display = 'block';
        document.getElementById('relatedList').innerHTML = related.map(function(t) {
          var coverHtml = t.coverUrl
            ? '<img src="' + t.coverUrl + '" alt="' + escapeHtml(t.title) + '" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="placeholder-sm" style="display:none">' + escapeHtml(t.title) + '</div>'
            : '<div class="placeholder-sm">' + escapeHtml(t.title) + '</div>';
          return '<div class="related-card" onclick="window.location.href=\'/tome/' + t.id + '\'">' +
            '<div class="related-cover">' + coverHtml + '</div>' +
            '<div class="related-info">' +
              '<div class="related-title">' + escapeHtml(t.title) + '</div>' +
              '<div class="related-author">' + escapeHtml(t.authorName || 'Anonymous Seeker') + '</div>' +
              '<div class="related-stats">' + formatCount(t.viewsCount) + ' views &middot; ' + formatCount(t.likesCount) + ' likes</div>' +
            '</div>' +
          '</div>';
        }).join('');
      } catch (e) {}
    }

    // --- Author's other tomes ---
    async function loadAuthorTomes() {
      if (!tomeData.authorId) return;
      try {
        var res = await fetch('/api/tomes?limit=6&sort=newest');
        var data = await res.json();
        var authorTomes = data.tomes.filter(function(t) { return t.authorId === tomeData.authorId && t.id !== tomeId; }).slice(0, 4);
        if (authorTomes.length === 0) return;

        document.getElementById('authorSection').style.display = 'block';
        document.getElementById('authorSectionTitle').textContent = 'More by ' + (tomeData.authorName || 'this seeker');
        document.getElementById('authorList').innerHTML = authorTomes.map(function(t) {
          var coverHtml = t.coverUrl
            ? '<img src="' + t.coverUrl + '" alt="' + escapeHtml(t.title) + '" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="placeholder-sm" style="display:none">' + escapeHtml(t.title) + '</div>'
            : '<div class="placeholder-sm">' + escapeHtml(t.title) + '</div>';
          return '<div class="related-card" onclick="window.location.href=\'/tome/' + t.id + '\'">' +
            '<div class="related-cover">' + coverHtml + '</div>' +
            '<div class="related-info">' +
              '<div class="related-title">' + escapeHtml(t.title) + '</div>' +
              '<div class="related-stats">' + formatCount(t.viewsCount) + ' views &middot; ' + timeAgo(t.createdAt) + '</div>' +
            '</div>' +
          '</div>';
        }).join('');
      } catch (e) {}
    }

    // --- Reading view ---
    async function loadChaptersAndRead(chapterIdx) {
      try {
        var res = await fetch('/api/tomes/' + tomeId + '/chapters');
        if (!res.ok) throw new Error();
        chaptersData = await res.json();
        enterReading(chapterIdx || 0);
      } catch (e) {
        alert('Could not load chapters.');
      }
    }

    async function enterReading(chapterIdx) {
      if (chapterIdx === undefined) chapterIdx = 0;
      if (!chaptersData) {
        try {
          var res = await fetch('/api/tomes/' + tomeId + '/chapters');
          if (!res.ok) throw new Error();
          chaptersData = await res.json();
        } catch (e) {
          alert('Could not load chapters.');
          return;
        }
      }

      currentChapter = chapterIdx;
      detailView.style.display = 'none';
      readingView.style.display = 'block';

      // Populate TOC sidebar
      var tocItems = document.getElementById('tocItems');
      tocItems.innerHTML = (chaptersData.chapters || []).map(function(ch, i) {
        return '<div class="toc-sidebar-item ' + (i === currentChapter ? 'active' : '') + '" onclick="goToChapter(' + i + ')">' + String(i + 1).padStart(2, '0') + '. ' + escapeHtml(ch.title) + '</div>';
      }).join('');

      renderChapter();
      window.scrollTo(0, 0);
      history.pushState(null, '', '/tome/' + tomeId + '/read');
    }

    function exitReading() {
      readingView.style.display = 'none';
      detailView.style.display = 'block';
      history.pushState(null, '', '/tome/' + tomeId);
      window.scrollTo(0, 0);
    }

    function renderChapter() {
      if (!chaptersData || !chaptersData.chapters) return;
      var ch = chaptersData.chapters[currentChapter];
      if (!ch) return;

      var design = chaptersData.designConfig || {};
      var divider = design.divider || '\u2014\u2014\u2014';
      var endMark = design.endMark || '~ ~ ~';

      var paragraphs = (ch.content || '').split(/\n\n+/).filter(function(p) { return p.trim(); });
      var bodyHtml = paragraphs.map(function(p) { return '<p>' + escapeHtml(p.trim()) + '</p>'; }).join('');

      document.getElementById('readingContent').innerHTML =
        '<div class="reading-chapter-num">Chapter ' + (currentChapter + 1) + '</div>' +
        '<h1 class="reading-chapter-title">' + escapeHtml(ch.title) + '</h1>' +
        '<div class="reading-divider">' + escapeHtml(divider) + '</div>' +
        '<div class="reading-body" style="font-size: ' + readingFontSize + 'px">' + bodyHtml + '</div>' +
        '<div class="reading-end-mark">' + escapeHtml(endMark) + '</div>';

      document.getElementById('chapterIndicator').textContent = (currentChapter + 1) + ' / ' + chaptersData.chapters.length;
      document.getElementById('prevChapter').disabled = currentChapter <= 0;
      document.getElementById('nextChapter').disabled = currentChapter >= chaptersData.chapters.length - 1;

      document.querySelectorAll('.toc-sidebar-item').forEach(function(item, i) {
        item.classList.toggle('active', i === currentChapter);
      });
    }

    function goToChapter(idx) {
      currentChapter = idx;
      renderChapter();
      window.scrollTo(0, 0);
      closeToc();
    }

    // Reading controls
    document.getElementById('readingBackBtn').addEventListener('click', exitReading);
    document.getElementById('prevChapter').addEventListener('click', function() { goToChapter(currentChapter - 1); });
    document.getElementById('nextChapter').addEventListener('click', function() { goToChapter(currentChapter + 1); });

    document.getElementById('fontUp').addEventListener('click', function() {
      readingFontSize = Math.min(26, readingFontSize + 1);
      var body = document.querySelector('.reading-body');
      if (body) body.style.fontSize = readingFontSize + 'px';
    });
    document.getElementById('fontDown').addEventListener('click', function() {
      readingFontSize = Math.max(13, readingFontSize - 1);
      var body = document.querySelector('.reading-body');
      if (body) body.style.fontSize = readingFontSize + 'px';
    });

    // TOC sidebar
    function closeToc() {
      document.getElementById('tocSidebar').classList.remove('open');
      document.getElementById('tocOverlay').classList.remove('open');
    }
    document.getElementById('tocToggle').addEventListener('click', function() {
      document.getElementById('tocSidebar').classList.toggle('open');
      document.getElementById('tocOverlay').classList.toggle('open');
    });
    document.getElementById('tocOverlay').addEventListener('click', closeToc);

    // Reading progress
    window.addEventListener('scroll', function() {
      if (readingView.style.display !== 'block') return;
      var scrollTop = window.scrollY;
      var docHeight = document.documentElement.scrollHeight - window.innerHeight;
      var progress = docHeight > 0 ? Math.min(1, scrollTop / docHeight) : 0;
      document.getElementById('readingProgress').style.width = (progress * 100) + '%';
    });

    // Back button
    window.addEventListener('popstate', function() {
      if (readingView.style.display === 'block' && !window.location.pathname.endsWith('/read')) {
        readingView.style.display = 'none';
        detailView.style.display = 'block';
      }
    });

    // --- Init ---
    loadTome();
  </script>
</body>
</html>
