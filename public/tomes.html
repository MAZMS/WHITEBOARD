<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Tome Library | Great Library AI</title>
  <meta name="description" content="Browse the collection of AI-generated tomes. Discover knowledge crafted by seekers and the Guardian.">
  <link rel="icon" type="image/jpeg" href="/favicon.jpg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --bg-card: #111110;
      --bg-hover: #1a1917;
      --gold: #c8b88a;
      --gold-dim: #8a7d5a;
      --gold-bright: #e0d4a8;
      --accent: #3a3528;
      --accent-hover: #4a4030;
      --accent-bright: #5a5038;
      --text-muted: #6a6050;
      --border: #2a2520;
      --red: #8a4040;
      --font: Georgia, 'Times New Roman', serif;
    }

    html, body {
      background: var(--bg);
      color: var(--gold);
      font-family: var(--font);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Hide scrollbars */
    ::-webkit-scrollbar { width: 0; height: 0; }
    * { scrollbar-width: none; }

    /* --- Header --- */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-logo {
      font-size: 18px;
      color: var(--gold);
      text-decoration: none;
      letter-spacing: 1px;
      font-weight: normal;
      transition: color 0.3s;
    }
    .header-logo:hover { color: var(--gold-bright); }
    .header-logo span { opacity: 0.4; }

    .header-nav {
      display: flex;
      gap: 8px;
    }
    .header-nav a {
      color: var(--gold-dim);
      text-decoration: none;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .header-nav a:hover, .header-nav a.active {
      color: var(--gold);
      background: var(--accent);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-box {
      position: relative;
      width: 280px;
    }
    .search-box input {
      width: 100%;
      background: var(--accent);
      border: 1px solid var(--border);
      color: var(--gold);
      font-family: var(--font);
      font-size: 16px;
      padding: 8px 36px 8px 14px;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.3s;
    }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-box input:focus { border-color: var(--gold-dim); }
    .search-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
      pointer-events: none;
    }

    .create-btn {
      background: var(--accent-hover);
      border: 1px solid var(--accent-bright);
      color: var(--gold);
      font-family: var(--font);
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }
    .create-btn:hover {
      background: var(--accent-bright);
      border-color: var(--gold-dim);
      color: var(--gold-bright);
    }

    /* --- Main content --- */
    .main {
      padding-top: 88px;
      padding-bottom: 60px;
      max-width: 1400px;
      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
    }

    /* --- Hero section --- */
    .hero {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 40px;
      min-height: 280px;
      display: flex;
      align-items: flex-end;
      background: linear-gradient(135deg, #1a1815 0%, #0d0c0a 100%);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: border-color 0.4s;
    }
    .hero:hover { border-color: var(--accent-bright); }

    .hero-cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.3;
      transition: opacity 0.5s;
    }
    .hero:hover .hero-cover { opacity: 0.4; }

    .hero-gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70%;
      background: linear-gradient(to top, rgba(10, 10, 10, 0.95) 0%, rgba(10, 10, 10, 0.6) 50%, transparent 100%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: 32px;
      width: 100%;
    }
    .hero-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--gold-dim);
      margin-bottom: 12px;
    }
    .hero-title {
      font-size: 32px;
      color: var(--gold-bright);
      margin-bottom: 8px;
      line-height: 1.2;
    }
    .hero-subtitle {
      font-size: 16px;
      color: var(--gold-dim);
      margin-bottom: 12px;
      font-style: italic;
    }
    .hero-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .hero-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* --- Filters bar --- */
    .filters {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .filter-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      flex: 1;
    }

    .tag-pill {
      background: var(--accent);
      border: 1px solid var(--border);
      color: var(--gold-dim);
      font-family: var(--font);
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tag-pill:hover, .tag-pill.active {
      background: var(--accent-hover);
      color: var(--gold);
      border-color: var(--accent-bright);
    }
    .tag-pill.active {
      background: var(--accent-bright);
      color: var(--gold-bright);
    }

    .sort-select {
      background: var(--accent);
      border: 1px solid var(--border);
      color: var(--gold-dim);
      font-family: var(--font);
      font-size: 16px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      outline: none;
    }
    .sort-select:focus { border-color: var(--gold-dim); }
    .sort-select option { background: var(--bg); color: var(--gold); }

    /* --- Tome Grid --- */
    .tome-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px;
    }

    .tome-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.35s ease;
      position: relative;
    }
    .tome-card:hover {
      border-color: var(--accent-bright);
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(200, 184, 138, 0.06);
    }

    .card-cover {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: linear-gradient(135deg, #1a1815, #0d0c0a);
      position: relative;
      overflow: hidden;
    }
    .card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .tome-card:hover .card-cover img {
      transform: scale(1.04);
    }
    .card-cover .no-cover {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      font-size: 48px;
      color: var(--accent-bright);
      background: linear-gradient(135deg, #181714 0%, #0f0e0c 100%);
    }

    .card-body {
      padding: 14px;
    }

    .card-title {
      font-size: 15px;
      color: var(--gold);
      line-height: 1.35;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-author {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .card-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .card-tag {
      font-size: 10px;
      color: var(--gold-dim);
      background: var(--accent);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .card-stats {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .card-stats span {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .card-time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* --- Empty / Loading states --- */
    .loading-state, .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }
    .loading-state { font-style: italic; }

    .empty-state h3 {
      color: var(--gold-dim);
      font-size: 20px;
      margin-bottom: 12px;
      font-weight: normal;
    }
    .empty-state p {
      font-size: 14px;
      margin-bottom: 20px;
    }

    .empty-cta {
      display: inline-block;
      background: var(--accent-hover);
      border: 1px solid var(--accent-bright);
      color: var(--gold);
      font-family: var(--font);
      font-size: 14px;
      padding: 10px 24px;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.3s;
    }
    .empty-cta:hover {
      background: var(--accent-bright);
      color: var(--gold-bright);
    }

    /* --- Load more --- */
    .load-more {
      text-align: center;
      padding: 40px 20px;
    }
    .load-more-btn {
      background: var(--accent);
      border: 1px solid var(--border);
      color: var(--gold-dim);
      font-family: var(--font);
      font-size: 14px;
      padding: 10px 32px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .load-more-btn:hover {
      background: var(--accent-hover);
      color: var(--gold);
      border-color: var(--accent-bright);
    }
    .load-more-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* --- Footer --- */
    .footer {
      text-align: center;
      padding: 32px 20px;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }
    .footer a {
      color: var(--gold-dim);
      text-decoration: none;
    }
    .footer a:hover { color: var(--gold); }

    /* --- Skeleton loading --- */
    .skeleton {
      background: linear-gradient(90deg, var(--accent) 25%, var(--accent-hover) 50%, var(--accent) 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.5s infinite;
      border-radius: 6px;
    }
    @keyframes skeleton-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-card .card-cover { background: none; }
    .skeleton-card .card-cover .skeleton { width: 100%; height: 100%; border-radius: 0; }
    .skeleton-card .card-body .skeleton { height: 14px; margin-bottom: 8px; }
    .skeleton-card .card-body .skeleton:first-child { width: 85%; height: 16px; }
    .skeleton-card .card-body .skeleton:nth-child(2) { width: 50%; }
    .skeleton-card .card-body .skeleton:nth-child(3) { width: 70%; }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      .header { padding: 0 16px; height: 56px; }
      .header-nav { display: none; }
      .search-box { width: 160px; }
      .create-btn { padding: 6px 12px; font-size: 12px; min-height: 44px; display: flex; align-items: center; }
      .main {
        padding-top: 76px;
        padding-left: 16px;
        padding-right: 16px;
        padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px));
      }
      .hero { min-height: 200px; }
      .hero-title { font-size: 22px; }
      .hero-content { padding: 20px; }
      .tome-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
      .card-body { padding: 10px; }
      .card-title { font-size: 13px; }
      .tag-pill { min-height: 36px; display: inline-flex; align-items: center; }
      .sort-select { min-height: 36px; }
      .load-more-btn { min-height: 44px; }
    }

    @media (max-width: 480px) {
      .tome-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .search-box { width: 100px; }
      .search-box input { font-size: 16px; padding: 8px 30px 8px 10px; }
      .header-logo { font-size: 15px; }
      .hero-title { font-size: 18px; }
      .create-btn { font-size: 0; padding: 6px 10px; }
      .create-btn::before { content: '+'; font-size: 18px; }
    }

    @media (max-width: 360px) {
      .header { padding: 0 10px; gap: 6px; }
      .search-box { width: 80px; }
      .hero-content { padding: 14px; }
      .hero-title { font-size: 16px; }
    }

    /* --- Reduced motion --- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* --- Fade-in animation --- */
    .fade-in {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeInUp 0.4s ease forwards;
    }
    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .tome-card:nth-child(1) { animation-delay: 0.02s; }
    .tome-card:nth-child(2) { animation-delay: 0.06s; }
    .tome-card:nth-child(3) { animation-delay: 0.10s; }
    .tome-card:nth-child(4) { animation-delay: 0.14s; }
    .tome-card:nth-child(5) { animation-delay: 0.18s; }
    .tome-card:nth-child(6) { animation-delay: 0.22s; }
    .tome-card:nth-child(7) { animation-delay: 0.26s; }
    .tome-card:nth-child(8) { animation-delay: 0.30s; }
    .tome-card:nth-child(9) { animation-delay: 0.34s; }
    .tome-card:nth-child(10) { animation-delay: 0.38s; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <a href="/" class="header-logo">Great Library <span>AI</span></a>
      <nav class="header-nav">
        <a href="/tomes" class="active">Browse</a>
        <a href="/library">Create</a>
      </nav>
    </div>
    <div class="header-right">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search tomes..." autocomplete="off">
        <span class="search-icon">&#9906;</span>
      </div>
      <a href="/library" class="create-btn">+ Create Tome</a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <!-- Hero (featured tome) -->
    <div class="hero" id="heroSection" style="display: none;">
      <img class="hero-cover" id="heroCover" src="" alt="">
      <div class="hero-gradient"></div>
      <div class="hero-content">
        <div class="hero-label" id="heroLabel">Featured Tome</div>
        <div class="hero-title" id="heroTitle"></div>
        <div class="hero-subtitle" id="heroSubtitle"></div>
        <div class="hero-meta" id="heroMeta"></div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <div class="filter-tags" id="filterTags">
        <button class="tag-pill active" data-topic="all">All</button>
      </div>
      <select class="sort-select" id="sortSelect">
        <option value="newest">Newest</option>
        <option value="trending">Trending</option>
        <option value="most-liked">Most Liked</option>
        <option value="most-viewed">Most Viewed</option>
        <option value="oldest">Oldest</option>
      </select>
    </div>

    <!-- Tome Grid -->
    <div class="tome-grid" id="tomeGrid"></div>

    <!-- Loading state -->
    <div class="loading-state" id="loadingState">
      <p>The archives stir...</p>
    </div>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <h3>The shelves are empty</h3>
      <p>No tomes have been inscribed yet. Speak with the Guardian to forge your first.</p>
      <a href="/library" class="empty-cta">Enter the Library</a>
    </div>

    <!-- Load more -->
    <div class="load-more" id="loadMore" style="display: none;">
      <button class="load-more-btn" id="loadMoreBtn">Reveal more tomes</button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p><a href="/">greatlibrary.ai</a> &mdash; Knowledge forged by seekers and the Guardian</p>
  </footer>

  <script>
    // --- State ---
    let currentPage = 1;
    let currentTopic = 'all';
    let currentSort = 'newest';
    let currentSearch = '';
    let totalPages = 1;
    let allTags = [];
    let isLoading = false;

    // --- DOM refs ---
    const tomeGrid = document.getElementById('tomeGrid');
    const loadingState = document.getElementById('loadingState');
    const emptyState = document.getElementById('emptyState');
    const loadMore = document.getElementById('loadMore');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const heroSection = document.getElementById('heroSection');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const filterTags = document.getElementById('filterTags');

    // --- Time ago helper ---
    function timeAgo(dateStr) {
      const seconds = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
      if (seconds < 60) return 'just now';
      if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
      if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
      if (seconds < 604800) return Math.floor(seconds / 86400) + 'd ago';
      if (seconds < 2592000) return Math.floor(seconds / 604800) + 'w ago';
      return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // --- Render a tome card ---
    function createTomeCard(tome) {
      const card = document.createElement('div');
      card.className = 'tome-card fade-in';
      card.onclick = () => window.location.href = '/tome/' + tome.id;

      const coverHtml = tome.coverUrl
        ? `<img src="${tome.coverUrl}" alt="${tome.title}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'no-cover\\'>&#9733;</div>'">`
        : `<div class="no-cover">&#9733;</div>`;

      const tagsHtml = (tome.topicTags || []).slice(0, 3).map(t =>
        `<span class="card-tag">${t}</span>`
      ).join('');

      card.innerHTML = `
        <div class="card-cover">${coverHtml}</div>
        <div class="card-body">
          <div class="card-title">${escapeHtml(tome.title)}</div>
          <div class="card-author">${escapeHtml(tome.authorName || 'Anonymous Seeker')}</div>
          <div class="card-tags">${tagsHtml}</div>
          <div class="card-stats">
            <span title="Likes">&#9825; ${tome.likesCount || 0}</span>
            <span title="Views">&#9673; ${tome.viewsCount || 0}</span>
            ${tome.chapterCount ? `<span title="Chapters">&#9776; ${tome.chapterCount}</span>` : ''}
          </div>
          <div class="card-time">${timeAgo(tome.createdAt)}</div>
        </div>
      `;
      return card;
    }

    // --- Create skeleton cards ---
    function createSkeletonCards(count) {
      let html = '';
      for (let i = 0; i < count; i++) {
        html += `
          <div class="tome-card skeleton-card fade-in">
            <div class="card-cover"><div class="skeleton" style="width:100%;height:100%;border-radius:0"></div></div>
            <div class="card-body">
              <div class="skeleton" style="width:85%;height:16px;margin-bottom:8px"></div>
              <div class="skeleton" style="width:50%;height:12px;margin-bottom:8px"></div>
              <div class="skeleton" style="width:70%;height:10px"></div>
            </div>
          </div>
        `;
      }
      return html;
    }

    // --- Load tomes ---
    async function loadTomes(append = false) {
      if (isLoading) return;
      isLoading = true;

      if (!append) {
        tomeGrid.innerHTML = createSkeletonCards(8);
        emptyState.style.display = 'none';
        loadMore.style.display = 'none';
      } else {
        loadMoreBtn.textContent = 'Searching...';
        loadMoreBtn.disabled = true;
      }

      try {
        const params = new URLSearchParams({
          page: currentPage,
          limit: 20,
          sort: currentSort,
          topic: currentTopic
        });
        if (currentSearch) params.set('q', currentSearch);

        const res = await fetch('/api/tomes?' + params);
        const data = await res.json();

        totalPages = data.totalPages;

        // Update tags if first load
        if (!append && data.tags && data.tags.length > 0) {
          allTags = data.tags;
          renderFilterTags();
        }

        if (!append) {
          tomeGrid.innerHTML = '';
          loadingState.style.display = 'none';
        }

        if (data.tomes.length === 0 && !append) {
          if (currentSearch || currentTopic !== 'all') {
            emptyState.querySelector('h3').textContent = 'No tomes found';
            emptyState.querySelector('p').textContent = currentSearch
              ? `No tomes match "${currentSearch}". Try a different search.`
              : `No tomes in this category yet.`;
          } else {
            emptyState.querySelector('h3').textContent = 'The shelves are empty';
            emptyState.querySelector('p').textContent = 'No tomes have been inscribed yet. Be the first to create one.';
          }
          emptyState.style.display = 'block';
        } else {
          emptyState.style.display = 'none';
          data.tomes.forEach(tome => {
            tomeGrid.appendChild(createTomeCard(tome));
          });

          // Show hero for featured tome on first load
          if (!append && data.tomes.length > 0 && currentPage === 1 && !currentSearch && currentTopic === 'all') {
            showHero(data.tomes[0]);
          } else if (!append) {
            heroSection.style.display = 'none';
          }
        }

        // Show/hide load more
        if (currentPage < totalPages) {
          loadMore.style.display = 'block';
          loadMoreBtn.textContent = 'Reveal more tomes';
          loadMoreBtn.disabled = false;
        } else {
          loadMore.style.display = 'none';
        }
      } catch (err) {
        console.error('Failed to load tomes:', err);
        if (!append) {
          loadingState.style.display = 'none';
          emptyState.querySelector('h3').textContent = 'The archives are unreachable';
          emptyState.querySelector('p').textContent = 'Something went wrong. Try again later.';
          emptyState.style.display = 'block';
        }
      }

      isLoading = false;
    }

    // --- Show hero section ---
    function showHero(tome) {
      heroSection.style.display = 'flex';
      heroSection.onclick = () => window.location.href = '/tome/' + tome.id;

      if (tome.coverUrl) {
        document.getElementById('heroCover').src = tome.coverUrl;
        document.getElementById('heroCover').style.display = 'block';
      } else {
        document.getElementById('heroCover').style.display = 'none';
      }

      document.getElementById('heroLabel').textContent = (tome.topicTags || [])[0]
        ? 'Featured in ' + tome.topicTags[0]
        : 'Featured Tome';
      document.getElementById('heroTitle').textContent = tome.title;
      document.getElementById('heroSubtitle').textContent = tome.subtitle || '';
      document.getElementById('heroMeta').innerHTML = `
        <span>${escapeHtml(tome.authorName || 'Anonymous Seeker')}</span>
        <span>&#9825; ${tome.likesCount || 0}</span>
        <span>&#9673; ${tome.viewsCount || 0}</span>
        <span>${timeAgo(tome.createdAt)}</span>
      `;
    }

    // --- Render filter tags ---
    function renderFilterTags() {
      let html = '<button class="tag-pill ' + (currentTopic === 'all' ? 'active' : '') + '" data-topic="all">All</button>';
      allTags.forEach(tag => {
        const label = tag.charAt(0).toUpperCase() + tag.slice(1);
        html += `<button class="tag-pill ${currentTopic === tag ? 'active' : ''}" data-topic="${tag}">${label}</button>`;
      });
      filterTags.innerHTML = html;

      // Attach click handlers
      filterTags.querySelectorAll('.tag-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          currentTopic = pill.dataset.topic;
          currentPage = 1;
          filterTags.querySelectorAll('.tag-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          loadTomes();
        });
      });
    }

    // --- Event listeners ---
    sortSelect.addEventListener('change', () => {
      currentSort = sortSelect.value;
      currentPage = 1;
      loadTomes();
    });

    loadMoreBtn.addEventListener('click', () => {
      currentPage++;
      loadTomes(true);
    });

    // Search with debounce
    let searchTimeout;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        currentSearch = searchInput.value.trim();
        currentPage = 1;
        loadTomes();
      }, 400);
    });

    // --- Escape HTML helper ---
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // --- Init ---
    loadTomes();
  </script>
</body>
</html>
