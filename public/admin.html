<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Great Library -- Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/admin-style.css">
</head>
<body>
  <div id="alertBanner" class="alert-banner"></div>
  <div class="admin-header">
    <div class="admin-title">The Great Library -- Admin</div>
    <div class="admin-subtitle">Every metric. One scroll.</div>
    <div class="admin-refresh-info">Auto-refreshes every <span>30s</span> -- Last: <span id="lastRefresh">--</span></div>
    <div class="header-controls">
      <button class="ctrl-btn" id="btnTheme" title="Toggle theme"><svg id="themeIcon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.5-.04-1-.13-1.5A5.5 5.5 0 0 1 13.5 3.13 9.1 9.1 0 0 0 12 3z"/></svg></button>
      <button class="ctrl-btn" id="btnSound" title="Toggle sound"><svg id="soundIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8.5v7a4.5 4.5 0 0 0 2.5-3.5zM14 3.23v2.06a6.5 6.5 0 0 1 0 13.42v2.06A8.5 8.5 0 0 0 14 3.23z"/></svg></button>
      <button class="ctrl-btn" id="btnRefresh" title="Refresh now"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 8 8h-2a6 6 0 1 1-1.76-4.24L14 10h6V4l-2.35 2.35z"/></svg></button>
    </div>
  </div>
  <div class="kpi-row" id="kpiRow"></div>
  <div class="admin-grid" id="dashboard"><div class="loading">The archives open...</div></div>
  <div class="chat-trigger" id="chatTrigger" title="Ask the Guardian"><div class="chat-trigger-pupil"></div></div>
  <div class="chat-panel" id="chatPanel">
    <div class="chat-header">The Guardian&#39;s Counsel</div>
    <div class="chat-messages" id="chatMessages"><div class="chat-msg guardian">I see all that transpires within these halls. What would you know?</div></div>
    <div class="chat-input-wrap"><input class="chat-input" id="chatInput" type="text" placeholder="Ask about metrics..." autocomplete="off"><button class="chat-send" id="chatSend">Send</button></div>
  </div>
  <script src="/admin-app.js"></script>
</body>
</html>
