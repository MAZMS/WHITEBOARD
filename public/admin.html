<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Great Library -- Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; min-height: 100vh;
      background: #0a0a0a;
      font-family: Georgia, 'Times New Roman', serif;
      color: #c8b88a;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    body::-webkit-scrollbar { display: none; }

    .admin-header {
      text-align: center;
      padding: 40px 20px 20px;
      border-bottom: 1px solid #1a1814;
    }
    .admin-title { font-size: 28px; font-weight: normal; color: #c8b88a; letter-spacing: 2px; }
    .admin-subtitle { font-size: 13px; color: #4a4030; margin-top: 8px; font-style: italic; }
    .admin-refresh-info { font-size: 11px; color: #3a3528; margin-top: 12px; }
    .admin-refresh-info span { color: #5a5038; }

    /* Time period selector */
    .period-selector {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-top: 20px;
      padding: 0 20px;
    }
    .period-btn {
      background: transparent;
      border: 1px solid #1a1814;
      color: #4a4030;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 13px;
      padding: 10px 24px;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
      position: relative;
    }
    .period-btn:first-child { border-radius: 6px 0 0 6px; }
    .period-btn:last-child { border-radius: 0 6px 6px 0; }
    .period-btn + .period-btn { border-left: none; }
    .period-btn:hover {
      color: #8a7d55;
      background: rgba(200, 184, 138, 0.04);
    }
    .period-btn.active {
      color: #c8b88a;
      background: rgba(200, 184, 138, 0.08);
      border-color: #3a3528;
      z-index: 1;
    }
    .period-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 20%;
      right: 20%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c8b88a, transparent);
    }

    /* Budget alert banner */
    .alert-banner {
      background: rgba(122, 74, 74, 0.15);
      border: 1px solid rgba(154, 90, 90, 0.3);
      color: #c87a7a;
      padding: 12px 20px;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    .alert-banner.active { display: block; }
    .alert-banner.warning { background: rgba(138, 125, 85, 0.15); border-color: rgba(184, 168, 106, 0.3); color: #c8b06a; }

    .admin-grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 60px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 20px;
    }

    .card {
      background: #0f0e0c;
      border: 1px solid #1a1814;
      border-radius: 8px;
      padding: 24px;
      transition: border-color 0.3s;
      overflow: hidden;
    }
    .card:hover { border-color: #2a2520; }
    .card-full { grid-column: 1 / -1; }

    .card-title {
      font-size: 14px;
      color: #6a6050;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1a1814;
    }

    .stat-row { display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 16px; }
    .stat-row:last-child { margin-bottom: 0; }
    .stat { flex: 1; min-width: 100px; }
    .stat-value { font-size: 32px; color: #c8b88a; line-height: 1.2; }
    .stat-value.accent { color: #8a7d55; }
    .stat-value.success { color: #5a7a4a; }
    .stat-value.danger { color: #7a4a4a; }
    .stat-value.small { font-size: 20px; }
    .stat-label { font-size: 12px; color: #4a4030; margin-top: 4px; }

    /* Trend delta badges */
    .trend-delta {
      display: inline-block;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
      margin-left: 6px;
      vertical-align: middle;
      font-weight: normal;
      letter-spacing: 0;
    }
    .trend-delta.up { background: rgba(90, 122, 74, 0.15); color: #6a9a5a; }
    .trend-delta.down { background: rgba(122, 74, 74, 0.15); color: #9a5a5a; }
    .trend-delta.neutral { background: rgba(138, 125, 85, 0.1); color: #6a6050; }

    .vs-label { font-size: 11px; color: #3a3528; margin-top: 2px; }

    /* Trend chart */
    .trend-chart {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 60px;
      margin-top: 12px;
      padding-top: 4px;
    }
    .trend-chart-bar {
      flex: 1;
      min-width: 0;
      border-radius: 2px 2px 0 0;
      transition: height 0.4s ease, background 0.3s;
      position: relative;
      cursor: default;
    }
    .trend-chart-bar:hover { opacity: 0.85; }
    .trend-chart-bar .bar-tooltip {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #1a1814;
      border: 1px solid #2a2520;
      color: #c8b88a;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
    }
    .trend-chart-bar:hover .bar-tooltip { display: block; }
    .trend-chart-labels {
      display: flex;
      gap: 3px;
      margin-top: 4px;
    }
    .trend-chart-labels span {
      flex: 1;
      text-align: center;
      font-size: 10px;
      color: #3a3528;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Series selector tabs */
    .series-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 12px;
    }
    .series-tab {
      background: transparent;
      border: 1px solid #141210;
      color: #4a4030;
      font-family: Georgia, serif;
      font-size: 11px;
      padding: 5px 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .series-tab:first-child { border-radius: 4px 0 0 4px; }
    .series-tab:last-child { border-radius: 0 4px 4px 0; }
    .series-tab + .series-tab { border-left: none; }
    .series-tab:hover { color: #6a6050; }
    .series-tab.active { color: #c8b88a; background: rgba(200, 184, 138, 0.06); border-color: #2a2520; }

    .bar-group { margin-top: 16px; }
    .bar-item { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .bar-label { font-size: 12px; color: #6a6050; min-width: 80px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { flex: 1; height: 18px; background: #141210; border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #3a3528, #5a5038); border-radius: 3px; transition: width 0.6s ease; min-width: 2px; }
    .bar-count { font-size: 12px; color: #5a5038; min-width: 36px; }

    .provider-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .provider-card {
      background: #121110;
      border: 1px solid #1a1814;
      border-radius: 6px;
      padding: 14px;
      position: relative;
    }
    .provider-card.active-provider { border-color: #5a7a4a; }
    .provider-card.not-configured { opacity: 0.4; }
    .provider-name { font-size: 14px; color: #c8b88a; margin-bottom: 6px; font-weight: bold; }
    .provider-badge {
      position: absolute;
      top: 8px; right: 8px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .provider-badge.active { background: rgba(90, 122, 74, 0.3); color: #6a9a5a; }
    .provider-badge.configured { background: rgba(138, 125, 85, 0.2); color: #8a7d55; }
    .provider-badge.off { background: rgba(80, 70, 60, 0.2); color: #4a4030; }
    .provider-detail { font-size: 11px; color: #5a5038; margin-top: 3px; }

    .visitor-feed { max-height: 400px; overflow-y: auto; -ms-overflow-style: none; scrollbar-width: none; }
    .visitor-feed::-webkit-scrollbar { display: none; }
    .visitor-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid #0f0e0c;
      font-size: 12px;
    }
    .visitor-item:last-child { border-bottom: none; }
    .visitor-dot { width: 6px; height: 6px; border-radius: 50%; background: #3a3528; flex-shrink: 0; }
    .visitor-dot.recent { background: #5a7a4a; animation: pulse-anim 2s ease-in-out infinite; }
    .visitor-page { color: #8a7d55; min-width: 60px; }
    .visitor-geo { color: #5a5038; flex: 1; }
    .visitor-time { color: #3a3528; white-space: nowrap; }
    .visitor-device { color: #4a4030; font-size: 11px; }

    .usage-bar-wrap { margin-bottom: 12px; }
    .usage-bar-header { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
    .usage-bar-label { color: #6a6050; }
    .usage-bar-value { color: #8a8070; }
    .usage-bar-track { height: 10px; background: #141210; border-radius: 5px; overflow: hidden; }
    .usage-bar-fill { height: 100%; border-radius: 5px; transition: width 0.6s ease; }
    .usage-bar-fill.green { background: linear-gradient(90deg, #2a4a28, #3a6a3a); }
    .usage-bar-fill.yellow { background: linear-gradient(90deg, #5a4a28, #7a6a3a); }
    .usage-bar-fill.red { background: linear-gradient(90deg, #5a2828, #7a3a3a); }

    .data-table-wrap {
      overflow-x: auto;
      margin-top: 12px;
      scrollbar-width: thin;
      scrollbar-color: #2a2520 transparent;
    }
    .data-table-wrap::-webkit-scrollbar { height: 6px; }
    .data-table-wrap::-webkit-scrollbar-track { background: transparent; }
    .data-table-wrap::-webkit-scrollbar-thumb { background: #2a2520; border-radius: 3px; }
    .data-table-wrap::-webkit-scrollbar-thumb:hover { background: #3a3528; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
    .data-table th {
      text-align: left; padding: 8px 12px; color: #5a5038; font-weight: normal;
      font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
      border-bottom: 1px solid #1a1814; cursor: pointer; user-select: none; white-space: nowrap;
    }
    .data-table th:hover { color: #8a7d55; }
    .data-table td {
      padding: 8px 12px; border-bottom: 1px solid #0f0e0c; color: #8a8070;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .data-table tr:hover td { background: #121110; }

    .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
    .tag-ready { background: rgba(90, 122, 74, 0.2); color: #6a9a5a; }
    .tag-generating { background: rgba(138, 125, 85, 0.2); color: #b8a86a; }
    .tag-failed { background: rgba(122, 74, 74, 0.2); color: #9a5a5a; }
    .tag-yes { background: rgba(90, 122, 74, 0.15); color: #6a9a5a; }
    .tag-no { background: rgba(122, 74, 74, 0.15); color: #7a5a5a; }

    .search-input {
      width: 100%; background: #141210; border: 1px solid #1a1814; border-radius: 4px;
      padding: 8px 12px; color: #c8b88a; font-family: Georgia, serif; font-size: 13px;
      outline: none; margin-bottom: 12px; transition: border-color 0.3s;
    }
    .search-input::placeholder { color: #3a3528; }
    .search-input:focus { border-color: #3a3528; }

    .btn-export {
      background: rgba(180, 160, 100, 0.06); border: 1px solid #1a1814; border-radius: 4px;
      color: #5a5038; font-family: Georgia, serif; font-size: 12px; padding: 6px 14px;
      cursor: pointer; transition: background 0.3s, border-color 0.3s, color 0.3s;
      float: right; margin-top: -6px;
    }
    .btn-export:hover { background: rgba(180, 160, 100, 0.12); border-color: #2a2520; color: #8a7d55; }

    .sys-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #0f0e0c; }
    .sys-row:last-child { border-bottom: none; }
    .sys-label { font-size: 13px; color: #5a5038; }
    .sys-value { font-size: 13px; color: #8a8070; }

    .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #5a7a4a; margin-right: 6px; animation: pulse-anim 2s ease-in-out infinite; }
    .pulse.warn { background: #8a7d55; }
    .pulse.danger { background: #7a4a4a; }
    @keyframes pulse-anim { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .loading { text-align: center; padding: 40px; color: #3a3528; font-style: italic; }
    .empty-state { text-align: center; padding: 20px; color: #2a2520; font-style: italic; font-size: 13px; }

    @media (max-width: 720px) {
      .admin-grid { grid-template-columns: 1fr; padding: 16px 12px 40px; }
      .card { padding: 18px; }
      .stat-value { font-size: 24px; }
      .stat-row { gap: 16px; }
      .card-full { grid-column: 1; }
      .provider-grid { grid-template-columns: 1fr; }
      .period-selector { flex-wrap: wrap; }
      .period-btn { padding: 8px 14px; font-size: 12px; flex: 1; min-width: 0; }
      .period-btn:first-child { border-radius: 6px 0 0 0; }
      .period-btn:last-child { border-radius: 0 0 6px 0; }
      .period-btn:nth-child(3) { border-radius: 0 6px 0 0; }
      .period-btn:nth-child(4) { border-left: 1px solid #1a1814; border-top: none; border-radius: 0 0 0 6px; }
      .period-btn:nth-child(5) { border-top: none; }
      .series-tabs { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <div id="alertBanner" class="alert-banner"></div>

  <div class="admin-header">
    <div class="admin-title">The Great Library -- Admin</div>
    <div class="admin-subtitle">Every metric. One scroll.</div>
    <div class="admin-refresh-info">Auto-refreshes every <span>30s</span> -- Last: <span id="lastRefresh">--</span></div>
    <div class="period-selector" id="periodSelector">
      <button class="period-btn active" data-period="today">Today</button>
      <button class="period-btn" data-period="week">This Week</button>
      <button class="period-btn" data-period="month">This Month</button>
      <button class="period-btn" data-period="year">This Year</button>
      <button class="period-btn" data-period="allTime">All Time</button>
    </div>
  </div>

  <div class="admin-grid" id="dashboard">
    <div class="loading" id="loadingState">The archives open...</div>
  </div>

<script>
(function() {
  var $ = function(sel, ctx) { return (ctx || document).querySelector(sel); };
  var $$ = function(sel, ctx) { return Array.from((ctx || document).querySelectorAll(sel)); };

  var metricsData = null, waitlistData = null, ebooksData = null, accountsData = null, usageData = null, periodsData = null;
  var activePeriod = 'today';
  var activeChartSeries = 'visits';
  var sortState = {};

  // Period selector
  $$('#periodSelector .period-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      $$('#periodSelector .period-btn').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      activePeriod = this.dataset.period;
      render();
    });
  });

  function fetchAll() {
    Promise.all([
      fetch('/api/admin/metrics'),
      fetch('/api/admin/waitlist'),
      fetch('/api/admin/ebooks'),
      fetch('/api/admin/accounts'),
      fetch('/api/admin/usage'),
      fetch('/api/admin/periods')
    ]).then(function(responses) {
      if (responses[0].status === 403 || responses[1].status === 403) {
        window.location.href = '/';
        return;
      }
      return Promise.all(responses.map(function(r) { return r.json(); }));
    }).then(function(data) {
      if (!data) return;
      metricsData = data[0];
      waitlistData = data[1];
      ebooksData = data[2];
      accountsData = data[3];
      usageData = data[4];
      periodsData = data[5];
      render();
      $('#lastRefresh').textContent = new Date().toLocaleTimeString();
    }).catch(function(err) {
      console.error('Dashboard fetch failed:', err);
    });
  }

  function render() {
    if (!metricsData || !waitlistData || !ebooksData) return;
    var d = metricsData, w = waitlistData, e = ebooksData, a = accountsData, u = usageData;
    var grid = $('#dashboard');

    renderAlertBanner(u);

    grid.innerHTML =
      renderPeriodOverview() +
      renderPeriodChart() +
      renderWaitlistOverview(w, d) +
      renderEbookOverview(e) +
      renderAccountsOverview(a) +
      renderProviders(d) +
      renderLlmUsage(u, d) +
      renderSystem(d) +
      renderTraffic(d) +
      renderVisitorFeed(d) +
      renderApiUsage(d) +
      renderCoverStats(d) +
      renderSurveyInsights(w) +
      renderWaitlistTable(w) +
      renderEbookTable(e) +
      renderReferrers(d);

    bindTableSort();
    bindSearch();
    bindExport();
    bindSeriesTabs();
  }

  // --- Alert Banner ---
  function renderAlertBanner(u) {
    var banner = $('#alertBanner');
    if (!u || !u.alerts || u.alerts.length === 0) { banner.classList.remove('active'); return; }
    var latest = u.alerts[u.alerts.length - 1];
    banner.textContent = latest.message;
    banner.className = 'alert-banner active ' + (latest.level === 'critical' ? '' : 'warning');
  }

  // --- Period helpers ---
  var periodLabels = { today: 'Today', week: 'This Week', month: 'This Month', year: 'This Year', allTime: 'All Time' };
  var vsLabels = { today: 'vs yesterday', week: 'vs last week', month: 'vs last month', year: 'vs last year', allTime: '' };

  function trendBadge(current, previous) {
    if (previous === null || previous === undefined) return '';
    if (previous === 0 && current === 0) return '<span class="trend-delta neutral">--</span>';
    if (previous === 0) return '<span class="trend-delta up">+' + current + '</span>';
    var diff = current - previous;
    var pctChange = Math.round((diff / previous) * 100);
    if (diff > 0) return '<span class="trend-delta up">+' + diff + ' (+' + pctChange + '%)</span>';
    if (diff < 0) return '<span class="trend-delta down">' + diff + ' (' + pctChange + '%)</span>';
    return '<span class="trend-delta neutral">0</span>';
  }

  function trendBadgeRate(current, previous, suffix) {
    if (previous === null || previous === undefined) return '';
    var diff = Math.round((current - previous) * 10) / 10;
    if (diff > 0) return '<span class="trend-delta up">+' + diff + (suffix || '') + '</span>';
    if (diff < 0) return '<span class="trend-delta down">' + diff + (suffix || '') + '</span>';
    return '<span class="trend-delta neutral">0' + (suffix || '') + '</span>';
  }

  // --- Period Overview Card ---
  function renderPeriodOverview() {
    if (!periodsData) return '';
    var p = periodsData[activePeriod];
    if (!p) return '';
    var label = periodLabels[activePeriod];
    var vs = vsLabels[activePeriod];

    return '<div class="card card-full">' +
      '<div class="card-title">' + label + ' Overview' + (vs ? ' <span style="font-size:11px;color:#3a3528;text-transform:none;letter-spacing:0;font-style:italic">' + vs + '</span>' : '') + '</div>' +
      '<div class="stat-row">' +
        '<div class="stat"><div class="stat-value">' + p.visits.current + trendBadge(p.visits.current, p.visits.previous) + '</div><div class="stat-label">Page Views</div>' + (p.visits.previous !== null ? '<div class="vs-label">prev: ' + p.visits.previous + '</div>' : '') + '</div>' +
        '<div class="stat"><div class="stat-value">' + p.unique.current + trendBadge(p.unique.current, p.unique.previous) + '</div><div class="stat-label">Unique Visitors</div>' + (p.unique.previous !== null ? '<div class="vs-label">prev: ' + p.unique.previous + '</div>' : '') + '</div>' +
        '<div class="stat"><div class="stat-value">' + p.signups.current + trendBadge(p.signups.current, p.signups.previous) + '</div><div class="stat-label">New Signups</div>' + (p.signups.previous !== null ? '<div class="vs-label">prev: ' + p.signups.previous + '</div>' : '') + '</div>' +
      '</div>' +
      '<div class="stat-row">' +
        '<div class="stat"><div class="stat-value small success">' + p.ebooksGenerated.current + trendBadge(p.ebooksGenerated.current, p.ebooksGenerated.previous) + '</div><div class="stat-label">Ebooks Completed</div></div>' +
        '<div class="stat"><div class="stat-value small danger">' + p.ebooksFailed.current + trendBadge(p.ebooksFailed.current, p.ebooksFailed.previous) + '</div><div class="stat-label">Ebooks Failed</div></div>' +
        '<div class="stat"><div class="stat-value small">' + p.conversionRate.current + '%' + trendBadgeRate(p.conversionRate.current, p.conversionRate.previous, '%') + '</div><div class="stat-label">Conversion Rate</div></div>' +
        '<div class="stat"><div class="stat-value small">' + p.surveyRate.current + '%' + trendBadgeRate(p.surveyRate.current, p.surveyRate.previous, '%') + '</div><div class="stat-label">Survey Rate</div></div>' +
      '</div>' +
      '<div class="stat-row">' +
        '<div class="stat"><div class="stat-value small">' + p.apiCalls.current + trendBadge(p.apiCalls.current, p.apiCalls.previous) + '</div><div class="stat-label">API Calls</div></div>' +
        '<div class="stat"><div class="stat-value small' + (p.errors.current > 0 ? ' danger' : '') + '">' + p.errors.current + trendBadge(p.errors.current, p.errors.previous) + '</div><div class="stat-label">Errors</div></div>' +
      '</div>' +
    '</div>';
  }

  // --- Period Chart Card ---
  function renderPeriodChart() {
    if (!periodsData) return '';
    var p = periodsData[activePeriod];
    if (!p || !p.bars || p.bars.length === 0) return '';

    var seriesOptions = [
      { key: 'visits', label: 'Visits', color: '#5a5038' },
      { key: 'unique', label: 'Unique', color: '#4a6040' },
      { key: 'signups', label: 'Signups', color: '#6a8a4a' },
      { key: 'ebooks', label: 'Ebooks', color: '#8a7d55' },
      { key: 'errors', label: 'Errors', color: '#7a4a4a' }
    ];

    var currentSeries = seriesOptions.find(function(s) { return s.key === activeChartSeries; }) || seriesOptions[0];

  function renderLlmUsage(u, d) {
    if (!u) return '';
    var today = u.today || {};
    var allTime = u.allTime || {};
    var todayBars = '';
    var providerConfigs = { gemini: { label: 'Gemini', tokenLimit: 1000000 }, openai: { label: 'OpenAI', tokenLimit: 2500000 }, openrouter: { label: 'OpenRouter', tokenLimit: null } };
    for (var prov in providerConfigs) {
      var config = providerConfigs[prov];
      var usage = today[prov];
      if (!usage && !allTime[prov]) continue;
      var calls = usage ? usage.calls : 0, tokens = usage ? usage.tokens : 0, errors = usage ? usage.errors : 0;
      var avgLatency = usage && usage.calls > 0 ? Math.round(usage.latencyMs / usage.calls) : 0;
      var atCalls = allTime[prov] ? allTime[prov].calls : 0, atTokens = allTime[prov] ? allTime[prov].tokens : 0, atErrors = allTime[prov] ? allTime[prov].errors : 0;
      var tokenBar = '';
      if (config.tokenLimit) {
        var pct = Math.min(100, Math.round(tokens / config.tokenLimit * 100));
        var barColor = pct > 90 ? 'red' : pct > 70 ? 'yellow' : 'green';
        tokenBar = '<div class="usage-bar-wrap"><div class="usage-bar-header"><span class="usage-bar-label">Tokens today</span><span class="usage-bar-value">' + fmtNum(tokens) + ' / ' + fmtNum(config.tokenLimit) + '</span></div><div class="usage-bar-track"><div class="usage-bar-fill ' + barColor + '" style="width:' + pct + '%"></div></div></div>';
      }
      todayBars += '<div style="margin-bottom:16px;"><div style="color:#8a7d55;font-size:13px;font-weight:bold;margin-bottom:8px;">' + config.label + '</div><div class="stat-row" style="margin-bottom:8px;"><div class="stat"><div class="stat-value small">' + calls + '</div><div class="stat-label">Calls today</div></div><div class="stat"><div class="stat-value small">' + fmtNum(tokens) + '</div><div class="stat-label">Tokens today</div></div><div class="stat"><div class="stat-value small' + (errors > 0 ? ' danger' : '') + '">' + errors + '</div><div class="stat-label">Errors today</div></div><div class="stat"><div class="stat-value small">' + avgLatency + 'ms</div><div class="stat-label">Avg latency</div></div></div>' + tokenBar + '<div style="font-size:11px;color:#3a3528;margin-top:4px;">All time: ' + fmtNum(atCalls) + ' calls, ' + fmtNum(atTokens) + ' tokens, ' + atErrors + ' errors</div></div>';
    }
    var last7 = (u.last7Days || []).slice().reverse();
    var chartHtml = '';
    if (last7.length > 0) {
      var maxCalls = Math.max.apply(null, last7.map(function(dy) { var t = 0; for (var pp in (dy.usage || {})) t += (dy.usage[pp].calls || 0); return t; }).concat([1]));
      chartHtml = '<div style="margin-top:16px;"><div style="color:#5a5038;font-size:12px;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px">Last 7 Days (API Calls)</div>' + last7.map(function(day) { var t = 0; for (var pp in (day.usage || {})) t += (day.usage[pp].calls || 0); return '<div class="bar-item"><div class="bar-label" style="min-width:50px">' + day.date.slice(5) + '</div><div class="bar-track"><div class="bar-fill" style="width:' + Math.round(t / maxCalls * 100) + '%"></div></div><div class="bar-count">' + t + '</div></div>'; }).join('') + '</div>';
    }
    var alertsHtml = '';
    if (u.alerts && u.alerts.length > 0) {
      alertsHtml = '<div style="margin-top:16px;"><div style="color:#7a4a4a;font-size:12px;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px">Budget Alerts</div>' + u.alerts.slice(-5).reverse().map(function(a) { return '<div style="font-size:12px;color:' + (a.level === 'critical' ? '#9a5a5a' : '#b8a86a') + ';padding:4px 0;border-bottom:1px solid #0f0e0c;">' + formatTime(a.timestamp) + ' -- ' + escHtml(a.message) + '</div>'; }).join('') + '</div>';
    }
    return '<div class="card card-full"><div class="card-title">LLM Usage & Budget</div>' + (todayBars || '<div class="empty-state">No LLM calls tracked yet.</div>') + chartHtml + alertsHtml + '</div>';
  }

    var rows = jobs.map(function(j) {
      var sc = j.status === 'ready' ? 'tag-ready' : j.status === 'generating' ? 'tag-generating' : 'tag-failed';
      return '<tr><td title="' + escHtml(j.title || '') + '">' + escHtml(j.title || '--') + '</td><td><span class="tag ' + sc + '">' + j.status + '</span></td><td>' + (j.chapters || '--') + '</td><td>' + (j.durationHuman || '--') + '</td><td>' + formatTime(j.generatedAt) + '</td><td title="' + (j.error ? escHtml(j.error) : '') + '">' + (j.error ? escHtml(j.error) : '--') + '</td></tr>';
    }).join('');
    return '<div class="card card-full"><div class="card-title">Ebook History (' + jobs.length + ')<button class="btn-export" data-export="ebooks">Export JSON</button></div><input class="search-input" type="text" placeholder="Search titles..." data-search="ebook-table"><div class="data-table-wrap"><table class="data-table" id="ebook-table" style="table-layout:fixed;"><colgroup><col style="width:30%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:20%"><col style="width:20%"></colgroup><thead><tr><th data-sort="0">Title</th><th data-sort="1">Status</th><th data-sort="2">Chapters</th><th data-sort="3">Duration</th><th data-sort="4">Date</th><th data-sort="5">Error</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }

  function renderReferrers(d) {
    var refs = Object.entries(d.referrers || {}).sort(function(a, b) { return b[1] - a[1]; });
    if (refs.length === 0) return '<div class="card"><div class="card-title">Referrers</div><div class="empty-state">No external referrers yet.</div></div>';
    var maxRef = refs[0][1];
    var bars = refs.slice(0, 15).map(function(e) { return '<div class="bar-item"><div class="bar-label" style="min-width:140px">' + escHtml(e[0]) + '</div><div class="bar-track"><div class="bar-fill" style="width:' + Math.round(e[1] / maxRef * 100) + '%"></div></div><div class="bar-count">' + e[1] + '</div></div>'; }).join('');
    return '<div class="card"><div class="card-title">Referrers</div><div class="bar-group">' + bars + '</div></div>';
  }

  // --- Helpers ---
  function formatTime(iso) {
    if (!iso) return '--';
    try { var d = new Date(iso); return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }); } catch(e) { return iso; }
  }
  function escHtml(s) { if (!s) return ''; return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function tryHostname(url) { try { return new URL(url).hostname; } catch(e) { return url; } }
  function fmtNum(n) { if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M'; if (n >= 1000) return (n / 1000).toFixed(1) + 'K'; return String(n); }
  function countryFlag(code) { if (!code || code.length !== 2) return ''; return String.fromCodePoint.apply(null, code.toUpperCase().split('').map(function(c) { return c.charCodeAt(0) + 127397; })); }

  // --- Table sorting ---
  function bindTableSort() {
    $$('.data-table th[data-sort]').forEach(function(th) {
      th.addEventListener('click', function() {
        var table = this.closest('table'), colIdx = parseInt(this.dataset.sort), tableId = table.id;
        var state = sortState[tableId] || { col: -1, asc: true };
        state.asc = state.col === colIdx ? !state.asc : true;
        state.col = colIdx;
        sortState[tableId] = state;
        var tbody = table.querySelector('tbody');
        var rows = Array.from(tbody.querySelectorAll('tr'));
        rows.sort(function(a, b) { var at = (a.children[colIdx] || {}).textContent || '', bt = (b.children[colIdx] || {}).textContent || ''; return (state.asc ? 1 : -1) * at.localeCompare(bt, undefined, { numeric: true }); });
        rows.forEach(function(r) { tbody.appendChild(r); });
      });
    });
  }

  function bindSearch() {
    $$('.search-input[data-search]').forEach(function(input) {
      input.addEventListener('input', function() {
        var tableId = this.dataset.search, query = this.value.toLowerCase();
        $$('#' + tableId + ' tbody tr').forEach(function(r) { r.style.display = r.textContent.toLowerCase().indexOf(query) >= 0 ? '' : 'none'; });
      });
    });
  }

  function bindExport() {
    $$('.btn-export[data-export]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var type = this.dataset.export, data, filename;
        if (type === 'waitlist') { data = waitlistData; filename = 'waitlist-export.json'; }
        else if (type === 'ebooks') { data = ebooksData; filename = 'ebooks-export.json'; }
        else { data = metricsData; filename = 'metrics-export.json'; }
        var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
      });
    });
  }

  // --- Init ---
  fetchAll();
  setInterval(fetchAll, 30000);
})();
</script>
</body>
</html>
