<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Great Library -- Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; min-height: 100vh;
      background: #0a0a0a;
      font-family: Georgia, 'Times New Roman', serif;
      color: #c8b88a;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    body::-webkit-scrollbar { display: none; }

    .admin-header {
      text-align: center;
      padding: 40px 20px 20px;
      border-bottom: 1px solid #1a1814;
      position: relative;
    }
    .admin-title { font-size: 28px; font-weight: normal; color: #c8b88a; letter-spacing: 2px; }
    .admin-subtitle { font-size: 13px; color: #4a4030; margin-top: 8px; font-style: italic; }
    .admin-refresh-info { font-size: 11px; color: #3a3528; margin-top: 12px; }
    .admin-refresh-info span { color: #5a5038; }

    /* Live visitors badge in header */
    .live-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(90, 122, 74, 0.1); border: 1px solid rgba(90, 122, 74, 0.25);
      border-radius: 20px; padding: 4px 14px; margin-top: 12px;
      font-size: 13px; color: #6a9a5a;
    }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #5a7a4a; animation: pulse-anim 2s ease-in-out infinite; }

    /* Budget alert banner */
    .alert-banner {
      background: rgba(122, 74, 74, 0.15);
      border: 1px solid rgba(154, 90, 90, 0.3);
      color: #c87a7a;
      padding: 12px 20px;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    .alert-banner.active { display: block; }
    .alert-banner.warning { background: rgba(138, 125, 85, 0.15); border-color: rgba(184, 168, 106, 0.3); color: #c8b06a; }

    .admin-grid {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 20px 60px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 20px;
    }

    .card {
      background: #0f0e0c;
      border: 1px solid #1a1814;
      border-radius: 8px;
      padding: 24px;
      transition: border-color 0.3s;
      overflow: hidden;
    }
    .card:hover { border-color: #2a2520; }
    .card-full { grid-column: 1 / -1; }

    .card-title {
      font-size: 14px;
      color: #6a6050;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1a1814;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-title-left { display: flex; align-items: center; gap: 0; }

    .section-label {
      font-size: 12px; color: #5a5038; text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 8px;
    }

    .stat-row { display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 16px; }
    .stat-row:last-child { margin-bottom: 0; }
    .stat { flex: 1; min-width: 80px; }
    .stat-value { font-size: 32px; color: #c8b88a; line-height: 1.2; }
    .stat-value.accent { color: #8a7d55; }
    .stat-value.success { color: #5a7a4a; }
    .stat-value.danger { color: #7a4a4a; }
    .stat-value.small { font-size: 20px; }
    .stat-value.live { color: #6a9a5a; }
    .stat-label { font-size: 12px; color: #4a4030; margin-top: 4px; }

    .bar-group { margin-top: 16px; }
    .bar-item { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .bar-label { font-size: 12px; color: #6a6050; min-width: 80px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { flex: 1; height: 18px; background: #141210; border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #3a3528, #5a5038); border-radius: 3px; transition: width 0.6s ease; min-width: 2px; }
    .bar-fill.green { background: linear-gradient(90deg, #2a4a28, #3a6a3a); }
    .bar-fill.blue { background: linear-gradient(90deg, #28364a, #3a5a7a); }
    .bar-fill.orange { background: linear-gradient(90deg, #4a3a28, #7a5a3a); }
    .bar-fill.red { background: linear-gradient(90deg, #4a2828, #7a3a3a); }
    .bar-count { font-size: 12px; color: #5a5038; min-width: 36px; }

    /* Provider cards */
    .provider-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
    .provider-card {
      background: #121110;
      border: 1px solid #1a1814;
      border-radius: 6px;
      padding: 14px;
      position: relative;
    }
    .provider-card.active-provider { border-color: #5a7a4a; }
    .provider-card.not-configured { opacity: 0.4; }
    .provider-name { font-size: 14px; color: #c8b88a; margin-bottom: 6px; font-weight: bold; }
    .provider-badge {
      position: absolute;
      top: 8px; right: 8px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .provider-badge.active { background: rgba(90, 122, 74, 0.3); color: #6a9a5a; }
    .provider-badge.configured { background: rgba(138, 125, 85, 0.2); color: #8a7d55; }
    .provider-badge.off { background: rgba(80, 70, 60, 0.2); color: #4a4030; }
    .provider-detail { font-size: 11px; color: #5a5038; margin-top: 3px; }

    /* Visitor feed */
    .visitor-feed { max-height: 500px; overflow-y: auto; -ms-overflow-style: none; scrollbar-width: none; }
    .visitor-feed::-webkit-scrollbar { display: none; }
    .visitor-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid #0f0e0c;
      font-size: 12px;
    }
    .visitor-item:last-child { border-bottom: none; }
    .visitor-dot { width: 6px; height: 6px; border-radius: 50%; background: #3a3528; flex-shrink: 0; }
    .visitor-dot.recent { background: #5a7a4a; animation: pulse-anim 2s ease-in-out infinite; }
    .visitor-page { color: #8a7d55; min-width: 60px; }
    .visitor-geo { color: #5a5038; flex: 1; }
    .visitor-time { color: #3a3528; white-space: nowrap; }
    .visitor-device { color: #4a4030; font-size: 11px; }
    .visitor-source-tag { font-size: 10px; padding: 1px 6px; border-radius: 8px; }
    .visitor-source-tag.search { background: rgba(58, 90, 122, 0.2); color: #5a8aaa; }
    .visitor-source-tag.social { background: rgba(122, 74, 104, 0.2); color: #aa5a8a; }
    .visitor-source-tag.referral { background: rgba(122, 100, 58, 0.2); color: #aa8a5a; }
    .visitor-source-tag.direct { background: rgba(80, 80, 80, 0.15); color: #6a6a6a; }
    .visitor-returning { font-size: 10px; color: #5a7a4a; }

    /* Usage progress bars */
    .usage-bar-wrap { margin-bottom: 12px; }
    .usage-bar-header { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
    .usage-bar-label { color: #6a6050; }
    .usage-bar-value { color: #8a8070; }
    .usage-bar-track { height: 10px; background: #141210; border-radius: 5px; overflow: hidden; }
    .usage-bar-fill { height: 100%; border-radius: 5px; transition: width 0.6s ease; }
    .usage-bar-fill.green { background: linear-gradient(90deg, #2a4a28, #3a6a3a); }
    .usage-bar-fill.yellow { background: linear-gradient(90deg, #5a4a28, #7a6a3a); }
    .usage-bar-fill.red { background: linear-gradient(90deg, #5a2828, #7a3a3a); }

    /* Mini chart (CSS-only bar chart for daily trends) */
    .mini-chart { display: flex; align-items: flex-end; gap: 2px; height: 80px; margin-top: 8px; }
    .mini-chart-bar {
      flex: 1; min-width: 4px; border-radius: 2px 2px 0 0;
      background: linear-gradient(180deg, #5a5038, #3a3528);
      transition: height 0.4s ease; position: relative; cursor: default;
    }
    .mini-chart-bar:hover { background: linear-gradient(180deg, #8a7d55, #5a5038); }
    .mini-chart-bar .tooltip {
      display: none; position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
      background: #1a1814; border: 1px solid #2a2520; border-radius: 4px; padding: 4px 8px;
      font-size: 10px; color: #c8b88a; white-space: nowrap; z-index: 10; pointer-events: none;
    }
    .mini-chart-bar:hover .tooltip { display: block; }

    /* Heatmap grid */
    .heatmap { display: grid; grid-template-columns: 40px repeat(7, 1fr); gap: 2px; margin-top: 8px; }
    .heatmap-cell {
      aspect-ratio: 1; border-radius: 3px; position: relative; cursor: default;
      transition: background 0.3s;
    }
    .heatmap-cell .tooltip {
      display: none; position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%);
      background: #1a1814; border: 1px solid #2a2520; border-radius: 4px; padding: 3px 6px;
      font-size: 9px; color: #c8b88a; white-space: nowrap; z-index: 10; pointer-events: none;
    }
    .heatmap-cell:hover .tooltip { display: block; }
    .heatmap-label { font-size: 10px; color: #3a3528; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; }
    .heatmap-header { font-size: 10px; color: #3a3528; text-align: center; padding: 2px 0; }

    /* Funnel */
    .funnel { margin-top: 12px; }
    .funnel-step { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .funnel-bar-wrap { flex: 1; position: relative; }
    .funnel-bar {
      height: 32px; border-radius: 4px; display: flex; align-items: center; padding: 0 12px;
      font-size: 12px; color: #c8b88a; transition: width 0.6s ease;
    }
    .funnel-label { font-size: 12px; color: #6a6050; min-width: 120px; text-align: right; }
    .funnel-pct { font-size: 11px; color: #3a3528; min-width: 40px; }

    /* Data table */
    .data-table-wrap {
      overflow-x: auto; margin-top: 12px;
      -ms-overflow-style: none; scrollbar-width: none;
    }
    .data-table-wrap::-webkit-scrollbar { display: none; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
    .data-table th {
      text-align: left; padding: 8px 12px; color: #5a5038; font-weight: normal;
      font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
      border-bottom: 1px solid #1a1814; cursor: pointer; user-select: none; white-space: nowrap;
    }
    .data-table th:hover { color: #8a7d55; }
    .data-table td {
      padding: 8px 12px; border-bottom: 1px solid #0f0e0c; color: #8a8070;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .data-table tr:hover td { background: #121110; }

    .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
    .tag-ready { background: rgba(90, 122, 74, 0.2); color: #6a9a5a; }
    .tag-generating { background: rgba(138, 125, 85, 0.2); color: #b8a86a; }
    .tag-failed { background: rgba(122, 74, 74, 0.2); color: #9a5a5a; }
    .tag-yes { background: rgba(90, 122, 74, 0.15); color: #6a9a5a; }
    .tag-no { background: rgba(122, 74, 74, 0.15); color: #7a5a5a; }

    .search-input {
      width: 100%; background: #141210; border: 1px solid #1a1814; border-radius: 4px;
      padding: 8px 12px; color: #c8b88a; font-family: Georgia, serif; font-size: 13px;
      outline: none; margin-bottom: 12px; transition: border-color 0.3s;
    }
    .search-input::placeholder { color: #3a3528; }
    .search-input:focus { border-color: #3a3528; }

    .btn-export {
      background: rgba(180, 160, 100, 0.06); border: 1px solid #1a1814; border-radius: 4px;
      color: #5a5038; font-family: Georgia, serif; font-size: 12px; padding: 6px 14px;
      cursor: pointer; transition: background 0.3s, border-color 0.3s, color 0.3s;
    }
    .btn-export:hover { background: rgba(180, 160, 100, 0.12); border-color: #2a2520; color: #8a7d55; }

    .sys-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #0f0e0c; }
    .sys-row:last-child { border-bottom: none; }
    .sys-label { font-size: 13px; color: #5a5038; }
    .sys-value { font-size: 13px; color: #8a8070; }

    .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #5a7a4a; margin-right: 6px; animation: pulse-anim 2s ease-in-out infinite; }
    .pulse.warn { background: #8a7d55; }
    .pulse.danger { background: #7a4a4a; }
    @keyframes pulse-anim { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .loading { text-align: center; padding: 40px; color: #3a3528; font-style: italic; }
    .empty-state { text-align: center; padding: 20px; color: #2a2520; font-style: italic; font-size: 13px; }

    /* Two-col grid inside cards */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

    /* Error log */
    .error-item { padding: 6px 0; border-bottom: 1px solid #0f0e0c; font-size: 12px; }
    .error-item:last-child { border-bottom: none; }
    .error-status { display: inline-block; min-width: 30px; color: #9a5a5a; font-weight: bold; }
    .error-context { color: #6a6050; }
    .error-time { color: #3a3528; float: right; }

    @media (max-width: 720px) {
      .admin-grid { grid-template-columns: 1fr; padding: 16px 12px 40px; }
      .card { padding: 18px; }
      .stat-value { font-size: 24px; }
      .stat-row { gap: 16px; }
      .card-full { grid-column: 1; }
      .provider-grid { grid-template-columns: 1fr; }
      .two-col { grid-template-columns: 1fr; }
      .funnel-label { min-width: 80px; font-size: 11px; }
      .heatmap { grid-template-columns: 30px repeat(7, 1fr); }
    }
  </style>
</head>
<body>

  <div id="alertBanner" class="alert-banner"></div>

  <div class="admin-header">
    <div class="admin-title">The Great Library -- Admin</div>
    <div class="admin-subtitle">Every metric. One scroll.</div>
    <div class="live-badge"><span class="live-dot"></span> <span id="liveCount">--</span> live now</div>
    <div class="admin-refresh-info">Auto-refreshes every <span>15s</span> -- Last: <span id="lastRefresh">--</span></div>
  </div>

  <div class="admin-grid" id="dashboard">
    <div class="loading" id="loadingState">The archives open...</div>
  </div>

<script>
(function() {
  const $ = (sel, ctx) => (ctx || document).querySelector(sel);
  const $$ = (sel, ctx) => [...(ctx || document).querySelectorAll(sel)];

  let metricsData = null;
  let waitlistData = null;
  let ebooksData = null;
  let accountsData = null;
  let usageData = null;
  let analyticsData = null;
  let sortState = {};

  async function fetchAll() {
    try {
      const [mRes, wRes, eRes, aRes, uRes, anRes] = await Promise.all([
        fetch('/api/admin/metrics'),
        fetch('/api/admin/waitlist'),
        fetch('/api/admin/ebooks'),
        fetch('/api/admin/accounts'),
        fetch('/api/admin/usage'),
        fetch('/api/admin/analytics')
      ]);
      if (mRes.status === 403 || wRes.status === 403) {
        window.location.href = '/';
        return;
      }
      metricsData = await mRes.json();
      waitlistData = await wRes.json();
      ebooksData = await eRes.json();
      accountsData = await aRes.json();
      usageData = await uRes.json();
      analyticsData = await anRes.json();
      render();
      $('#lastRefresh').textContent = new Date().toLocaleTimeString();
    } catch (err) {
      console.error('Dashboard fetch failed:', err);
    }
  }

  function render() {
    if (!metricsData || !waitlistData || !ebooksData) return;
    const d = metricsData;
    const w = waitlistData;
    const e = ebooksData;
    const a = accountsData;
    const u = usageData;
    const an = analyticsData || {};
    const grid = $('#dashboard');

    renderAlertBanner(u);
    $('#liveCount').textContent = an.liveVisitors || 0;

    grid.innerHTML = `
      ${renderRealtimeOverview(an, d)}
      ${renderWaitlistOverview(w, d)}
      ${renderEbookOverview(e)}
      ${renderRetention(an)}
      ${renderTrafficSources(an)}
      ${renderDevicesAndBrowsers(an)}
      ${renderDailyTrends(an)}
      ${renderConversionFunnel(an, w)}
      ${renderGeography(an)}
      ${renderHeatmap(an)}
      ${renderVisitorFeed(d)}
      ${renderProviders(d)}
      ${renderLlmUsage(u, d)}
      ${renderAccountsOverview(a)}
      ${renderSystem(d)}
      ${renderApiUsage(d)}
      ${renderCoverStats(d)}
      ${renderErrorLog(an)}
      ${renderSignupTrend(w)}
      ${renderSurveyInsights(w)}
      ${renderUtmCampaigns(w)}
      ${renderWaitlistTable(w)}
      ${renderEbookTable(e)}
      ${renderReferrers(d)}
    `;
    bindTableSort();
    bindSearch();
    bindExport();
  }

  // --- ALERT BANNER ---

  function renderAlertBanner(u) {
    const banner = $('#alertBanner');
    if (!u || !u.alerts || u.alerts.length === 0) {
      banner.classList.remove('active');
      return;
    }
    const latest = u.alerts[u.alerts.length - 1];
    banner.textContent = latest.message;
    banner.className = 'alert-banner active ' + (latest.level === 'critical' ? '' : 'warning');
  }

  // --- REAL-TIME OVERVIEW ---

  function renderRealtimeOverview(an, d) {
    return `
    <div class="card card-full">
      <div class="card-title"><span class="card-title-left"><span class="pulse"></span>Real-Time Overview</span></div>
      <div class="stat-row">
        <div class="stat"><div class="stat-value live">${an.liveVisitors || 0}</div><div class="stat-label"><span class="pulse"></span>Active now (5 min)</div></div>
        <div class="stat"><div class="stat-value">${an.uniqueTotal || 0}</div><div class="stat-label">Unique visitors (all time)</div></div>
        <div class="stat"><div class="stat-value accent">${an.totalHits || 0}</div><div class="stat-label">Total page views</div></div>
        <div class="stat"><div class="stat-value small">${d.system?.activeSessions || 0}</div><div class="stat-label">Chat sessions</div></div>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="stat-value small">${d.pageVisits?.waitlist || 0}</div><div class="stat-label">Waitlist page</div></div>
        <div class="stat"><div class="stat-value small">${d.pageVisits?.library || 0}</div><div class="stat-label">Library page</div></div>
        <div class="stat"><div class="stat-value small">${d.pageVisits?.tomes || 0}</div><div class="stat-label">Tomes page</div></div>
        <div class="stat"><div class="stat-value small">${d.pageVisits?.legal || 0}</div><div class="stat-label">Legal pages</div></div>
        <div class="stat"><div class="stat-value small">${d.pageVisits?.admin || 0}</div><div class="stat-label">Admin page</div></div>
      </div>
    </div>`;
  }

  // --- WAITLIST ---

  function renderWaitlistOverview(w, d) {
    const convRate = d.pageVisits?.waitlist > 0
      ? Math.round(w.total / d.pageVisits.waitlist * 100) : 0;
    const surveyRate = w.surveyStats.completionRate;
    return `
    <div class="card">
      <div class="card-title">Waitlist</div>
      <div class="stat-row">
        <div class="stat"><div class="stat-value">${w.total}</div><div class="stat-label">Total signups</div></div>
        <div class="stat"><div class="stat-value accent">${w.rate.today}</div><div class="stat-label">Today</div></div>
        <div class="stat"><div class="stat-value accent">${w.rate.thisWeek}</div><div class="stat-label">This week</div></div>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="stat-value small">${convRate}%</div><div class="stat-label">Visit-to-signup</div></div>
        <div class="stat"><div class="stat-value small">${surveyRate}%</div><div class="stat-label">Survey completion</div></div>
        <div class="stat"><div class="stat-value small">${w.surveyStats.completed}</div><div class="stat-label">Surveys done</div></div>
      </div>
    </div>`;
  }

  // --- EBOOK GENERATION ---

  function renderEbookOverview(e) {
    return `
    <div class="card">
      <div class="card-title">Ebook Generation</div>
      <div class="stat-row">
        <div class="stat"><div class="stat-value">${e.completed}</div><div class="stat-label">Completed</div></div>
        <div class="stat"><div class="stat-value${e.active > 0 ? ' accent' : ''}">${e.active}</div><div class="stat-label">${e.active > 0 ? '<span class="pulse warn"></span>' : ''}In progress</div></div>
        <div class="stat"><div class="stat-value danger">${e.failed}</div><div class="stat-label">Failed</div></div>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="stat-value small">${e.avgDurationSeconds}s</div><div class="stat-label">Avg gen time</div></div>
        <div class="stat"><div class="stat-value small">${e.successRate}%</div><div class="stat-label">Success rate</div></div>
        <div class="stat"><div class="stat-value small">${e.total}</div><div class="stat-label">Total attempts</div></div>
      </div>
    </div>`;
  }

  // --- RETENTION ---

  function renderRetention(an) {
    const total = (an.newVisitors || 0) + (an.returningVisitors || 0);
    const retRate = total > 0 ? Math.round(an.returningVisitors / total * 100) : 0;
    const newPct = total > 0 ? Math.round(an.newVisitors / total * 100) : 0;
    return `
    <div class="card">
      <div class="card-title">Retention</div>
      <div class="stat-row">
        <div class="stat"><div class="stat-value success small">${an.newVisitors || 0}</div><div class="stat-label">New visitors</div></div>
        <div class="stat"><div class="stat-value accent small">${an.returningVisitors || 0}</div><div class="stat-label">Returning</div></div>
        <div class="stat"><div class="stat-value small">${an.bounceRate || 0}%</div><div class="stat-label">Bounce rate</div></div>
      </div>
      <div style="margin-top:12px;">
        <div class="usage-bar-wrap">
          <div class="usage-bar-header">
            <span class="usage-bar-label">New vs returning</span>
            <span class="usage-bar-value">${newPct}% new / ${retRate}% returning</span>
          </div>
          <div class="usage-bar-track" style="display:flex;overflow:hidden;border-radius:5px;">
            <div style="height:10px;background:linear-gradient(90deg,#2a4a28,#3a6a3a);width:${newPct}%;border-radius:5px 0 0 5px;transition:width 0.6s"></div>
            <div style="height:10px;background:linear-gradient(90deg,#4a3a28,#6a5a38);width:${retRate}%;border-radius:0 5px 5px 0;transition:width 0.6s"></div>
          </div>
        </div>
      </div>
    </div>`;
  }

  // --- TRAFFIC SOURCES ---

  function renderTrafficSources(an) {
    const src = an.trafficSources || { direct: 0, search: 0, social: 0, referral: 0 };
    const total = src.direct + src.search + src.social + src.referral;
    if (total === 0) {
      return `<div class="card"><div class="card-title">Traffic Sources</div><div class="empty-state">No traffic data yet.</div></div>`;
    }
    const items = [
      { label: 'Direct', count: src.direct, color: '#5a5038' },
      { label: 'Search', count: src.search, color: '#3a5a7a' },
      { label: 'Social', count: src.social, color: '#7a4a6a' },
      { label: 'Referral', count: src.referral, color: '#6a5a3a' }
    ].sort((a, b) => b.count - a.count);
    const maxSrc = items[0].count || 1;

    return `
    <div class="card">
      <div class="card-title">Traffic Sources</div>
      ${items.map(item => {
        const pct = Math.round(item.count / total * 100);
        return `<div class="bar-item">
          <div class="bar-label" style="min-width:60px">${item.label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(item.count / maxSrc * 100)}%;background:${item.color}"></div></div>
          <div class="bar-count">${item.count} (${pct}%)</div>
        </div>`;
      }).join('')}
    </div>`;
  }

  // --- DEVICES & BROWSERS ---

  function renderDevicesAndBrowsers(an) {
    const dev = an.devices || { mobile: 0, desktop: 0, tablet: 0 };
    const totalDev = dev.mobile + dev.desktop + (dev.tablet || 0);
    const browsers = an.browsers || [];
    const maxBrowser = browsers.length > 0 ? browsers[0][1] : 1;

    let deviceBars = '';
    if (totalDev > 0) {
      const devItems = [
        { label: 'Desktop', count: dev.desktop },
        { label: 'Mobile', count: dev.mobile },
        { label: 'Tablet', count: dev.tablet || 0 }
      ].filter(d => d.count > 0).sort((a, b) => b.count - a.count);
      const maxDev = devItems[0]?.count || 1;
      deviceBars = devItems.map(item => `
        <div class="bar-item">
          <div class="bar-label" style="min-width:60px">${item.label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(item.count / maxDev * 100)}%"></div></div>
          <div class="bar-count">${item.count} (${Math.round(item.count / totalDev * 100)}%)</div>
        </div>
      `).join('');
    }

    let browserBars = browsers.slice(0, 6).map(([name, count]) => `
      <div class="bar-item">
        <div class="bar-label" style="min-width:60px">${name}</div>
        <div class="bar-track"><div class="bar-fill blue" style="width:${Math.round(count / maxBrowser * 100)}%"></div></div>
        <div class="bar-count">${count}</div>
      </div>
    `).join('');

    return `
    <div class="card card-full">
      <div class="card-title">Devices & Browsers</div>
      <div class="two-col">
        <div>
          <div class="section-label">Device Breakdown</div>
          ${deviceBars || '<div class="empty-state">No data yet.</div>'}
        </div>
        <div>
          <div class="section-label">Browser Breakdown</div>
          ${browserBars || '<div class="empty-state">No data yet.</div>'}
        </div>
      </div>
    </div>`;
  }

  // --- DAILY TRENDS (30-day chart) ---

  function renderDailyTrends(an) {
    const trends = an.dailyTrends || [];
    if (trends.length === 0) {
      return `<div class="card card-full"><div class="card-title">Daily Trends</div><div class="empty-state">No trend data yet.</div></div>`;
    }
    const maxTotal = Math.max(...trends.map(t => t.total), 1);

    const bars = trends.map(t => {
      const h = Math.max(2, Math.round(t.total / maxTotal * 100));
      const label = t.date.slice(5);
      return `<div class="mini-chart-bar" style="height:${h}%">
        <div class="tooltip">${label}: ${t.total} views, ${t.unique} unique, ${t.signups} signups</div>
      </div>`;
    }).join('');

    const totalViews = trends.reduce((s, t) => s + t.total, 0);
    const totalUnique = trends.reduce((s, t) => s + t.unique, 0);
    const totalSignups = trends.reduce((s, t) => s + t.signups, 0);
    const avgDaily = Math.round(totalViews / trends.length);

    return `
    <div class="card card-full">
      <div class="card-title">Daily Trends (30 Days)</div>
      <div class="stat-row">
        <div class="stat"><div class="stat-value small">${totalViews}</div><div class="stat-label">Total views</div></div>
        <div class="stat"><div class="stat-value small">${totalUnique}</div><div class="stat-label">Total unique</div></div>
        <div class="stat"><div class="stat-value small">${avgDaily}</div><div class="stat-label">Avg daily views</div></div>
        <div class="stat"><div class="stat-value small">${totalSignups}</div><div class="stat-label">Total signups</div></div>
      </div>
      <div class="section-label" style="margin-top:16px">Page Views Per Day</div>
      <div class="mini-chart">${bars}</div>
    </div>`;
  }

  // --- CONVERSION FUNNEL ---

  function renderConversionFunnel(an) {
    const f = an.funnel || {};
    const steps = [
      { label: 'Page view', count: f.pageView || 0, color: '#3a3528' },
      { label: 'Email focus', count: f.emailFocus || 0, color: '#3a4530' },
      { label: 'Signup', count: f.emailSubmit || 0, color: '#3a5530' },
      { label: 'Survey done', count: f.surveyComplete || 0, color: '#3a6530' }
    ];
    const maxCount = steps[0].count || 1;

    if (maxCount === 0) {
      return `<div class="card"><div class="card-title">Conversion Funnel</div><div class="empty-state">No funnel data yet.</div></div>`;
    }

    const funnelSteps = steps.map((step, i) => {
      const pct = Math.max(5, Math.round(step.count / maxCount * 100));
      const dropoff = i > 0 && steps[i - 1].count > 0
        ? Math.round((1 - step.count / steps[i - 1].count) * 100) + '% drop'
        : '';
      return `<div class="funnel-step">
        <div class="funnel-label">${step.label}</div>
        <div class="funnel-bar-wrap"><div class="funnel-bar" style="width:${pct}%;background:${step.color}">${step.count}</div></div>
        <div class="funnel-pct">${dropoff}</div>
      </div>`;
    }).join('');

    return `
    <div class="card">
      <div class="card-title">Conversion Funnel</div>
      <div class="funnel">${funnelSteps}</div>
    </div>`;
  }

  // --- GEOGRAPHY ---

  function renderGeography(an) {
    const countries = an.topCountries || [];
    const cities = an.topCities || [];

    if (countries.length === 0 && cities.length === 0) {
      return `<div class="card card-full"><div class="card-title">Geography</div><div class="empty-state">No geographic data yet. Country/city data comes from proxy headers (Cloudflare/Railway).</div></div>`;
    }

    const maxCountry = countries.length > 0 ? countries[0][1] : 1;
    const countryBars = countries.map(([country, count]) => `
      <div class="bar-item">
        <div class="bar-label" style="min-width:80px">${countryFlag(country)} ${country}</div>
        <div class="bar-track"><div class="bar-fill green" style="width:${Math.round(count / maxCountry * 100)}%"></div></div>
        <div class="bar-count">${count}</div>
      </div>
    `).join('');

    const maxCity = cities.length > 0 ? cities[0][1] : 1;
    const cityBars = cities.slice(0, 10).map(([city, count]) => `
      <div class="bar-item">
        <div class="bar-label" style="min-width:100px">${escHtml(city)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count / maxCity * 100)}%"></div></div>
        <div class="bar-count">${count}</div>
      </div>
    `).join('');

    return `
    <div class="card card-full">
      <div class="card-title">Geography</div>
      <div class="two-col">
        <div>
          <div class="section-label">Visitors by Country</div>
          ${countryBars || '<div class="empty-state">No country data.</div>'}
        </div>
        <div>
          <div class="section-label">Top Cities</div>
          ${cityBars || '<div class="empty-state">No city data.</div>'}
        </div>
      </div>
    </div>`;
  }

  // --- HOURLY HEATMAP ---

  function renderHeatmap(an) {
    const heatmap = an.heatmap || [];
    if (heatmap.length === 0) {
      return `<div class="card"><div class="card-title">Activity Heatmap</div><div class="empty-state">No heatmap data yet.</div></div>`;
    }

    let maxVal = 0;
    for (let h = 0; h < 24; h++) {
      for (let d = 0; d < 7; d++) {
        const v = heatmap[h]?.[d] || 0;
        if (v > maxVal) maxVal = v;
      }
    }
    if (maxVal === 0) maxVal = 1;

    const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    let headerCells = '<div class="heatmap-label"></div>';
    for (let d = 0; d < 7; d++) {
      headerCells += `<div class="heatmap-header">${dayNames[d]}</div>`;
    }

    let rows = '';
    for (let h = 0; h < 24; h += 2) {
      const hourLabel = String(h).padStart(2, '0') + ':00';
      rows += `<div class="heatmap-label">${hourLabel}</div>`;
      for (let d = 0; d < 7; d++) {
        const v = (heatmap[h]?.[d] || 0) + (heatmap[h + 1]?.[d] || 0);
        const intensity = v / (maxVal * 2);
        const r = Math.round(58 + intensity * 40);
        const g = Math.round(53 + intensity * 60);
        const b = Math.round(40 + intensity * 10);
        const a = Math.max(0.1, Math.min(1, 0.15 + intensity * 0.85));
        rows += `<div class="heatmap-cell" style="background:rgba(${r},${g},${b},${a})">
          <div class="tooltip">${dayNames[d]} ${hourLabel} UTC: ${v} visits</div>
        </div>`;
      }
    }

    return `
    <div class="card">
      <div class="card-title">Activity Heatmap (UTC)</div>
      <div class="heatmap">
        ${headerCells}
        ${rows}
      </div>
    </div>`;
  }

  // --- VISITOR FEED ---

  function renderVisitorFeed(d) {
    const visitors = d.recentVisitors || [];
    if (visitors.length === 0) {
      return `<div class="card card-full"><div class="card-title"><span class="card-title-left"><span class="pulse"></span>Live Visitor Feed</span></div><div class="empty-state">No visitor data yet.</div></div>`;
    }

    const now = Date.now();
    const feedItems = visitors.slice(0, 50).map(v => {
      const ago = now - new Date(v.timestamp).getTime();
      const isRecent = ago < 300000;
      const timeAgo = ago < 60000 ? 'just now' : ago < 3600000 ? Math.floor(ago/60000) + 'm ago' : ago < 86400000 ? Math.floor(ago/3600000) + 'h ago' : Math.floor(ago/86400000) + 'd ago';
      const geo = [v.city, v.region, v.country].filter(Boolean).join(', ') || v.ip;
      const srcClass = v.source || 'direct';
      return `<div class="visitor-item">
        <div class="visitor-dot${isRecent ? ' recent' : ''}"></div>
        <div class="visitor-page">${escHtml(v.page)}</div>
        <div class="visitor-geo">${v.country ? countryFlag(v.country) + ' ' : ''}${escHtml(geo)}</div>
        <span class="visitor-source-tag ${srcClass}">${srcClass}</span>
        <div class="visitor-device">${v.browser || (v.isMobile ? 'Mobile' : 'Desktop')}</div>
        ${v.isReturning ? '<span class="visitor-returning">returning</span>' : ''}
        <div class="visitor-time">${timeAgo}</div>
      </div>`;
    }).join('');

    return `
    <div class="card card-full">
      <div class="card-title"><span class="card-title-left"><span class="pulse"></span>Live Visitor Feed</span></div>
      <div class="visitor-feed">${feedItems}</div>
    </div>`;
  }

  // --- PROVIDERS ---

  function renderProviders(d) {
    const p = d.providers || {};
    function providerCard(name, label, info) {
      if (!info) return '';
      const statusClass = info.active ? 'active-provider' : (info.configured ? '' : 'not-configured');
      const badge = info.active ? '<span class="provider-badge active">ACTIVE</span>' :
                    info.configured ? '<span class="provider-badge configured">Ready</span>' :
                    '<span class="provider-badge off">Not configured</span>';
      return `<div class="provider-card ${statusClass}">
        ${badge}
        <div class="provider-name">${label}</div>
        <div class="provider-detail">Model: ${escHtml(info.model)}</div>
        <div class="provider-detail">Auth: ${info.auth}</div>
        ${info.budget ? `<div class="provider-detail">Budget: ${info.budget}</div>` : ''}
        ${info.limits ? `<div class="provider-detail">${info.limits.rpm ? info.limits.rpm + ' RPM' : ''}${info.limits.tpm ? ' / ' + fmtNum(info.limits.tpm) + ' TPM' : ''}${info.limits.tpd ? ' / ' + fmtNum(info.limits.tpd) + ' TPD' : ''}</div>` : ''}
      </div>`;
    }

    const orc = d.openRouterCosts || {};
    let orBudgetHtml = '';
    if (orc.creditsStarting) {
      const remaining = orc.creditsRemaining || 0;
      const pct = Math.round((orc.creditsSpent || 0) / orc.creditsStarting * 100);
      const barColor = pct > 80 ? 'red' : pct > 60 ? 'yellow' : 'green';
      orBudgetHtml = `<div style="margin-top:16px;">
        <div class="section-label">OpenRouter Budget</div>
        <div class="usage-bar-wrap">
          <div class="usage-bar-header">
            <span class="usage-bar-label">Credits spent</span>
            <span class="usage-bar-value">$${(orc.creditsSpent || 0).toFixed(4)} / $${orc.creditsStarting.toFixed(2)} ($${remaining.toFixed(4)} left)</span>
          </div>
          <div class="usage-bar-track"><div class="usage-bar-fill ${barColor}" style="width:${pct}%"></div></div>
        </div>
        <div style="font-size:11px;color:#3a3528;margin-top:4px;">
          Avg cost/request: $${(orc.avgCostPerRequest || 0).toFixed(6)}
          ${orc.estimatedRequestsRemaining !== 'unlimited' ? ' -- ~' + orc.estimatedRequestsRemaining + ' requests remaining' : ''}
        </div>
      </div>`;
    }

    return `
    <div class="card card-full">
      <div class="card-title"><span class="card-title-left"><span class="pulse"></span>LLM Providers</span></div>
      <div class="provider-grid">
        ${providerCard('gemini', 'Gemini', p.gemini)}
        ${providerCard('openai', 'OpenAI', p.openai)}
        ${providerCard('openrouter', 'OpenRouter', p.openrouter)}
      </div>
      ${orBudgetHtml}
    </div>`;
  }

  // --- LLM USAGE ---

  function renderLlmUsage(u) {
    if (!u) return '';
    const today = u.today || {};
    const allTime = u.allTime || {};

    let todayBars = '';
    const providerConfigs = {
      gemini: { label: 'Gemini', tokenLimit: 1000000 },
      openai: { label: 'OpenAI', tokenLimit: 2500000 },
      openrouter: { label: 'OpenRouter', tokenLimit: null }
    };

    for (const [prov, config] of Object.entries(providerConfigs)) {
      const usage = today[prov];
      if (!usage && !allTime[prov]) continue;
      const calls = usage ? usage.calls : 0;
      const tokens = usage ? usage.tokens : 0;
      const errors = usage ? usage.errors : 0;
      const avgLatency = usage && usage.calls > 0 ? Math.round(usage.latencyMs / usage.calls) : 0;
      const atCalls = allTime[prov] ? allTime[prov].calls : 0;
      const atTokens = allTime[prov] ? allTime[prov].tokens : 0;
      const atErrors = allTime[prov] ? allTime[prov].errors : 0;

      let tokenBar = '';
      if (config.tokenLimit) {
        const pct = Math.min(100, Math.round(tokens / config.tokenLimit * 100));
        const barColor = pct > 90 ? 'red' : pct > 70 ? 'yellow' : 'green';
        tokenBar = `
          <div class="usage-bar-wrap">
            <div class="usage-bar-header">
              <span class="usage-bar-label">Tokens today</span>
              <span class="usage-bar-value">${fmtNum(tokens)} / ${fmtNum(config.tokenLimit)}</span>
            </div>
            <div class="usage-bar-track"><div class="usage-bar-fill ${barColor}" style="width:${pct}%"></div></div>
          </div>`;
      }

      todayBars += `
        <div style="margin-bottom:16px;">
          <div style="color:#8a7d55;font-size:13px;font-weight:bold;margin-bottom:8px;">${config.label}</div>
          <div class="stat-row" style="margin-bottom:8px;">
            <div class="stat"><div class="stat-value small">${calls}</div><div class="stat-label">Calls today</div></div>
            <div class="stat"><div class="stat-value small">${fmtNum(tokens)}</div><div class="stat-label">Tokens today</div></div>
            <div class="stat"><div class="stat-value small${errors > 0 ? ' danger' : ''}">${errors}</div><div class="stat-label">Errors today</div></div>
            <div class="stat"><div class="stat-value small">${avgLatency}ms</div><div class="stat-label">Avg latency</div></div>
          </div>
          ${tokenBar}
          <div style="font-size:11px;color:#3a3528;margin-top:4px;">All time: ${fmtNum(atCalls)} calls, ${fmtNum(atTokens)} tokens, ${atErrors} errors</div>
        </div>`;
    }

    const last7 = (u.last7Days || []).reverse();
    let chartHtml = '';
    if (last7.length > 0) {
      const maxCalls = Math.max(...last7.map(dy => {
        let total = 0;
        for (const p of Object.values(dy.usage || {})) total += p.calls || 0;
        return total;
      }), 1);
      chartHtml = `<div style="margin-top:16px;">
        <div class="section-label">Last 7 Days (API Calls)</div>
        ${last7.map(day => {
          let total = 0;
          for (const p of Object.values(day.usage || {})) total += p.calls || 0;
          const pct = Math.round(total / maxCalls * 100);
          const label = day.date.slice(5);
          return `<div class="bar-item">
            <div class="bar-label" style="min-width:50px">${label}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <div class="bar-count">${total}</div>
          </div>`;
        }).join('')}
      </div>`;
    }

    let alertsHtml = '';
    if (u.alerts && u.alerts.length > 0) {
      alertsHtml = `<div style="margin-top:16px;">
        <div class="section-label" style="color:#7a4a4a">Budget Alerts</div>
        ${u.alerts.slice(-5).reverse().map(a => `
          <div style="font-size:12px;color:${a.level === 'critical' ? '#9a5a5a' : '#b8a86a'};padding:4px 0;border-bottom:1px solid #0f0e0c;">
            ${formatTime(a.timestamp)} -- ${escHtml(a.message)}
          </div>
        `).join('')}
      </div>`;
    }

    return `
    <div class="card card-full">
      <div class="card-title">LLM Usage & Budget</div>
      ${todayBars || '<div class="empty-state">No LLM calls tracked yet.</div>'}
      ${chartHtml}
      ${alertsHtml}
    </div>`;
  }

  // --- ACCOUNTS ---

  function renderAccountsOverview(a) {
    if (!a || !a.accounts) return '';
    const members = a.accounts.filter(x => x.membershipStatus === 'member').length;
    const withGoogle = a.accounts.filter(x => x.providers?.includes('google')).length;

    const rows = a.accounts.slice(0, 50).map(u => `<tr>
      <td title="${escHtml(u.email)}">${escHtml(u.email)}</td>
      <td>${(u.providers||[]).join(', ')}</td>
      <td>${u.tomesCount||0}</td>
      <td>${u.createdAt ? new Date(u.createdAt).toLocaleDateString() : '-'}</td>

        <div class="stat"><div class="stat-value accent">${members}</div><div class="stat-label">Members</div></div>
        <div class="stat"><div class="stat-value small">${withGoogle}</div><div class="stat-label">Google</div></div>
        <div class="stat"><div class="stat-value small">${withMs}</div><div class="stat-label">Microsoft</div></div>
        <div class="stat"><div class="stat-value small">${withEmail}</div><div class="stat-label">Email</div></div>
        <div class="stat"><div class="stat-value small">${withWaitlist}</div><div class="stat-label">Waitlist-linked</div></div>
        <div class="stat"><div class="stat-value small">${totalTomes}</div><div class="stat-label">Total tomes</div></div>
      </div>
      ${a.accounts.length > 0 ? `<div class="data-table-wrap"><table class="data-table" style="table-layout:fixed;">
        <colgroup><col style="width:40%"><col style="width:20%"><col style="width:15%"><col style="width:25%"></colgroup>
        <thead><tr><th>Email</th><th>Provider</th><th>Tomes</th><th>Joined</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>` : ''}
    </div>`;
  }

  // --- SYSTEM ---

  function renderSystem(d) {
    const sys = d.system;
    const mem = sys.memoryMB;

    <div class="card">
      <div class="card-title"><span class="card-title-left"><span class="pulse"></span>System</span></div>

      <div class="sys-row"><span class="sys-label">Active provider</span><span class="sys-value">${sys.activeProvider}</span></div>

      <div class="sys-row"><span class="sys-label">Memory (RSS)</span><span class="sys-value">${mem.rss} MB</span></div>

      <div class="sys-row"><span class="sys-label">Started</span><span class="sys-value">${formatTime(d.serverStartTime)}</span></div>
    </div>`;

  // --- API CALLS ---

  function renderApiUsage(d) {
    const calls = d.apiCalls;
    const total = Object.values(calls).reduce((s, v) => s + v, 0);
    const maxCall = Math.max(...Object.values(calls), 1);
    const bars = Object.entries(calls).sort((a, b) => b[1] - a[1]).map(([name, count]) => `
      <div class="bar-item">
        <div class="bar-label">${name}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count / maxCall * 100)}%"></div></div>
        <div class="bar-count">${count}</div>
      </div>
    `).join('');
    return `
    <div class="card">
      <div class="card-title">API Calls</div>
      <div class="stat-row"><div class="stat"><div class="stat-value">${total}</div><div class="stat-label">Total API calls</div></div></div>
      <div class="bar-group">${bars}</div>
    </div>`;
  }

  // --- COVER STATS ---

  function renderCoverStats(d) {
    const c = d.covers;
    const total = c.geminiSuccess + c.imagenFallback + c.failed;
    if (total === 0) {
      return `<div class="card"><div class="card-title">Cover Generation</div><div class="empty-state">No covers generated yet.</div></div>`;
    }
    return `
    <div class="card">
      <div class="card-title">Cover Generation</div>
      <div class="stat-row">
        <div class="stat"><div class="stat-value success small">${c.geminiSuccess}</div><div class="stat-label">Gemini (direct)</div></div>
        <div class="stat"><div class="stat-value accent small">${c.imagenFallback}</div><div class="stat-label">Imagen fallback</div></div>
        <div class="stat"><div class="stat-value danger small">${c.failed}</div><div class="stat-label">Failed</div></div>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="stat-value small">${Math.round(c.imagenFallback / total * 100)}%</div><div class="stat-label">Fallback rate</div></div>
        <div class="stat"><div class="stat-value small">${Math.round(c.failed / total * 100)}%</div><div class="stat-label">Failure rate</div></div>
      </div>
    </div>`;
  }

  // --- ERROR LOG ---

  function renderErrorLog(an) {
    const errors = an.recentErrors || [];
    return `
    <div class="card">
      <div class="card-title">Errors</div>
      <div class="stat-row">
        <div class="stat"><div class="stat-value${(metricsData?.errors?.total || 0) > 0 ? ' danger' : ''} small">${metricsData?.errors?.total || 0}</div><div class="stat-label">Total errors</div></div>
        <div class="stat"><div class="stat-value danger small">${metricsData?.errors?.e500 || 0}</div><div class="stat-label">500s</div></div>
        <div class="stat"><div class="stat-value danger small">${metricsData?.errors?.e429 || 0}</div><div class="stat-label">429s</div></div>
      </div>
      ${errors.length > 0 ? `
        <div class="section-label" style="margin-top:16px">Recent Errors</div>
        <div style="max-height:200px;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;">
          ${errors.map(e => `<div class="error-item">
            <span class="error-status">${e.status}</span>
            <span class="error-context">${escHtml(e.context)}</span>
            <span class="error-time">${formatTime(e.timestamp)}</span>
          </div>`).join('')}
        </div>
      ` : '<div class="empty-state" style="margin-top:12px">No recent errors.</div>'}
    </div>`;
  }

  // --- SIGNUP TREND ---

  function renderSignupTrend(w) {
    const trend = w.signupTrend || [];
    if (trend.length === 0 || trend.every(t => t.count === 0)) return '';
    const maxCount = Math.max(...trend.map(t => t.count), 1);

    const bars = trend.map(t => {
      const h = Math.max(2, Math.round(t.count / maxCount * 100));
      const label = t.date.slice(5);
      return `<div class="mini-chart-bar" style="height:${h}%${t.count > 0 ? '' : ';background:#141210'}">
        <div class="tooltip">${label}: ${t.count} signups</div>
      </div>`;
    }).join('');

    const totalMonth = trend.reduce((s, t) => s + t.count, 0);
    const avgDaily = (totalMonth / trend.length).toFixed(1);
    const bestDay = trend.reduce((best, t) => t.count > best.count ? t : best, { count: 0, date: '' });

    return `
    <div class="card card-full">
      <div class="card-title">Signup Trend (30 Days)</div>
      <div class="stat-row">
        <div class="stat"><div class="stat-value small">${totalMonth}</div><div class="stat-label">30-day signups</div></div>
        <div class="stat"><div class="stat-value small">${avgDaily}</div><div class="stat-label">Avg per day</div></div>
        <div class="stat"><div class="stat-value small">${bestDay.count}</div><div class="stat-label">Best day (${bestDay.date ? bestDay.date.slice(5) : '--'})</div></div>
      </div>
      <div class="section-label" style="margin-top:16px">Signups Per Day</div>
      <div class="mini-chart">${bars}</div>
    </div>`;
  }

  // --- SURVEY INSIGHTS ---

  function renderSurveyInsights(w) {
    const stats = w.surveyStats;
    const topics = stats.topTopics || [];
    const maxTopicCount = topics.length > 0 ? topics[0][1] : 1;
    const topicBars = topics.slice(0, 10).map(([name, count]) => `
      <div class="bar-item">
        <div class="bar-label" style="min-width:120px">${name}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count / maxTopicCount * 100)}%"></div></div>
        <div class="bar-count">${count}</div>
      </div>
    `).join('');

    const payEntries = Object.entries(stats.wouldPay || {});
    const payBars = payEntries.map(([answer, count]) => `
      <div class="bar-item">
        <div class="bar-label">${answer}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count / Math.max(...payEntries.map(e => e[1]), 1) * 100)}%"></div></div>
        <div class="bar-count">${count}</div>
      </div>
    `).join('');

    const fmtEntries = Object.entries(stats.formats || {});
    const fmtBars = fmtEntries.map(([fmt, count]) => `
      <div class="bar-item">
        <div class="bar-label">${fmt}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count / Math.max(...fmtEntries.map(e => e[1]), 1) * 100)}%"></div></div>
        <div class="bar-count">${count}</div>
      </div>
    `).join('');

    const roleEntries = Object.entries(stats.roles || {});
    const roleBars = roleEntries.map(([role, count]) => `
      <div class="bar-item">
        <div class="bar-label">${role}</div>
        <div class="bar-track"><div class="bar-fill orange" style="width:${Math.round(count / Math.max(...roleEntries.map(e => e[1]), 1) * 100)}%"></div></div>
        <div class="bar-count">${count}</div>
      </div>
    `).join('');

    const sourceEntries = Object.entries(stats.sources || {});
    const sourceBars = sourceEntries.map(([src, count]) => `
      <div class="bar-item">
        <div class="bar-label">${src}</div>
        <div class="bar-track"><div class="bar-fill blue" style="width:${Math.round(count / Math.max(...sourceEntries.map(e => e[1]), 1) * 100)}%"></div></div>
        <div class="bar-count">${count}</div>
      </div>
    `).join('');

    const hasData = topics.length > 0 || payEntries.length > 0 || roleEntries.length > 0;
    if (!hasData) {
      return `<div class="card card-full"><div class="card-title">Survey Insights</div><div class="empty-state">No survey data yet.</div></div>`;
    }

    return `
    <div class="card card-full">
      <div class="card-title">Survey Insights</div>
      ${topics.length > 0 ? `<div style="margin-bottom:20px"><div class="section-label">Top Topics</div><div class="bar-group">${topicBars}</div></div>` : ''}
      <div class="two-col">
        ${payEntries.length > 0 ? `<div><div class="section-label">Would Pay?</div><div class="bar-group">${payBars}</div></div>` : ''}
        ${fmtEntries.length > 0 ? `<div><div class="section-label">Preferred Format</div><div class="bar-group">${fmtBars}</div></div>` : ''}
      </div>
      <div class="two-col" style="margin-top:20px">
        ${roleEntries.length > 0 ? `<div><div class="section-label">Roles</div><div class="bar-group">${roleBars}</div></div>` : ''}
        ${sourceEntries.length > 0 ? `<div><div class="section-label">How They Found Us</div><div class="bar-group">${sourceBars}</div></div>` : ''}
      </div>
    </div>`;
  }

  // --- UTM CAMPAIGNS ---

  function renderUtmCampaigns(w) {
    const campaigns = w.utmCampaigns || [];
    if (campaigns.length === 0) return '';
    const maxSignups = campaigns[0][1].signups || 1;
    const bars = campaigns.slice(0, 10).map(([name, data]) => `
      <div class="bar-item">
        <div class="bar-label" style="min-width:100px">${escHtml(name)}</div>
        <div class="bar-track"><div class="bar-fill green" style="width:${Math.round(data.signups / maxSignups * 100)}%"></div></div>
        <div class="bar-count">${data.signups} <span style="color:#3a3528;font-size:10px">${data.source ? '(' + escHtml(data.source) + (data.medium ? '/' + escHtml(data.medium) : '') + ')' : ''}</span></div>
      </div>
    `).join('');
    return `
    <div class="card">
      <div class="card-title">UTM Campaigns</div>
      <div class="bar-group">${bars}</div>
    </div>`;
  }

  // --- WAITLIST TABLE ---

  function renderWaitlistTable(w) {
    const signups = w.signups || [];
    if (signups.length === 0) {
      return `<div class="card card-full"><div class="card-title">Waitlist Signups</div><div class="empty-state">The ledger is empty.</div></div>`;
    }
    const rows = signups.map(s => `
      <tr>
        <td title="${escHtml(s.email)}">${escHtml(s.email)}</td>
        <td>${formatTime(s.timestamp)}</td>
        <td>${s.sourceReferrer ? escHtml(tryHostname(s.sourceReferrer)) : (s.referrer ? escHtml(tryHostname(s.referrer)) : '--')}</td>
        <td>${s.device || '--'}</td>
        <td>${s.hasSurvey ? '<span class="tag tag-yes">yes</span>' : '<span class="tag tag-no">no</span>'}</td>
        <td title="${s.survey ? escHtml(s.survey.topics || '') : ''}">${s.survey ? escHtml(s.survey.topics || '--') : '--'}</td>
        <td>${s.survey ? escHtml(s.survey.wouldPay || '--') : '--'}</td>
      </tr>
    `).join('');
    return `
    <div class="card card-full">
      <div class="card-title"><span>Waitlist Signups (${signups.length})</span><button class="btn-export" data-export="waitlist">Export JSON</button></div>
      <input class="search-input" type="text" placeholder="Search emails..." data-search="waitlist-table">
      <div class="data-table-wrap">
        <table class="data-table" id="waitlist-table" style="table-layout:fixed;">
          <colgroup><col style="width:22%"><col style="width:12%"><col style="width:14%"><col style="width:8%"><col style="width:8%"><col style="width:20%"><col style="width:12%"></colgroup>
          <thead><tr>
            <th data-sort="0">Email</th><th data-sort="1">Date</th><th data-sort="2">Source</th>
            <th data-sort="3">Device</th><th data-sort="4">Survey</th><th data-sort="5">Topics</th><th data-sort="6">Would Pay</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }

  // --- EBOOK TABLE ---

  function renderEbookTable(e) {
    const jobs = e.jobs || [];
    if (jobs.length === 0) {
      return `<div class="card card-full"><div class="card-title">Ebook History</div><div class="empty-state">No tomes forged yet.</div></div>`;
    }
    const rows = jobs.map(j => {
      const statusClass = j.status === 'ready' ? 'tag-ready' : j.status === 'generating' ? 'tag-generating' : 'tag-failed';
      return `<tr>
        <td title="${escHtml(j.title || '')}">${escHtml(j.title || '--')}</td>
        <td><span class="tag ${statusClass}">${j.status}</span></td>
        <td>${j.chapters || '--'}</td>
        <td>${j.durationHuman || '--'}</td>
        <td>${formatTime(j.generatedAt)}</td>
        <td title="${j.error ? escHtml(j.error) : ''}">${j.error ? escHtml(j.error) : '--'}</td>
      </tr>`;
    }).join('');
    return `
    <div class="card card-full">
      <div class="card-title"><span>Ebook History (${jobs.length})</span><button class="btn-export" data-export="ebooks">Export JSON</button></div>
      <input class="search-input" type="text" placeholder="Search titles..." data-search="ebook-table">
      <div class="data-table-wrap">
        <table class="data-table" id="ebook-table" style="table-layout:fixed;">
          <colgroup><col style="width:30%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:20%"><col style="width:20%"></colgroup>
          <thead><tr>
            <th data-sort="0">Title</th><th data-sort="1">Status</th><th data-sort="2">Chapters</th>
            <th data-sort="3">Duration</th><th data-sort="4">Date</th><th data-sort="5">Error</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }

  // --- REFERRERS ---

  function renderReferrers(d) {
    const refs = Object.entries(d.referrers || {}).sort((a, b) => b[1] - a[1]);
    if (refs.length === 0) {
      return `<div class="card"><div class="card-title">Top Referrers</div><div class="empty-state">No external referrers yet.</div></div>`;
    }
    const maxRef = refs[0][1];
    const bars = refs.slice(0, 15).map(([host, count]) => `
      <div class="bar-item">
        <div class="bar-label" style="min-width:140px">${escHtml(host)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count / maxRef * 100)}%"></div></div>
        <div class="bar-count">${count}</div>
      </div>
    `).join('');
    return `<div class="card"><div class="card-title">Top Referrers</div><div class="bar-group">${bars}</div></div>`;
  }

  // --- HELPERS ---

  function formatTime(iso) {
    if (!iso) return '--';
    try {
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' +
             d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    } catch { return iso; }
  }

  function escHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function tryHostname(url) {
    try { return new URL(url).hostname; } catch { return url; }
  }

  function fmtNum(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
    return String(n);
  }

  function countryFlag(code) {
    if (!code || code.length !== 2) return '';
    const offset = 127397;
    return String.fromCodePoint(...[...code.toUpperCase()].map(c => c.charCodeAt(0) + offset));
  }

  // --- TABLE SORTING ---

  function bindTableSort() {
    $$('.data-table th[data-sort]').forEach(th => {
      th.addEventListener('click', function() {
        const table = this.closest('table');
        const colIdx = parseInt(this.dataset.sort);
        const tableId = table.id;
        const state = sortState[tableId] || { col: -1, asc: true };
        state.asc = state.col === colIdx ? !state.asc : true;
        state.col = colIdx;
        sortState[tableId] = state;
        const tbody = table.querySelector('tbody');
        const rows = [...tbody.querySelectorAll('tr')];
        rows.sort((a, b) => {
          const aText = a.children[colIdx]?.textContent || '';
          const bText = b.children[colIdx]?.textContent || '';
          return (state.asc ? 1 : -1) * aText.localeCompare(bText, undefined, { numeric: true });
        });
        rows.forEach(r => tbody.appendChild(r));
      });
    });
  }

  function bindSearch() {
    $$('.search-input[data-search]').forEach(input => {
      input.addEventListener('input', function() {
        const tableId = this.dataset.search;
        const query = this.value.toLowerCase();
        $$(`#${tableId} tbody tr`).forEach(r => {
          r.style.display = r.textContent.toLowerCase().includes(query) ? '' : 'none';
        });
      });
    });
  }

  function bindExport() {
    $$('.btn-export[data-export]').forEach(btn => {
      btn.addEventListener('click', function() {
        const type = this.dataset.export;
        let data, filename;
        if (type === 'waitlist') { data = waitlistData; filename = 'waitlist-export.json'; }
        else if (type === 'ebooks') { data = ebooksData; filename = 'ebooks-export.json'; }
        else { data = metricsData; filename = 'metrics-export.json'; }
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      });
    });
  }

  // --- INIT ---
  fetchAll();
  setInterval(fetchAll, 15000);
})();
</script>
</body>
</html>
