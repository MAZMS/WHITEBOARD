<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whiteboard — Agent System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #000;
      --fg: #fff;
      --dim: #555;
      --border: #333;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      cursor: crosshair;
    }

    /* ── Canvas ── */
    #canvas {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* ── Grid overlay ── */
    #grid {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        radial-gradient(circle, #1a1a1a 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    /* ── Command bar ── */
    #command-bar {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 20px;
      min-width: 500px;
      max-width: 700px;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 40px rgba(255,255,255,0.05);
    }
    #command-bar.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    #command-bar .prefix {
      color: var(--dim);
      font-size: 14px;
      user-select: none;
      white-space: nowrap;
    }
    #command-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--fg);
      font-family: inherit;
      font-size: 16px;
      caret-color: #fff;
    }
    #command-input::placeholder {
      color: #444;
    }
    #command-bar .hint {
      color: #333;
      font-size: 11px;
      white-space: nowrap;
    }

    /* ── Agent cards ── */
    .agent-card {
      position: absolute;
      z-index: 50;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      min-width: 280px;
      max-width: 360px;
      cursor: grab;
      user-select: none;
      animation: agentAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      box-shadow: 0 0 30px rgba(255,255,255,0.03);
    }
    .agent-card:active { cursor: grabbing; }
    .agent-card .agent-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .agent-card .agent-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .agent-card .agent-status {
      font-size: 11px;
      color: var(--dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .agent-card .agent-status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--fg);
      animation: pulse 1.5s infinite;
    }
    .agent-card .agent-body {
      font-size: 13px;
      color: #aaa;
      line-height: 1.6;
      min-height: 40px;
    }
    .agent-card .agent-actions {
      margin-top: 14px;
      display: flex;
      gap: 8px;
    }
    .agent-card .agent-actions button {
      background: none;
      border: 1px solid var(--border);
      color: var(--fg);
      font-family: inherit;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .agent-card .agent-actions button:hover {
      background: var(--fg);
      color: var(--bg);
    }
    .agent-card .close-btn {
      background: none;
      border: none;
      color: var(--dim);
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }
    .agent-card .close-btn:hover { color: var(--fg); }

    /* ── Drawing lines ── */
    .draw-line {
      position: absolute;
      z-index: 2;
      pointer-events: none;
    }

    /* ── Toolbar ── */
    #toolbar {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 2px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px;
    }
    .tool-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--dim);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tool-btn:hover { color: var(--fg); }
    .tool-btn.active {
      color: var(--fg);
      border-color: var(--border);
      background: #111;
    }

    /* ── Sticky notes ── */
    .sticky-note {
      position: absolute;
      z-index: 40;
      background: #111;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      min-width: 180px;
      min-height: 100px;
      cursor: grab;
      user-select: none;
      animation: agentAppear 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .sticky-note:active { cursor: grabbing; }
    .sticky-note textarea {
      width: 100%;
      min-height: 60px;
      background: none;
      border: none;
      outline: none;
      color: var(--fg);
      font-family: inherit;
      font-size: 13px;
      resize: none;
      line-height: 1.5;
    }
    .sticky-note .close-btn {
      position: absolute;
      top: 6px;
      right: 10px;
      background: none;
      border: none;
      color: var(--dim);
      font-size: 16px;
      cursor: pointer;
      transition: color 0.2s;
    }
    .sticky-note .close-btn:hover { color: var(--fg); }

    /* ── Toast ── */
    #toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      z-index: 200;
      background: #111;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 13px;
      color: var(--dim);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Animations ── */
    @keyframes agentAppear {
      from {
        opacity: 0;
        transform: scale(0.8) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Splashscreen ── */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease;
    }
    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #splash h1 {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 8px;
      animation: fadeUp 0.8s ease forwards;
    }
    #splash p {
      font-size: 13px;
      color: var(--dim);
      letter-spacing: 2px;
      animation: fadeUp 0.8s 0.2s ease forwards;
      opacity: 0;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Help panel ── */
    #help-panel {
      position: fixed;
      right: 20px;
      top: 80px;
      z-index: 100;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      width: 260px;
      font-size: 12px;
      color: var(--dim);
      line-height: 2;
      display: none;
    }
    #help-panel.visible { display: block; animation: agentAppear 0.3s ease forwards; }
    #help-panel h3 { color: var(--fg); font-size: 13px; margin-bottom: 8px; letter-spacing: 1px; }
    #help-panel kbd {
      background: #111;
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
      color: var(--fg);
    }
  </style>
</head>
<body>

  <!-- Splash -->
  <div id="splash">
    <h1>Whiteboard</h1>
    <p>press space to begin</p>
  </div>

  <!-- Grid background -->
  <div id="grid"></div>

  <!-- Drawing canvas -->
  <svg id="canvas"></svg>

  <!-- Toolbar -->
  <div id="toolbar" style="display:none;">
    <button class="tool-btn active" data-tool="draw">Draw</button>
    <button class="tool-btn" data-tool="note">Note</button>
    <button class="tool-btn" data-tool="move">Move</button>
    <button class="tool-btn" data-tool="erase">Erase</button>
    <button class="tool-btn" onclick="toggleHelp()">?</button>
  </div>

  <!-- Command bar -->
  <div id="command-bar">
    <span class="prefix">&gt;</span>
    <input id="command-input" type="text" placeholder="summon an agent..." autocomplete="off" spellcheck="false">
    <span class="hint">enter to summon</span>
  </div>

  <!-- Help panel -->
  <div id="help-panel">
    <h3>SHORTCUTS</h3>
    <div><kbd>Space</kbd> &mdash; command bar</div>
    <div><kbd>D</kbd> &mdash; draw mode</div>
    <div><kbd>N</kbd> &mdash; new note</div>
    <div><kbd>M</kbd> &mdash; move mode</div>
    <div><kbd>E</kbd> &mdash; eraser</div>
    <div><kbd>Esc</kbd> &mdash; close / cancel</div>
    <div><kbd>C</kbd> &mdash; clear board</div>
    <h3 style="margin-top:12px;">AGENTS</h3>
    <div>Type any name to summon</div>
    <div>e.g. "coder", "writer", "designer"</div>
    <div>Drag cards to reposition</div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script>
    // ── State ──
    let started = false;
    let currentTool = 'draw';
    let isDrawing = false;
    let currentPath = null;
    let commandOpen = false;
    let dragTarget = null;
    let dragOffset = { x: 0, y: 0 };
    let agentCount = 0;

    const canvas = document.getElementById('canvas');
    const commandBar = document.getElementById('command-bar');
    const commandInput = document.getElementById('command-input');
    const toolbar = document.getElementById('toolbar');
    const splash = document.getElementById('splash');
    const helpPanel = document.getElementById('help-panel');

    // ── Agent definitions ──
    const agents = {
      coder:    { icon: '{}',  desc: 'Writes and refactors code. Handles implementation tasks.' },
      writer:   { icon: 'Aa',  desc: 'Drafts text, copy, and documentation.' },
      designer: { icon: '◐',   desc: 'Creates layouts, mockups, and visual ideas.' },
      thinker:  { icon: '◇',   desc: 'Breaks down problems and plans solutions.' },
      reviewer: { icon: '✓',   desc: 'Reviews work, finds issues, suggests fixes.' },
      researcher:{ icon: '⊕',  desc: 'Finds information and gathers context.' },
      debugger: { icon: '⚡',   desc: 'Hunts down bugs and traces errors.' },
      planner:  { icon: '▤',   desc: 'Creates roadmaps, tasks, and timelines.' },
    };

    // ── Splash ──
    document.addEventListener('keydown', (e) => {
      if (!started && e.code === 'Space') {
        e.preventDefault();
        started = true;
        splash.classList.add('fade-out');
        setTimeout(() => { splash.style.display = 'none'; }, 600);
        toolbar.style.display = 'flex';
        toast('Ready — press Space to summon agents');
      }
    });

    // ── Toast ──
    let toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
    }

    // ── Help ──
    function toggleHelp() {
      helpPanel.classList.toggle('visible');
    }

    // ── Command bar ──
    function openCommand() {
      commandOpen = true;
      commandBar.classList.add('visible');
      commandInput.value = '';
      commandInput.focus();
    }
    function closeCommand() {
      commandOpen = false;
      commandBar.classList.remove('visible');
      commandInput.blur();
    }

    commandInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeCommand(); }
      if (e.key === 'Enter') {
        const val = commandInput.value.trim().toLowerCase();
        if (val) summonAgent(val);
        closeCommand();
      }
    });

    // ── Keyboard shortcuts ──
    document.addEventListener('keydown', (e) => {
      if (!started) return;
      if (commandOpen) return;
      if (e.target.tagName === 'TEXTAREA') return;

      switch (e.code) {
        case 'Space':
          e.preventDefault();
          openCommand();
          break;
        case 'KeyD':
          setTool('draw');
          break;
        case 'KeyN':
          createNote(window.innerWidth / 2 - 90, window.innerHeight / 2 - 50);
          break;
        case 'KeyM':
          setTool('move');
          break;
        case 'KeyE':
          setTool('erase');
          break;
        case 'KeyC':
          if (!e.metaKey && !e.ctrlKey) clearBoard();
          break;
        case 'Escape':
          helpPanel.classList.remove('visible');
          break;
      }
    });

    // ── Tool switching ──
    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tool === tool);
      });
      document.body.style.cursor =
        tool === 'draw' ? 'crosshair' :
        tool === 'move' ? 'grab' :
        tool === 'erase' ? 'pointer' :
        'default';
      toast(tool.charAt(0).toUpperCase() + tool.slice(1) + ' mode');
    }

    document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
      btn.addEventListener('click', () => setTool(btn.dataset.tool));
    });

    // ── Drawing ──
    canvas.addEventListener('mousedown', (e) => {
      if (!started || currentTool !== 'draw') return;
      isDrawing = true;
      currentPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      currentPath.setAttribute('stroke', '#fff');
      currentPath.setAttribute('stroke-width', '2');
      currentPath.setAttribute('fill', 'none');
      currentPath.setAttribute('stroke-linecap', 'round');
      currentPath.setAttribute('stroke-linejoin', 'round');
      currentPath.setAttribute('d', `M ${e.clientX} ${e.clientY}`);
      currentPath.classList.add('draw-line');
      canvas.appendChild(currentPath);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing || !currentPath) return;
      const d = currentPath.getAttribute('d');
      currentPath.setAttribute('d', d + ` L ${e.clientX} ${e.clientY}`);
    });

    canvas.addEventListener('mouseup', () => {
      isDrawing = false;
      currentPath = null;
    });

    canvas.addEventListener('mouseleave', () => {
      isDrawing = false;
      currentPath = null;
    });

    // ── Eraser ──
    canvas.addEventListener('click', (e) => {
      if (currentTool !== 'erase') return;
      const el = document.elementFromPoint(e.clientX, e.clientY);
      if (el && el.tagName === 'path' && el.parentNode === canvas) {
        el.style.transition = 'opacity 0.2s';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 200);
      }
    });

    // ── Sticky notes ──
    function createNote(x, y) {
      const note = document.createElement('div');
      note.className = 'sticky-note';
      note.style.left = x + 'px';
      note.style.top = y + 'px';
      note.innerHTML = `
        <button class="close-btn" onclick="this.parentElement.remove()">&times;</button>
        <textarea placeholder="Type here..."></textarea>
      `;
      document.body.appendChild(note);
      makeDraggable(note);
      note.querySelector('textarea').focus();
      toast('Note created');
    }

    // ── Agent summoning ──
    function summonAgent(name) {
      agentCount++;
      const agent = agents[name] || { icon: '●', desc: `Custom agent "${name}" is ready.` };
      const displayName = name.charAt(0).toUpperCase() + name.slice(1);

      // Position in a staggered grid
      const cols = 3;
      const row = Math.floor((agentCount - 1) / cols);
      const col = (agentCount - 1) % cols;
      const x = 100 + col * 320 + (Math.random() * 40 - 20);
      const y = 120 + row * 220 + (Math.random() * 30 - 15);

      const card = document.createElement('div');
      card.className = 'agent-card';
      card.style.left = x + 'px';
      card.style.top = y + 'px';

      card.innerHTML = `
        <div class="agent-header">
          <span class="agent-name">${agent.icon} ${displayName}</span>
          <button class="close-btn" onclick="dismissAgent(this)">&times;</button>
        </div>
        <div class="agent-status">
          <span class="dot"></span>
          <span>Active</span>
        </div>
        <div class="agent-body">${agent.desc}</div>
        <div class="agent-actions">
          <button onclick="agentAction(this, 'run')">Run</button>
          <button onclick="agentAction(this, 'pause')">Pause</button>
          <button onclick="agentAction(this, 'config')">Config</button>
        </div>
      `;

      document.body.appendChild(card);
      makeDraggable(card);
      toast(`${displayName} agent summoned`);
    }

    function dismissAgent(btn) {
      const card = btn.closest('.agent-card');
      card.style.transition = 'all 0.3s ease';
      card.style.opacity = '0';
      card.style.transform = 'scale(0.8)';
      setTimeout(() => card.remove(), 300);
    }

    function agentAction(btn, action) {
      const card = btn.closest('.agent-card');
      const name = card.querySelector('.agent-name').textContent;
      const statusEl = card.querySelector('.agent-status span:last-child');
      const dotEl = card.querySelector('.dot');

      if (action === 'run') {
        statusEl.textContent = 'Running...';
        dotEl.style.animation = 'pulse 0.5s infinite';
        toast(`${name} is running`);

        // Simulate work
        setTimeout(() => {
          statusEl.textContent = 'Done';
          dotEl.style.animation = 'none';
          dotEl.style.opacity = '0.3';
          card.querySelector('.agent-body').textContent = 'Task completed successfully.';
          toast(`${name} finished`);
        }, 2000 + Math.random() * 2000);
      }
      else if (action === 'pause') {
        statusEl.textContent = 'Paused';
        dotEl.style.animation = 'none';
        toast(`${name} paused`);
      }
      else if (action === 'config') {
        toast(`${name} config — coming soon`);
      }
    }

    // ── Drag system ──
    function makeDraggable(el) {
      el.addEventListener('mousedown', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') return;
        dragTarget = el;
        dragOffset.x = e.clientX - el.offsetLeft;
        dragOffset.y = e.clientY - el.offsetTop;
        el.style.zIndex = 60;
      });
    }

    document.addEventListener('mousemove', (e) => {
      if (!dragTarget) return;
      dragTarget.style.left = (e.clientX - dragOffset.x) + 'px';
      dragTarget.style.top = (e.clientY - dragOffset.y) + 'px';
    });

    document.addEventListener('mouseup', () => {
      if (dragTarget) {
        dragTarget.style.zIndex = '';
        dragTarget = null;
      }
    });

    // ── Clear board ──
    function clearBoard() {
      canvas.innerHTML = '';
      document.querySelectorAll('.agent-card, .sticky-note').forEach(el => el.remove());
      agentCount = 0;
      toast('Board cleared');
    }
  </script>
</body>
</html>
